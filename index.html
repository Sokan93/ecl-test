const SCARS_BANK=[
  /* ── CHAPTER 1: OPENING & CONTEXT ── */
  {q:"What is the full Arabic name of Boko Haram as stated in SCARS?",o:["Jama'atu Ahlis-Sunna Lidda'Awati Wal-Jihad","Al-Qaeda fil-Maghreb al-Islamiyya","Ansar al-Shari'ah fil-Bilad","Harakat al-Mujahidin"],a:0,t:"SCARS – Ch.1",d:"hard",e:"The book opens by identifying Boko Haram's full name as 'Jama'atu Ahlis-Sunna Lidda'Awati Wal-Jihad,' a self-proclaimed Jihadist Militant Group whose campaign has had devastating economic, social, infrastructural and political impact on Nigeria."},
  {q:"In January 2016, the author requested a helicopter to visit which village in Borno State destroyed by Boko Haram?",o:["Marte","Monguno","Bitta","Gwoza"],a:2,t:"SCARS – Ch.1",d:"medium",e:"The author requested a helicopter from Air Commodore Peter Uzezi to convey his team to Bitta, a village on the bank of River Gambole, part of the Sambisa Forest plains."},
  {q:"What was the author's role when he resumed in the theatre on 5 January 2016?",o:["Theatre Commander","Chief of Army Staff","Deputy Theatre/Land Component Commander of Operation LAFIYA DOLE","Commander 5 Brigade"],a:2,t:"SCARS – Ch.1",d:"medium",e:"The author had just resumed as deputy theatre/land component commander of Operation LAFIYA DOLE on 5 January 2016."},
  {q:"Which unit was occupying a defensive position along the Michika–Shuwa–Gulak–Izge–Bitta axis?",o:["254 Task Force Battalion","53 Signals Brigade","5 Brigade","113 Task Force Battalion"],a:3,t:"SCARS – Ch.1",d:"hard",e:"Troops of the 113 Task Force Battalion were occupying a defensive position after their offensive along the Michika–Shuwa–Gulak–Izge–Bitta axis at the time of the author's visit."},
  {q:"Before resuming at the theatre in January 2016, the author had served as commander of which brigade in 2014?",o:["8 Division","5 Brigade","53 Signals Brigade","254 Task Force Battalion"],a:2,t:"SCARS – Ch.1",d:"hard",e:"The author had been part of the 113 Task Force Battalion's initial deployment in 2014 while serving as commander of 53 Signals Brigade, before a brief posting to Army Headquarters in 2015."},
  {q:"Bitta village sits on the bank of which river?",o:["River Benue","River Niger","River Gambole","River Yobe"],a:2,t:"SCARS – Ch.1",d:"hard",e:"Bitta is a village on the bank of the River Gambole, which forms part of the dreaded Sambisa Forest plains and thickets."},
  {q:"What was the name of the commanding officer of the 113 Task Force Battalion whom the author visited at Bitta?",o:["Lt Col A. Raji","Brigadier General MS Ejeh","Lt Col MA Oloyede","Air Commodore Peter Uzezi"],a:2,t:"SCARS – Ch.1",d:"hard",e:"The commanding officer of the 113 Task Force Battalion at Bitta was Lieutenant Colonel MA Oloyede, whose relief and that of his men was apparent during the author's visit."},
  {q:"The following week after Bitta, the author moved to which two locations?",o:["Chibok and Gwoza","Bama and Dikwa","Monguno and Marte","Damaturu and Potiskum"],a:2,t:"SCARS – Ch.1",d:"medium",e:"The following week after Bitta, the author moved to Monguno and Marte to visit and boost the morale of troops there."},
  {q:"At Monguno, the author received an operations brief from which commander?",o:["Lt Col A. Raji","Lt Col MA Oloyede","Brigadier General MS Ejeh of 5 Brigade","Air Commodore Peter Uzezi"],a:2,t:"SCARS – Ch.1",d:"hard",e:"At Monguno, the author received an operations brief from the commander of 5 Brigade, Brigadier General MS Ejeh."},
  {q:"What new formation was later created in Monguno partly upon the author's recommendation?",o:["1 Division","7 Division","8 Division","Theatre Command"],a:2,t:"SCARS – Ch.1",d:"hard",e:"Following re-organisation in the theatre partly upon the author's recommendation, a new formation — 8 Division — was created with its headquarters in Monguno; 5 Brigade was moved to Gubio under the new division."},
  {q:"What was the 254 Task Force Battalion at Marte noted for before the Boko Haram war?",o:["A military fortress","A shanty town","A showpiece of modern township with amenities, owing to the Chad Basin irrigation programme","A fishing village"],a:2,t:"SCARS – Ch.1",d:"medium",e:"Marte, before the war, was a showpiece of 'modern' township with all the amenities for appreciable human comfort, owed to its prime location for the Chad Basin irrigation programme. By 2016, it had been completely destroyed."},
  {q:"What were IEDs planted on the Monguno–Marte–Dikwa Road used for by Boko Haram?",o:["Signalling","Communicating with hostages","Disrupting logistics resupply to troops","Marking territorial boundaries"],a:2,t:"SCARS – Ch.1",d:"medium",e:"Boko Haram planted IEDs (Improvised Explosive Devices) on the Monguno–Marte–Dikwa Road to disrupt the logistics resupply tasks to the 254 Task Force Battalion, making replenishment extremely challenging."},
  {q:"What did the author share with the troops of 254 Task Force Battalion that became a moment of camaraderie?",o:["A bottle of wine","A loaf of cake bread baked by a friend's wife","Medals and commendations","Army rations from Lagos"],a:1,t:"SCARS – Ch.1",d:"medium",e:"The author shared a loaf of cake bread sent by his friend Pastor Danjuma Ndakwasau from Yola, whose wife had baked it. The gesture was described as reminiscent of Holy Communion and reinvigorated the troops."},
  {q:"What philosopher's quote does the author reference to describe the natural condition of mankind in the context of war?",o:["John Locke","Jean-Jacques Rousseau","Thomas Hobbes in 'Leviathan'","Immanuel Kant"],a:2,t:"SCARS – Ch.1",d:"medium",e:"The author references Thomas Hobbes' contention in 'Leviathan' that the natural condition of mankind is a state of war — 'continual fear and danger of violent death' — to explain the inevitability of conflicts."},
  {q:"According to the book, what does the acronym SCARS represent thematically?",o:["A military operation code name","The deep pains and consequences of the Boko Haram episode classified as collective harrowing experiences","A reference to physical injuries of soldiers","A government programme for security"],a:1,t:"SCARS – Ch.1",d:"medium",e:"SCARS is described as 'an attempt to highlight the deep pains and perhaps irreversible consequences of the ignoble Boko Haram episode and its threat to human security' — the agonising experiences in various shades and forms."},
  {q:"According to Zartman quoted in the book, what is conflict in relation to politics?",o:["Conflict is the failure of politics","Conflict is the basis of politics, and politics is managed conflict","Conflict and politics are unrelated","Conflict only arises from military failure"],a:1,t:"SCARS – Ch.1",d:"medium",e:"Zartman is quoted as contending that 'conflict is the basis of politics, and politics is managed conflict. Conflict is an essential and inevitable element in human interaction.'"},
  {q:"How many regional governments existed in Nigeria shortly before independence?",o:["Two","Three","Four","Five"],a:1,t:"SCARS – Ch.1",d:"easy",e:"Shortly before independence, there were three regional governments: the Eastern Region, Western Region, and Northern Region. The fourth — the Midwest Region — was established by referendum in 1963 after independence."},
  {q:"The fourth region (Midwest) was established by referendum in which year after independence?",o:["1960","1961","1963","1966"],a:2,t:"SCARS – Ch.1",d:"medium",e:"The Midwest Region was established by referendum in 1963, in deference to the Midwestern Region Act of 1962, making it the fourth region of Nigeria after independence."},

  /* ── CHAPTER 2: WHEN THE SHIELD BECOMES THE SWORD ── */
  {q:"What is the title of Chapter 2 of SCARS?",o:["The Aftermath: Echoes of Uncertainty","Pointless Pursuits","When the Shield Becomes the Sword: Nigeria's Security Dilemma","The Boko Haram Conundrum"],a:2,t:"SCARS – Ch.2",d:"easy",e:"Chapter 2 is titled 'When the Shield Becomes the Sword: Nigeria's Security Dilemma,' examining Nigeria's historical past and how the intended shield of the 1966 coup became the sword of chaos."},
  {q:"What Einstein quote does Chapter 2 open with?",o:["'Imagination is more important than knowledge'","'We cannot solve a problem from the approach that created it'","'Peace cannot be kept by force'","'The measure of intelligence is the ability to change'"],a:1,t:"SCARS – Ch.2",d:"medium",e:"Chapter 2 opens with Albert Einstein's quote: 'We cannot solve a problem from the approach that created it,' applied to Nigeria's need for new approaches to its historical challenges."},
  {q:"On what date were the Southern and Northern Protectorates of Nigeria merged into a single entity?",o:["1 January 1900","1 October 1960","1 January 1914","12 October 1906"],a:2,t:"SCARS – Ch.2",d:"medium",e:"On 1 January 1914, the Southern and Northern Protectorates were merged to become Nigeria, with Sir Frederick Lugard as governor-general."},
  {q:"The Royal Niger Company's royal charter was granted after which international conference?",o:["Congress of Vienna","Treaty of Versailles","Berlin Conference of 1884-85","Lancaster House Conference"],a:2,t:"SCARS – Ch.2",d:"medium",e:"The royal charter was granted to the National African Company (later the Royal Niger Company) in May 1886, after the Berlin Conference of 1884–85."},
  {q:"On what date was the charter of the Royal Niger Company revoked?",o:["1 January 1900","1 January 1914","1 October 1960","31 December 1899"],a:0,t:"SCARS – Ch.2",d:"hard",e:"On 1 January 1900, the Charter of the Royal Niger Company was revoked and the British Government took over administration of the territories."},
  {q:"Which constitution in 1946 established a central legislative council and three regional Houses of Assembly?",o:["Clifford Constitution","Macpherson Constitution","Richards Constitution","Lyttleton Constitution"],a:2,t:"SCARS – Ch.2",d:"medium",e:"The Richards Constitution of 1946 (named after British Governor-General Sir Arthur Richards) established a central legislative council in Lagos and regional Houses of Assembly in Enugu (East), Ibadan (West), and Kaduna (North)."},
  {q:"Who was appointed Nigeria's first Prime Minister and in which year?",o:["Nnamdi Azikiwe in 1960","Ahmadu Bello in 1957","Abubakar Tafawa Balewa in August 1957","Obafemi Awolowo in 1959"],a:2,t:"SCARS – Ch.2",d:"medium",e:"Sir Abubakar Tafawa Balewa was appointed as Nigeria's first prime minister in August 1957, though the Northern Region did not gain regional self-government until 1959."},
  {q:"Who were the premiers of the Eastern, Western, and Northern Regions before independence?",o:["Azikiwe, Awolowo, Bello","Balewa, Awolowo, Azikiwe","Azikiwe, Akintola, Bello","Macaulay, Awolowo, Bello"],a:0,t:"SCARS – Ch.2",d:"medium",e:"The premiers of the regions were Dr Nnamdi Azikiwe (Eastern), Chief Obafemi Awolowo (Western), and Sir Ahmadu Bello (Northern)."},
  {q:"In his 1957 parliamentary speech, what did Tafawa Balewa say was Nigeria's greatest concern?",o:["Economic development","Security","Unity","Independence from Britain"],a:2,t:"SCARS – Ch.2",d:"medium",e:"Tafawa Balewa declared in September 1957: 'Today, unity is our greatest concern, and it is the duty of every one of us to work to strengthen it.'"},
  {q:"What was the Action Group (AG) party's ethnic/cultural predecessor organisation?",o:["Jam'iyyar Mutanen Arewa","NCNC","Egbe Omo Oduduwa (Society of Descendants of Oduduwa)","Arewa Consultative Forum"],a:2,t:"SCARS – Ch.2",d:"hard",e:"The Action Group metamorphosed from Egbe Omo Oduduwa (Society of Descendants of Oduduwa), formalised in 1947, betraying its Yoruba regional orientation."},
  {q:"What was the NPC's ethnic predecessor organisation?",o:["Egbe Omo Oduduwa","Jam'iyyar Mutanen Arewa (Congress of Arewa People) founded 1948","Zikist Movement","NCNC"],a:1,t:"SCARS – Ch.2",d:"hard",e:"The Northern People's Congress (NPC) evolved from Jam'iyyar Mutanen Arewa (Congress of Arewa People), founded in 1948, reflecting its northern regional orientation."},
  {q:"What controversial statement attributed to Nnamdi Azikiwe in the West African Pilot betrayed an ethnic disposition?",o:["'Nigeria must remain one'","'The Ibo nation was specially created by God to lead children of Africa from bondage'","'Only Igbos can save Nigeria from ruin'","'The North must bow to the South'"],a:1,t:"SCARS – Ch.2",d:"hard",e:"Nnamdi Azikiwe was quoted by the West African Pilot saying: 'It would appear that the god of Africa has specially created the Ibo nation to lead the children of Africa from the bondage of ages...' — fuelling accusations of ethnic disposition."},
  {q:"After the 1959 Federal Elections, which two parties formed an alliance that disappointed Chief Awolowo?",o:["AG and NPC","NCNC and NPC","NCNC and AG","NNDP and NPC"],a:1,t:"SCARS – Ch.2",d:"hard",e:"Despite ongoing negotiations for an NCNC/AG alliance, Dr Azikiwe aligned the NCNC with the NPC to the disappointment of Chief Awolowo, creating the ground for ethnic rivalry."},
  {q:"Who succeeded Awolowo as premier of the Western Region?",o:["Nnamdi Azikiwe","Chief Festus Okotie-Eboh","Chief Samuel Ladoke Akintola","Chief Anthony Enahoro"],a:2,t:"SCARS – Ch.2",d:"medium",e:"Chief Samuel Ladoke Akintola, the deputy leader of the AG, succeeded Awolowo as premier of the Western Region after Awolowo chose to focus on federal politics."},
  {q:"What was the Western Region conflict nicknamed, and how long did it last?",o:["'Agbekoya' — six months","'Wetie' — approximately three months","'Operation Weytin' — one month","'Zikism' — two months"],a:1,t:"SCARS – Ch.2",d:"hard",e:"The conflict in the Western Region sparked by the disputed 1965 regional elections was nicknamed 'wetie' — a violent crisis so vicious it lasted approximately three months, leading to a state of emergency."},
  {q:"What new party did Chief Akintola establish after the 1964 elections in the Western Region?",o:["Action Group (AG)","United Progressive Grand Alliance","Nigerian National Democratic Party (NNDP)","Progressive Parties Alliance"],a:2,t:"SCARS – Ch.2",d:"hard",e:"After winning the 1964 regional elections with NPC support, Chief Akintola established the Nigerian National Democratic Party (NNDP) to whittle Awolowo's influence in the Western Region."},
  {q:"On what exact date did the January 1966 coup take place?",o:["1 January 1966","15 January 1966","29 July 1966","15 July 1966"],a:1,t:"SCARS – Ch.2",d:"easy",e:"The first military coup in Nigeria occurred on 15 January 1966, executed by mainly middle-level officers from diverse ethnic backgrounds, though the majority were of Igbo extraction."},
  {q:"Who was the leadership figure of the January 1966 coup?",o:["Lt Col Adekunle Fajuyi","Yakubu Gowon","Major Patrick Chukwuma Kaduna Nzeogwu","Major John Obienu"],a:2,t:"SCARS – Ch.2",d:"easy",e:"Major Patrick Chukwuma Kaduna Nzeogwu was the leadership figure of the January 1966 coup. He executed the plan most completely in Kaduna; the coup partially failed in Lagos, Ibadan, and Enugu."},
  {q:"Where does Nzeogwu actually hail from, and why is this significant?",o:["Enugu — so he was definitively Igbo","Okpanam in the then Midwestern Region (now Delta State) — so he was not Igbo","Kaduna — making him Hausa","Lagos — making him Yoruba"],a:1,t:"SCARS – Ch.2",d:"hard",e:"Nzeogwu hails from Okpanam in the then Midwestern Region (currently Delta State), which was part of the Western Region before the Midwest's creation. He spoke fluent Hausa. This undermines the claim that the coup was ethnically Igbo in design."},
  {q:"Who, according to the book, quashed the January 1966 coup?",o:["Yakubu Gowon","Emeka Ojukwu","Aguiyi-Ironsi, Major John Obienu and others — mainly of Igbo extraction","Northern officers only"],a:2,t:"SCARS – Ch.2",d:"hard",e:"Ironically, officers mainly of Igbo extraction — including General Aguiyi-Ironsi and Major John Obienu — fought hard to quash the January 1966 coup, contradicting the narrative that it was an 'Igbo coup.'"},
  {q:"What controversial decree did Aguiyi-Ironsi promulgate that proved unacceptable to most Nigerians?",o:["Decree No. 1 of 1966 — creating a national police force","Decree No. 34 of 1966 — abrogating regional government and substituting a unitary system","Decree No. 12 of 1966 — banning political parties","Decree No. 50 — nationalising oil"],a:1,t:"SCARS – Ch.2",d:"hard",e:"Ironsi promulgated Decree No. 34 of 1966, which abrogated the regional system of government and substituted it with a unitary system — seen as an instrument of impoverishment promulgated without consultation."},
  {q:"On what date did the counter-coup occur that led to Aguiyi-Ironsi's death?",o:["15 January 1966","1 October 1966","29 July 1966","24 February 1966"],a:2,t:"SCARS – Ch.2",d:"medium",e:"The counter-coup occurred on 29 July 1966. General Aguiyi-Ironsi was killed along with his host Lt Col Adekunle Fajuyi, the military governor of the Western Region."},
  {q:"Who was the most senior officer after Aguiyi-Ironsi's death, who should have become head of state by hierarchy?",o:["Lt Col Odumegwu Ojukwu","Brigadier Babafemi Olatunde Ogundipe","Lt Col Yakubu Gowon","Major Hassan Usman Katsina"],a:1,t:"SCARS – Ch.2",d:"hard",e:"Brigadier Babafemi Olatunde Ogundipe was the most senior officer at the time of Aguiyi-Ironsi's death — he was Chief of Staff, Supreme Headquarters. However, the counter-coup leaders favoured Gowon on ethnic grounds."},
  {q:"Where was the mediation conference held between federal and Biafran sides before the Civil War?",o:["Accra, Ghana","Lagos","London","Aburi, Ghana"],a:3,t:"SCARS – Ch.2",d:"medium",e:"The famous Aburi Accord mediation conference was held in Aburi, Ghana, presided over by Major General Joseph Arthur Ankrah, chairman of Ghana's National Liberation Council."},
  {q:"How many states did Gowon create on 27 May 1967, and from what?",o:["6 states from 3 regions","12 states from 4 regions","19 states from 12 regions","36 states from 19 states"],a:1,t:"SCARS – Ch.2",d:"medium",e:"General Gowon created 12 states from the existing 4 regions on 27 May 1967. This move was intended to balkanise the Eastern Region and check Ojukwu's influence."},
  {q:"On what date did Ojukwu declare the Republic of Biafra?",o:["15 January 1967","27 May 1967","30 May 1967","1 October 1967"],a:2,t:"SCARS – Ch.2",d:"medium",e:"On 30 May 1967, Ojukwu declared the Republic of Biafra, comprising the Eastern Region under the four-regional arrangement, triggering the thirty-month bloody civil war."},
  {q:"Who signed the Article of Surrender that formally ended the Civil War on behalf of Biafra?",o:["Odumegwu Ojukwu","Philip Effiong","Babafemi Ogundipe","Adekunle Fajuyi"],a:1,t:"SCARS – Ch.2",d:"medium",e:"The Civil War ended on 15 January 1970 with the signing of the Article of Surrender by Major General Philip Effiong, the chief of defence staff of Biafra, following Ojukwu's flight into exile."},
  {q:"What was General Yakubu Gowon's famous post-Civil War policy statement?",o:["'Reconstruction, Rehabilitation, Reconciliation'","'No Victor, No Vanquished'","'To Keep Nigeria One is a Task that Must be Done'","'Forgive and Forget'"],a:1,t:"SCARS – Ch.2",d:"easy",e:"General Gowon's policy of 'No Victor, No Vanquished' at the end of the Civil War was hailed for promoting healing and reconciliation, even though the book notes it appeared more theoretical than empirical."},

  /* ── CHAPTER 3: THE AFTERMATH ── */
  {q:"What is the title of Chapter 3 of SCARS?",o:["When the Shield Becomes the Sword","Pointless Pursuits","The Aftermath: Echoes of Uncertainty","The Boko Haram Conundrum"],a:2,t:"SCARS – Ch.3",d:"easy",e:"Chapter 3 is titled 'The Aftermath: Echoes of Uncertainty,' examining the three dominant issues anchoring instability in Nigeria after the Civil War."},
  {q:"According to Chapter 3, what are the three dominant issues upon which manifestations of instability in Nigeria are anchored?",o:["Poverty, disease, and ignorance","Corruption, election rigging, and tribalism","Struggle for power, revenue allocation, and fear of domination","Military coups, oil theft, and terrorism"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book identifies three dominant issues: the struggle for control of power and authority within the state, revenue allocation (sharing of the 'National Cake'), and fear of domination by one group over another."},
  {q:"Approximately how many ethnic groups does SCARS state Nigeria has?",o:["Over 100","Over 250","Over 400","Over 500"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book states there are over 400 ethnic groups in Nigeria — so many that anthropologists have not determined the exact number of ethnic nationalities."},
  {q:"What are Nigeria's three major ethnic groups as identified in the book?",o:["Ijaw, Efik, and Tiv","Hausa, Igbo, and Yoruba","Fulani, Kanuri, and Nupe","Igbo, Yoruba, and Ijaw"],a:1,t:"SCARS – Ch.3",d:"easy",e:"The book identifies Nigeria's three major ethnic groups by population as Hausa (North), Igbo (East), and Yoruba (West)."},
  {q:"According to the Dead Horse Theory in the book, what is the best strategy when you discover you are riding a dead horse?",o:["Ride it harder","Change the jockey","Dismount","Appoint a committee"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The Dead Horse Theory from the tribal wisdom of the Dakota Indians states: 'when you discover that you are riding a dead horse, the best strategy is to dismount.' It is used in the book to illustrate Nigeria's pattern of clinging to failed approaches."},
  {q:"From which people's tribal wisdom does the Dead Horse Theory derive, according to the book?",o:["Zulu people of South Africa","Apache Nation of America","Dakota Indians","Maori of New Zealand"],a:2,t:"SCARS – Ch.3",d:"hard",e:"The Dead Horse Theory derives from the tribal wisdom of the Dakota Indians, a tradition passed down from generation to generation."},
  {q:"What post-war policy requiring university graduates to serve in other parts of Nigeria was introduced to promote unity?",o:["The Federal Character Principle","Nomadic Education Programme","The National Youth Service Corps (NYSC)","Unity Schools Initiative"],a:2,t:"SCARS – Ch.3",d:"easy",e:"The National Youth Service Corps (NYSC) programme was introduced — requiring youths to travel to other parts of Nigeria for one-year mandatory service — as one of the few credible attempts to promote national unity and integration."},
  {q:"According to World Bank sources cited in the book, what percentage of Nigeria's poor are located in the North?",o:["50%","65%","75%","87%"],a:3,t:"SCARS – Ch.3",d:"hard",e:"The book cites World Bank sources stating that 87% of the poor — the lumpenproletariat — in Nigeria are located in the North, underscoring the urgent need for a change in strategy."},
  {q:"Which Emir is quoted in the book about the Sharia movement and its link to Boko Haram?",o:["Emir of Kano Muhammadu Sanusi II","Emir Sanusi Lamido Sanusi","Sultan of Sokoto Muhammad Sa'ad Abubakar","Emir of Zaria"],a:1,t:"SCARS – Ch.3",d:"hard",e:"Emir Sanusi Lamido Sanusi is quoted extensively on how the 'Sharia Movement' — beginning with Zamfara State in 1999 — politicised religion, created radical space, and diverted resources from development, contributing to the emergence of Boko Haram."},
  {q:"Which state first adopted 'full implementation' of Sharia in 1999, according to the book?",o:["Kano","Sokoto","Zamfara","Borno"],a:2,t:"SCARS – Ch.3",d:"medium",e:"Beginning with Zamfara State in 1999, twelve states in Northern Nigeria adopted 'full implementation' of Sharia including its criminal code, according to the book."},
  {q:"The Niger Delta struggle for self-determination was spearheaded in the 1960s by which figure?",o:["Ken Saro-Wiwa","Edwin Clark","Isaac Adaka Boro","Asari Dokubo"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The Ijaw National Struggle for self-determination was spearheaded in the 1960s by the late Isaac Adaka Boro, leading to the Kaiama declaration and formation of MEND."},
  {q:"What does MEND stand for in the context of Niger Delta militancy?",o:["Movement for the Emancipation of the Niger Delta","Military Enforcement of Niger Delta","Movement for the Elimination of Niger Delta Degradation","Militant Enforcement of Natural Delta"],a:0,t:"SCARS – Ch.3",d:"medium",e:"MEND stands for Movement for the Emancipation of the Niger Delta, formed from the Niger Delta self-determination struggle that evolved from Isaac Adaka Boro's movement and the Kaiama declaration."},
  {q:"The Max Weber quote on statehood referenced in the book is from which essay?",o:["'The Protestant Ethic and the Spirit of Capitalism'","'Economy and Society'","'Politics as a Vocation' (1919)","'Science as a Vocation'"],a:2,t:"SCARS – Ch.3",d:"hard",e:"The book references Max Weber's essay 'Politics as a Vocation' (1919), which defines a state as a political organisation that 'successfully upholds a claim to the monopoly of the legitimate use of physical force.'"},
  {q:"According to the book, what is Fred M. Vinson's view on the cause of wars?",o:["Wars are inevitable acts of God","'Wars are not acts of God. They are caused by man, by man-made institutions...'","Wars are caused by religious differences alone","Wars are caused by poverty and nothing else"],a:1,t:"SCARS – Ch.3",d:"medium",e:"Fred M. Vinson is quoted: 'Wars are not acts of God. They are caused by man, by man-made institutions, by the way in which man has organised his society. What man has made, man can change.'"},
  {q:"What does McNamara's quote in the book say about security?",o:["Security is primarily military hardware","Security is development, and without development, there can be no security","Security is police and military forces combined","Security is impossible in Africa"],a:1,t:"SCARS – Ch.3",d:"medium",e:"McNamara is quoted: 'Security is not military hardware, though it may include it... Security is development, and without development, there can be no security.' — supporting a holistic, human-centred approach."},
  {q:"What does the book say was the post-Civil War treatment of savings that fuelled grievances?",o:["All accounts were frozen for 10 years","The government paid twenty pounds irrespective of how much one had in the bank","Accounts were transferred to northern banks","Savings were converted to Biafran currency"],a:1,t:"SCARS – Ch.3",d:"hard",e:"The book notes the payment of twenty pounds to everyone irrespective of the value of how much one actually had in the bank after the civil war — a policy that has been latched onto for violent agitations in the South-East."},
  {q:"What was the Kafanchan and Zangon Kataf crises of 1990 and 2000 characterised by?",o:["Oil pipeline vandalism","Farmer-herder clashes only","Ethnic and religious overtones","Student protests"],a:2,t:"SCARS – Ch.3",d:"hard",e:"The clashes in Kafanchan and Zangon Kataf in Kaduna State in 1990 and 2000 had ethnic and religious overtones, contributing to the deepening of radicalism and militant postures in the region."},
  {q:"What does IPOB/ESN stand for in the context of South-East agitation discussed in the book?",o:["Independent Peoples of Biafra / Eastern Security Network","Indigenous People of Biafra / Eastern Security Network","Internal Protection of Biafra / Eastern Surveillance Network","Independent People of Biafra / Emancipation Security Network"],a:1,t:"SCARS – Ch.3",d:"medium",e:"IPOB/ESN stands for Indigenous People of Biafra / Eastern Security Network — a restive group whose ideology the book attributes to entrenched sentiments of alienation from Nigeria's socio-political equation."},
  {q:"According to the book, who wrote the book 'Why We Struck' about the 1966 coup?",o:["Olusegun Obasanjo","Ibrahim Babangida","Major Adewale Ademoyega","Frederick Forsyth"],a:2,t:"SCARS – Ch.3",d:"hard",e:"Major Adewale Ademoyega, a key planner of the January 1966 coup, wrote 'Why We Struck,' in which he explicitly stated that there was no decision to single out any ethnic group for elimination."},
  {q:"What book by Olusegun Obasanjo is referenced in SCARS regarding Nzeogwu?",o:["'My Watch'","'Nzeogwu: An Intimate Portrait of Major Chukwuma Kaduna Nzeogwu'","'Not My Will'","'A Journey in Service'"],a:1,t:"SCARS – Ch.3",d:"hard",e:"Obasanjo's book 'Nzeogwu: An Intimate Portrait of Major Chukwuma Kaduna Nzeogwu' is referenced, in which Obasanjo describes Nzeogwu as a man who dreamt of a great Nigeria where merit overrides ethnic considerations."},
  {q:"What book by Ibrahim Babangida is referenced in SCARS?",o:["'My Command'","'A Journey in Service'","'Military Politics in Nigeria'","'The Babangida Years'"],a:1,t:"SCARS – Ch.3",d:"hard",e:"Ibrahim Babangida's book 'A Journey in Service' is referenced in SCARS, in which Babangida corroborates that ethnic sentiments likely did not drive the original objective of the January 1966 coup plotters."},
  {q:"According to the book, what is the role of the NYSC in promoting national unity?",o:["To train soldiers for combat","To promote unity, inculcate national identity, and develop moral, social and leadership skills of graduates","To replace the military in internal security","To collect taxes from graduates"],a:1,t:"SCARS – Ch.3",d:"easy",e:"The NYSC programme's primary objectives include promoting national unity and integration, inculcating a sense of national identity, and developing the moral, social, and leadership skills of young Nigerian university graduates."},
  {q:"According to the book, what was Nigeria controversially admitted into that polarised the country along religious lines?",o:["The United Nations Security Council","Organisation of Islamic Countries (OIC)","The Commonwealth","OPEC"],a:1,t:"SCARS – Ch.3",d:"hard",e:"The book cites Nigeria's controversial admission into the Organisation of Islamic Countries (OIC) as having polarised the country along religious lines, despite Nigeria's constitution being founded on secular principles."},
  {q:"What key word was introduced into Nigeria's public sector lexicon as a result of perceived lopsided appointments?",o:["Tribalism","Nepotism","Marginalisation","Sectionalism"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book states that perceived lopsided appointments to key positions led to feelings of alienation, introducing the word 'marginalisation' into Nigeria's public sector administration lexicon — widely used since across all sectors."},
  {q:"The book proposes that the military-centric approach to Boko Haram should pivot to what kind of strategy?",o:["A purely diplomatic approach","A more inclusive strategy harnessing non-military elements of state power","Increased military spending only","Withdrawal from the North-East"],a:1,t:"SCARS – Ch.3",d:"medium",e:"The book argues that while the military approach is important, it should pivot to a more inclusive strategy that harnesses non-military elements of state power — political, economic, social, and cultural endowments alongside military capabilities."},
  {q:"What is SCARS' overall conclusion on the root cause of Nigeria's security challenges including Boko Haram?",o:["Boko Haram is purely a foreign-induced problem","The military is entirely to blame","The challenges are rooted in structural weaknesses from socio-political fissures, ethnic divisions, governance failures, and a failure of nationhood","Nigeria's security challenges are solely due to poverty"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book concludes that insecurity stems from systemic structural weaknesses occasioned by socio-political issues — ethnic/regional divisions, religious intolerance, governance failures — and the failure to cultivate true nationhood."},
  {q:"According to the book, what must elites across all regions ultimately do to move Nigeria forward?",o:["Demand more federal allocations","Seek military intervention","Abandon ethnic and religious biases, embrace dialogue, inclusivity, and merit-based governance for collective good","Establish more regional assemblies"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book calls on elites across all regions to abandon ethnic and religious biases, embrace dialogue, inclusivity, and merit-based governance, dismount from 'dead horses,' and focus on collective national good for a secure, united, prosperous Nigeria."},
  {q:"Former VP Osinbajo is quoted in the book making a point about what social phenomenon?",o:["Religious extremism","Political corruption","Ethnic stereotypes — arguing that generalizations about tribes are false and shape unjust judgements","Revenue allocation formula"],a:2,t:"SCARS – Ch.3",d:"hard",e:"Former VP Osinbajo is quoted at the NIPSS lecture series, arguing that stereotypes about various ethnic groups — whether about Ijebus, Igbos, Fulanis, or others — are generalizations 'most likely to be false' but shape judgements before people even interact."},
  {q:"Which philosopher's theory is used at the end of Chapter 3 to describe the role of porous borders in Nigeria's insecurity?",o:["Thomas Hobbes","Max Weber","A direct observation by the author — not a philosopher","John Locke"],a:2,t:"SCARS – Ch.3",d:"hard",e:"At the close of Chapter 3, the author himself observes that porous borders allowed for cross-border banditry and arms proliferation, while insufficient cooperation among security agencies hampered coordinated responses — this is the author's own analysis, not attributed to a philosopher."},
  {q:"The book states that the North is no longer monolithic. Which of the following is NOT listed as an ethnic group in the Northern region?",o:["Kanuri","Berom","Ijaw","Tiv"],a:2,t:"SCARS – Ch.3",d:"hard",e:"The book lists Kanuri, Berom, Angas, Dakarkari/C'lela, Kamberi, Gbagyi, Nupe, Igala, Ebira, Tiv, Jukun, Idoma, Tarok, and Babur as northern ethnic groups. The Ijaw are a southern (Niger Delta) group, not listed among the northern groups."},
  {q:"What does the UNDP's human security perspective, referenced in the book, advocate for?",o:["More military spending","Focus on the military as protector of state sovereignty","Focus on people — eliminating poverty, inequality, fear and anxiety — as the reason for states' existence","Complete demilitarisation of African states"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The UNDP's human security perspective advocates that government efforts should focus on people — who are the reason for the existence of states — eliminating poverty, social inequality, fear, and anxiety through a multidimensional approach."},
  {q:"What does the book say decolonisation was used as a precondition for, regarding the USA's Marshall Plan?",o:["Joining the UN","Receiving NATO protection","European reconstruction after World War II","Free trade agreements with Africa"],a:2,t:"SCARS – Ch.3",d:"hard",e:"The book states that decolonisation was a precondition imposed by the US for the Marshall Plan on the reconstruction of Europe after World War II — giving African independence movements international leverage."},
  {q:"Which African leaders are cited in the book as contemporaries of Nigeria's independence leaders who shared similar goals?",o:["Mandela, Mugabe, Nkrumah","Nkrumah, Olympio, Senghor, Kenyatta, Nyerere, Lumumba, Houphouët-Boigny","Haile Selassie, Idi Amin, Mobutu","Nasser, Gaddafi, Nkrumah"],a:1,t:"SCARS – Ch.2",d:"hard",e:"The book cites Kwame Nkrumah (Ghana), Sylvanus Olympio (Togo), Leopold Senghor (Senegal), Jomo Kenyatta (Kenya), Julius Nyerere (Tanzania), Patrice Lumumba (DRC), and Félix Houphouët-Boigny (Ivory Coast) as contemporary African independence leaders."},
  {q:"What general argument does the book make about the January 1966 coup and the military institution?",o:["The military as an institution planned and executed the coup for ethnic reasons","All coup plotters were solely Igbo in origin","No coup in Nigeria has had full military participation — civilian actors have always been involved; the 'military coup' label is therefore misleading","The military should be praised for every coup as acts of patriotism"],a:2,t:"SCARS – Ch.3",d:"hard",e:"The book argues that 'there has never been any full-fledged coup d'état in Nigeria by a group of military officers without civilian participation,' making the label 'military coup d'état' misleading and damaging to the image of the military institution."},
  {q:"Which Frederick Forsyth described the idea of an 'Igbo coup' as and what was his background?",o:["A Nigerian journalist who praised the coup","A diplomat who endorsed the ethnic interpretation","A British BBC diplomatic correspondent in Biafra who described it as 'an invention' contrary to the facts","A CIA operative who fabricated the coup story"],a:2,t:"SCARS – Ch.2",d:"hard",e:"Frederick Forsyth, a non-Nigerian who served as BBC diplomatic correspondent in Biafra, described the 'Igbo coup' narrative as 'an invention that came long after the coup' and 'at variance with the facts' — arguing it was a ploy to justify massacres of Igbos."},
  {q:"What is SCARS' argument about why the Boko Haram challenge cannot be solved by military action alone?",o:["The military is too small","Military action is too expensive","The roots are socio-political and economic — requiring political, economic, social, and cultural elements of state power in a holistic strategy","Boko Haram has better weapons than the military"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book argues that because Boko Haram's roots lie in governance failure, poverty, ethnic/religious weaponisation, and structural inequality, a military-centric approach must pivot to a broader strategy harnessing all elements of state power."},

  /* ── ADDITIONAL SCARS QUESTIONS ── */
  {q:"What is the full title of the book SCARS?",o:["SCARS: My Military Journey","SCARS: The Boko Haram War","SCARS: Nigeria's Journey and the Boko Haram Conundrum","SCARS: A General's Memoir"],a:2,t:"SCARS – Overview",d:"easy",e:"The full title of the book is 'SCARS: Nigeria's Journey and the Boko Haram Conundrum,' authored by General Lucky Irabor."},
  {q:"How many chapters does SCARS contain?",o:["10","12","14","16"],a:2,t:"SCARS – Overview",d:"medium",e:"SCARS is divided into 14 chapters spread across three distinct parts covering Nigeria's historical journey, the Boko Haram insurgency, and proposed solutions."},
  {q:"Into how many parts is SCARS divided?",o:["Two","Three","Four","Five"],a:1,t:"SCARS – Overview",d:"easy",e:"SCARS is structured in three parts: Nigeria's historical context and roots of security challenges; the devastating impact of Boko Haram; and paradigm shifts needed to restore peace."},
  {q:"What post did General Irabor hold as Nigeria's highest military officer before his retirement?",o:["Chief of Army Staff","Chief of Naval Staff","Chief of Defence Staff","Theatre Commander Operation LAFIYA DOLE"],a:2,t:"SCARS – Overview",d:"easy",e:"General Lucky Irabor served as Nigeria's Chief of Defence Staff (CDS) — the highest military position in Nigeria's armed forces — before retirement."},
  {q:"What does the author say the book is NOT intended to do?",o:["Provide military solutions","Indict individuals or apportion blame","Discuss Nigeria's history","Analyse Boko Haram's tactics"],a:1,t:"SCARS – Overview",d:"medium",e:"The author explicitly states the book is not written to indict individuals or apportion blame, but to stimulate national dialogue, reflection, and inspire credible solutions to Nigeria's security challenges."},
  {q:"Which operation was the Nigerian military's counter-insurgency operation against Boko Haram in the North-East?",o:["Operation ZAMAN LAFIYA","Operation PYTHON DANCE","Operation LAFIYA DOLE","Operation SAFE CORRIDOR"],a:2,t:"SCARS – Ch.1",d:"easy",e:"Operation LAFIYA DOLE (meaning 'Peace by All Means' in Hausa) was the Nigerian military's multi-service counter-insurgency operation against Boko Haram in the North-East."},
  {q:"What does 'LAFIYA DOLE' mean in Hausa?",o:["Fight to the finish","Peace by force/by all means","No retreat no surrender","Victory is certain"],a:1,t:"SCARS – Ch.1",d:"medium",e:"'LAFIYA DOLE' translates from Hausa as 'Peace by Force' or 'Peace by All Means' — reflecting the military's determination to restore peace in the North-East."},
  {q:"Who was the first colonial administrator of the Lagos Colony from 1862?",o:["Sir Frederick Lugard","Sir Arthur Richards","Captain John Beecroft","Captain Benjamin Campbell"],a:3,t:"SCARS – Ch.2",d:"hard",e:"Captain Benjamin Campbell was the first administrator of the Lagos Colony from 1862 — the commencement of formal British colonial rule in what would become Nigeria."},
  {q:"The book states that the four key drivers of violent extremism in Nigeria include all of the following EXCEPT which one?",o:["Unaddressed political grievances","Weaponisation of religion and tribe","Weak institutions and biased legal framework","Insufficient military hardware"],a:3,t:"SCARS – Ch.3",d:"medium",e:"The book identifies four key drivers: unaddressed political grievances, weaponisation of religion and tribe, a biased legal framework, and weakened institutions. Insufficient military hardware is not listed as a root driver."},
  {q:"Which state in Nigeria first achieved regional self-government in 1957?",o:["Northern Region","Eastern Region","Western Region","Midwest Region"],a:2,t:"SCARS – Ch.2",d:"medium",e:"The Western Region achieved self-government first in 1957, followed by the Eastern Region in the same year. The Northern Region was the last to achieve self-government in 1959."},
  {q:"The book describes Mohammed Yusuf as having established Boko Haram in which city?",o:["Kano","Damaturu","Maiduguri","Abuja"],a:2,t:"SCARS – Ch.3",d:"easy",e:"Mohammed Yusuf established Boko Haram in Maiduguri, Borno State, around 2002. The group escalated into armed insurgency around 2009 following Yusuf's extrajudicial killing."},
  {q:"What does the book argue about the relationship between poverty, illiteracy, and insurgency in the North-East?",o:["Poverty and illiteracy have no connection to insurgency","Insurgency causes poverty but poverty does not cause insurgency","High poverty and illiteracy rates created fertile recruiting ground for Boko Haram","Only foreign funding drives Boko Haram, not domestic conditions"],a:2,t:"SCARS – Ch.3",d:"medium",e:"The book argues that the high rates of poverty and illiteracy in the North-East — among the worst in Nigeria — created fertile ground for Boko Haram's recruitment, making economic marginalisation a key structural driver."},
  {q:"What does the book say about the state of Marte when the author visited compared to its pre-war condition?",o:["It had been rebuilt and was thriving","It was partially damaged but functional","It had been completely destroyed — a ghost town — in stark contrast to its former status as a modern township","It had never been developed before the war"],a:2,t:"SCARS – Ch.1",d:"medium",e:"The book contrasts Marte's pre-war status as a thriving modern township with amenities (due to the Chad Basin irrigation programme) against what the author found in 2016 — complete destruction, a ghost town, a haunting illustration of Boko Haram's devastation."},
  {q:"What does General Irabor say the ultimate goal of SCARS is for Nigeria?",o:["To glorify military service","To seek international sympathy for Nigeria","To stimulate meaningful national conversation aimed at credible solutions for a secure, united, and prosperous Nigeria","To document war crimes committed by Boko Haram"],a:2,t:"SCARS – Overview",d:"easy",e:"The ultimate goal of SCARS, as stated by General Irabor, is to stimulate a meaningful national conversation and inspire credible solutions — turning Nigeria's scars into symbols of resilience on the path to becoming a secure, united, and prosperous nation."},

  /* ── FINAL 4 ── */
  {q:"The book references the Sambisa Forest as a stronghold of Boko Haram. In which state is Sambisa Forest located?",o:["Yobe State","Adamawa State","Borno State","Gombe State"],a:2,t:"SCARS – Ch.1",d:"easy",e:"The Sambisa Forest is located in Borno State, North-East Nigeria. It served as Boko Haram's principal operational base and hideout throughout the insurgency."},
  {q:"What does the book say about the importance of the 'human dimension' in counter-insurgency?",o:["Winning battles is all that matters","Hearts and minds of the civilian population are irrelevant","Winning the hearts and minds of the civilian population is as critical as military victories","Counter-insurgency is purely a police function"],a:2,t:"SCARS – Ch.3",d:"medium",e:"SCARS emphasises that in counter-insurgency, winning the hearts and minds of the civilian population is as critical as — if not more than — military victories, since insurgencies feed on alienated communities."},
  {q:"The book argues that Nigeria's constitution describes the country as a federation but operates more like what?",o:["A confederation","A unitary state — with excessive central control contradicting true federal principles","A parliamentary democracy","A presidential monarchy"],a:1,t:"SCARS – Ch.3",d:"hard",e:"The book argues that despite Nigeria's constitutional description as a federation, the country operates more like a unitary state, with excessive concentration of power and resources at the centre contradicting true federal principles and fuelling regional agitations."},
  {q:"Which of these best summarises the central thesis of SCARS?",o:["Nigeria's military is the solution to all its problems","Nigeria's insecurity is purely external in origin","Nigeria's security challenges, including Boko Haram, are symptoms of deeper failures of governance, nationhood, and inclusion that demand structural solutions beyond military force","Nigeria should split into multiple countries to achieve peace"],a:2,t:"SCARS – Overview",d:"easy",e:"The central thesis of SCARS is that Nigeria's security challenges — including Boko Haram — are symptoms of deeper structural failures: governance deficits, ethnic and religious exploitation, economic marginalisation, and the failure to build a truly inclusive nation. Military force alone cannot solve them."}
];

  {q:"Which three states does the book describe as the 'frontline states' — the pulse of the North-East?",o:["Bauchi, Gombe, Taraba","Borno, Yobe, Adamawa","Borno, Bauchi, Gombe","Yobe, Adamawa, Taraba"],a:1,t:"SCARS II – Ch.4",d:"easy",e:"The book identifies Borno, Yobe, and Adamawa as the three frontline states that constitute the pulse of the North-East and bear the greatest brunt of the Boko Haram insurgency."},
  {q:"The North-East Region covers approximately what fraction of Nigeria's total landmass?",o:["One-fifth","One-quarter","One-third","One-half"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"The North-East Region covers nearly one-third of Nigeria's total landmass, making it the country's largest geopolitical zone by area."},
  {q:"What is the highest point in Nigeria, and in which state is it located?",o:["Gwoza Hills in Borno State","Mandara Mountains in Adamawa State","The Mambila Plateau in Taraba State at over 1,800 metres","Chappal Waddi in Taraba State"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"The Mambila Plateau in Taraba State is the highest point in Nigeria, with an elevation of over 1,800 metres above mean sea level."},
  {q:"The Gwoza Hills in Borno State reach heights of up to how many metres above sea level?",o:["500 metres","900 metres","1,300 metres","1,800 metres"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The Gwoza Hills in Borno State and surrounding areas in Adamawa State comprise rocky and hilly terrain with heights reaching up to 1,300 metres above mean sea level."},
  {q:"What river forms Borno State's border with the Niger Republic before reaching Lake Chad?",o:["River Benue","Yedseram River","Chari River","Yobe River (Komadugu-Yobe)"],a:3,t:"SCARS II – Ch.4",d:"hard",e:"The Yobe River (Komadugu-Yobe) forms Borno State's border with the Niger Republic until it reaches the lakebed of Lake Chad."},
  {q:"Nigeria shares its North-East border with how many countries?",o:["Two","Three","Four","Five"],a:1,t:"SCARS II – Ch.4",d:"easy",e:"The North-East Region shares international boundaries with three countries: the Republic of Niger, Chad, and Cameroon."},
  {q:"What is the significance of Potiskum Town in the North-East's economy?",o:["It is the headquarters of MNJTF","It hosts Nigeria's largest cattle market","It is the largest fishing port in the region","It has Nigeria's largest gum Arabic processing plant"],a:1,t:"SCARS II – Ch.4",d:"medium",e:"Potiskum Town hosts Nigeria's largest cattle market, making the North-East region a major player in the supply of animals across the country."},
  {q:"The emirate system in Borno State has how many tiers of authority?",o:["Two","Three","Four","Five"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The emirate system in Borno State has four tiers: the Shehu at state level, the Aji (Hakimi) at district level, and the Lawan and Bulama at ward and neighbourhood levels."},
  {q:"According to the book, which individuals are often regarded as the most influential within their communities in Borno's emirate system?",o:["The Shehu and the Aji","The governor and senators","The Lawan and Bulama","The religious scholars and imams"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The Bulamas and Lawans are often regarded as the most influential individuals within their communities in Borno's emirate system — forming the grassroots of local governance and community mobilisation."},
  {q:"How many emirate councils does Yobe State have?",o:["7","10","14","18"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"Yobe State has 14 emirate councils, each led by a traditional ruler. Notable emirates include Damaturu, Nguru, Bade, and Potiskum."},
  {q:"The Adamawa emirate system was established by whom and in what year?",o:["Usman Dan Fodio in 1804","Modibbo Adama in 1809","Rabeh in 1893","Mohammed Yusuf in 2002"],a:1,t:"SCARS II – Ch.4",d:"medium",e:"The Adamawa emirate system was established by Modibbo Adama in 1809 during the Fulani Jihad, with headquarters in Yola as part of the broader Fulani Empire expansion."},
  {q:"What percentage of Borno State's Internally Generated Revenue (IGR) growth was recorded over five years from 2017 to 2022 according to the BudgIT report?",o:["8.93%","12.5%","18.93%","25%"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The 2023 BudgIT State of States Report showed a steady Year-On-Year growth of 18.93% in Borno State's IGR over five years from 2017 to 2022."},
  {q:"According to UNICEF data cited in the book, what percentage of Borno State's children are out of school?",o:["Nearly 50%","Nearly 60%","Nearly 75%","Nearly 90%"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"UNICEF data cited in the book states that Borno State has the highest rate of out-of-school children in Nigeria — nearly 75%, or over 1.4 million children."},
  {q:"What literacy rate did UNESCO record for Borno State in its 2012 Report?",o:["24.5%","18.2%","14.5%","9.1%"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"UNESCO's 2012 Report recorded a literacy rate of 14.5% for Borno State — one of the lowest in Nigeria — creating fertile ground for radicalisation."},
  {q:"What percentage of out-of-school children did the 2020 Nigeria Education Data Survey record for Yobe State?",o:["37%","47%","57%","67%"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The 2020 Nigeria Education Data Survey recorded that Yobe State had 57% of out-of-school children, among the highest in the country."},
  {q:"What poverty rate did the Nigerian Living Standard Survey 2018/2019 record for Adamawa State?",o:["55.41%","65.41%","75.41%","85.41%"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The Nigerian Living Standard Survey 2018/2019 placed Adamawa State as the 5th poorest state with a 75.41% poverty rate."},
  {q:"Lake Chad spans how many riparian countries?",o:["Two","Three","Four","Five"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"Lake Chad spans four riparian countries: Chad, Cameroon, Niger, and Nigeria."},
  {q:"The book states that Lake Chad has lost what proportion of its original size?",o:["Over 30%","Over 50%","Over 70%","Over 90%"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"According to the book, Lake Chad has lost over 70% of its original size due to climate change, desertification, and human activity — devastating livelihoods and contributing to instability."},
  {q:"What does 'Kwanta-Kwanta' mean in the Hausa language, and what were they known for?",o:["'Bandits' — cattle rustlers","'Lie down' — a criminal gang that robbed traders and rustled cattle along the Mandara Mountains before Boko Haram","'Fighters' — a militia that fought colonial forces","'Enemies' — a term for Boko Haram members"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"'Kwanta-Kwanta' literally means 'lie down' in Hausa. This criminal gang operated along the Ngowshe–Warabe–Pulka–Gwoza axis, robbing traders and rustling cattle across international borders into Sambisa Forest — predating and later aligning with Boko Haram."},
  {q:"In which year was the Multi-National Joint Task Force (MNJTF) established to combat criminal activities in the Lake Chad region?",o:["1986","1990","1994","2002"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"The Multi-National Joint Task Force (MNJTF) was established in 1994 by riparian states of Lake Chad — comprising troops from Nigeria, Chad, and Niger — to checkmate criminal activities, with headquarters located in Baga."},
  {q:"Where was the original headquarters of the MNJTF located?",o:["Maiduguri","Monguno","Baga","Dikwa"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The headquarters of the Multi-National Joint Task Force was originally located in Baga, on the shores of Lake Chad in Borno State."},
  {q:"Who was Rabeh, mentioned in the book's historical context of the Kanem-Bornu Empire?",o:["A British colonial officer who fought the Kanuri","A Shuwa Arab who ransacked Kanem-Bornu and transferred its capital from Kukawa to Dikwa","The founder of the Borno emirate system","A French explorer who mapped the Chad Basin"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"Rabeh was a Shuwa Arab who ransacked much of Kanem-Bornu, became its ruler, and transferred the empire's capital from Kukawa to Dikwa. He was described as vicious until his defeat during European colonisation in the last decade of the 19th century."},
  {q:"What are the combined land area and percentage of Nigeria's total landmass accounted for by the three frontline NE states?",o:["100,000 km² — 11%","153,317 km² — 16%","200,000 km² — 22%","250,000 km² — 27%"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"The combined landmass of Borno (70,898 km²), Yobe (45,502 km²), and Adamawa (36,917 km²) is 153,317 km², representing 16% of Nigeria's total landmass of 923,768 km²."},

  /* ── CHAPTER 5: BRIEF OVERVIEW OF BOKO HARAM ── */
  {q:"What does 'Boko' mean in the Hausa language?",o:["Forbidden","Western education","Violence","Jihad"],a:1,t:"SCARS II – Ch.5",d:"easy",e:"'Boko' means 'western education' in the Hausa language, while 'Haram' is Arabic for forbidden — making 'Boko Haram' mean 'Western education is forbidden.'"},
  {q:"When did the violent inclinations of Boko Haram first become manifest?",o:["January 2002","December 2003","February 2009","July 2009"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"The violent inclinations of Boko Haram became manifest in February 2009 as a result of a clash with state authorities that shut down Maiduguri Metropolis for 3 days before military troops were deployed."},
  {q:"According to the book, how many people has Boko Haram's terror displaced?",o:["More than 500,000","More than 1 million","More than 2 million","More than 5 million"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"The book states that Boko Haram has claimed several lives, displaced more than 2 million people, and caused infrastructure damage estimated at $100 billion."},
  {q:"What is the estimated infrastructure damage caused by Boko Haram cited in the book?",o:["$10 billion","$50 billion","$100 billion","$200 billion"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"The book states Boko Haram caused damage to infrastructure estimated at $100 billion, not counting the immeasurable psychological damage to communities."},
  {q:"Boko Haram first declared Sharia as implemented in Zamfara State was on which date?",o:["27 October 1999","27 January 2000","1 June 2001","1 October 1999"],a:0,t:"SCARS II – Ch.5",d:"hard",e:"Zamfara State declared the adoption of Sharia on 27 October 1999, with it coming into force on 27 January 2000 — making it the first state to implement Sharia in the current democratic era."},
  {q:"Borno State adopted Sharia to take effect on which date?",o:["27 January 2000","1 March 2001","1 June 2001","1 October 2001"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"Borno State adopted Sharia to take effect on 1 June 2001, making it one of 12 northern states to adopt the policy."},
  {q:"How many states in Northern Nigeria adopted Sharia according to the book?",o:["8","10","12","14"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"A total of 12 states in Northern Nigeria adopted Sharia: Bauchi, Borno, Gombe, Jigawa, Kaduna, Kano, Katsina, Kebbi, Niger, Sokoto, Yobe, and Zamfara."},
  {q:"Mohammed Yusuf was appointed to which body by the Borno State Government in 2001?",o:["The State Security Council","The Sharia Implementation Committee","The Borno State Advisory Council","The Islamic Education Board"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"The Borno State Government established the Sharia Implementation Committee on 3 February 2001 and appointed Mohammed Yusuf as a member — before he abandoned the committee after disagreements."},
  {q:"What was the name of the mosque Mohammed Yusuf established in Maiduguri that became Boko Haram's base?",o:["Muhammadu Indimi Mosque","Alhaji Muhammadu Ndimi Mosque","Ibn Taimiyyah Masjid","Al-Firdausi Mosque"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"Mohammed Yusuf established the Ibn Taimiyyah Masjid in Maiduguri, near the railway station, owned by his father-in-law Baba Fugu Mohammed. The mosque became the base for radical Islamic teachings."},
  {q:"In December 2003, what triggered Boko Haram's first armed confrontation with authorities in Kanama, Yobe State?",o:["A disagreement over mosque ownership","A community dispute over fishing rights in a local pond","A protest over Sharia implementation","A political clash during elections"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"In December 2003, following a community dispute over fishing rights in a local pond, Boko Haram members became involved in conflict with the police, later overrunning a police station and carting away weapons."},
  {q:"What did Boko Haram survivors of the 2003 Kanama crackdown call themselves, and where did they regroup?",o:["'Maiduguri Taliban' — they regrouped in Sambisa Forest","'Yobe Taliban' — they returned to Maiduguri and regrouped at the Ibn Taimiyyah Masjid","'Nigerian Taliban' — they returned to Maiduguri from Kanama, Yobe State","'Borno Jihad' — they moved to Gwoza Hills"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"The surviving members, known as the 'Nigerian Taliban,' returned to Maiduguri where they settled with others from the youth group that originated at the Ndimi Mosque, later establishing the Ibn Taimiyyah Masjid."},
  {q:"What incident in July 2009 triggered the final violent confrontation between Boko Haram and police?",o:["An attack on a school in Maiduguri","A clash over the use of motorcycle helmets during a funeral procession","A bombing of a police checkpoint","A prison break in Borno State"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"In July 2009, while conducting a funeral procession, Boko Haram came into conflict with police over the use of motorcycle helmets. The group then attacked police stations in Bauchi and Yobe States."},
  {q:"Who took over leadership of Boko Haram after Mohammed Yusuf died in 2009?",o:["Mohammed Ali (Al-Barnawi)","Mamman Nur","Abu Mus'ab Al-Barnawi","Abubakar Shekau"],a:3,t:"SCARS II – Ch.5",d:"easy",e:"Abubakar Shekau was appointed the leader of Boko Haram in July 2009 after the death of Mohammed Yusuf. He led the group for over 10 years, expanding its influence and violence significantly."},
  {q:"Which international terrorist organisation publicly supported Boko Haram in January 2010?",o:["ISIS","Al-Shabaab","Al-Qaeda in Islamic Maghreb (AQIM) under Abdelmalek Droukdel","Taliban"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"In January 2010, Abdelmalek Droukdel, then-leader of Al-Qaeda in Islamic Maghreb (AQIM), offered open support for Boko Haram, which led Shekau to reorganise the group on the Al-Qaeda model."},
  {q:"In what year did Boko Haram pledge allegiance to the Islamic State of Iraq and Syria (ISIS)?",o:["2013","2014","2015","2016"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"In 2015, Boko Haram pledged allegiance to ISIS under Shekau, as a means to raise the group's international profile. This later triggered internal divisions and the formation of ISWAP."},
  {q:"What does ISWAP stand for?",o:["Islamic State West Africa Province","Islamic State Warfare and Attacks Programme","Internal Security West Africa Protocol","Islamic State War Against People"],a:0,t:"SCARS II – Ch.5",d:"medium",e:"ISWAP stands for Islamic State West Africa Province — a breakaway faction from Shekau's Boko Haram, led by Abu Mus'ab Al-Barnawi, that emerged following internal divisions after the 2015 ISIS affiliation."},
  {q:"What is the title given to the head of a cell unit within Boko Haram's organisational structure?",o:["Wali","Shura","Amir","Caliph"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"The head of a cell unit within Boko Haram's structure was called the Amir, while the Shura Council was the senior leadership level responsible for major decisions affecting the group."},
  {q:"Mohammed Yusuf was born on what date and in which location?",o:["15 January 1970 in Maiduguri","29 January 1970 in Jakusko, Yobe State","3 March 1975 in Damaturu","12 June 1968 in Kanama"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"Mohammed Yusuf, the founder of Boko Haram, was born on 29 January 1970 in Jakusko, Yobe State, to parents with deep roots in Islam."},
  {q:"Who was Mohammed Ali (Ala'udeen Al-Barnawi), and what document did he write in 2003?",o:["He was Boko Haram's military commander — he wrote 'The Path to Caliphate'","He was the intellectual backbone of Boko Haram — he wrote a 20-page document titled 'Truth Has Come, Foundation of Evil is Shaking'","He was Yusuf's deputy — he wrote 'Why We Fight'","He was a Sharia judge — he wrote the Borno State Sharia Implementation Guidelines"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"Mohammed Ali (Ala'udeen Al-Barnawi) was the intellectual backbone of Boko Haram. In 2003 he wrote a 20-page document titled 'Truth Has Come, Foundation of Evil is Shaking,' advocating total rejection of democracy. He was killed in January 2004."},
  {q:"Where was Abubakar Shekau born and where did he grow up?",o:["Maiduguri, Borno State","Jakusko, Yobe State","Shekau Village, Tarmuwa LGA, Yobe State — later moving to Maiduguri","Kanama, Yobe State"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"Shekau was born in 1973 and grew up in Shekau Village, Tarmuwa Local Government Area, Yobe State, before moving to Maiduguri in 1990 where he became radicalised and joined Boko Haram."},
  {q:"Where did Shekau study Islamic law, and who introduced him to Mohammed Yusuf?",o:["University of Maiduguri — introduced by his brother","Borno College of Legal and Islamic Studies (BOCOLIS) — introduced by Mamman Nur","University of Sokoto — introduced by Mohammed Ali","Indimi Mosque school — introduced by his father"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"Shekau studied at the Borno College of Legal and Islamic Studies (BOCOLIS) where he met Mamman Nur, who introduced him to Mohammed Yusuf and he became one of Yusuf's deputies."},
  {q:"How did Abubakar Shekau die?",o:["He was killed in an airstrike by the Nigerian Air Force","He was captured and executed","He detonated a suicide vest killing himself when encircled by ISWAP fighters on 19 May 2021","He died of illness in Sambisa Forest"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"On 19 May 2021, Abubakar Shekau detonated a suicide vest, killing himself and some followers in Sambisa Forest, when he was encircled by ISWAP fighters who tried to convince him to surrender."},
  {q:"Where was Mamman Nur born and why was he significant in Boko Haram?",o:["Born in Maiduguri — he was Boko Haram's bomb-maker","Born in Maroua, Cameroon to Chadian parents — he had strong regional connections and was chief strategist around Lake Chad","Born in Yobe — he was the group's religious scholar","Born in Chad — he led ISWAP after Al-Barnawi"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"Mamman Nur was born in Maroua, Cameroon, to Chadian parents. He was regarded as chief strategist around Lake Chad with high-profile transnational connections and coordinated the group's training site in Cameroon around 2010."},
  {q:"Why was Mamman Nur reportedly killed on 21 August 2018?",o:["He was killed in battle with Nigerian forces","He was murdered by one of his own lieutenants, partly for releasing the Dapchi girls without demanding ransom","He was captured and executed by ISWAP","He died in an airstrike"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"Mamman Nur was murdered on 21 August 2018 by one of his closest lieutenants. A key reason was the release of over 100 Dapchi School Girls without demanding ransom. His moderate stance and willingness to dialogue with the government was also reportedly a factor."},
  {q:"How many Dapchi school girls were kidnapped, and when did the abduction occur?",o:["57 girls — 14 April 2014","110 girls — 19 February 2018","276 girls — 14 April 2014","104 girls — 19 February 2018"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"110 school girls were abducted from the Government Girls Science and Technical School, Dapchi, Yobe State, on 19 February 2018 by Boko Haram's Al-Barnawi faction."},
  {q:"Who is Abu Mus'ab Al-Barnawi believed to be, and how did he die?",o:["He is believed to be Mamman Nur's son — he was captured","He is believed to be Habib Yusuf, eldest son of Boko Haram founder Mohammed Yusuf — he died in September 2021 from wounds sustained during clashes with government forces","He is believed to be a Chadian national — he was killed in an airstrike in 2020","He is believed to be a former Nigerian soldier — he surrendered in 2022"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"Abu Mus'ab Al-Barnawi is believed to be Habib Yusuf, the eldest son of Boko Haram founder Mohammed Yusuf. He died in September 2021 following fatal wounds sustained during clashes with government forces."},
  {q:"What was Al-Barnawi's position toward the indiscriminate targeting of mosques and markets that differed from Shekau?",o:["He supported all forms of attacks without discrimination","He did not believe in indiscriminate attacks on mosques and markets, though he threatened to bomb churches","He wanted to attack only government buildings","He opposed all forms of violence"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"Unlike Shekau who conducted indiscriminate attacks on mosques, markets, and civilians, Al-Barnawi did not believe in such attacks. He instead threatened to order the killing of Christians and bombing of churches — targeting perceived enemies of Islam specifically."},

  /* ── CHAPTER 6: THE IRONY OF BOKO HARAM ── */
  {q:"What irony does Chapter 6 highlight about Boko Haram's stance on Western education versus their operational reality?",o:["They recruited only Western-educated members","They rejected Western education but depended heavily on Western weapons, technology, and media platforms for their campaigns","They attended Western universities before founding the group","They only attacked Western businesses"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"Chapter 6 highlights the irony that while Boko Haram views Western education as un-Islamic and forbidden, the group depends heavily on Western weapons, technology, and Western media platforms for its campaigns and propaganda."},
  {q:"According to the book, how many Nigerians were displaced in Adamawa, Borno, and Yobe States as of the 2021 UNDP report?",o:["More than 500,000","More than 1 million","More than 1.8 million — with nearly 1.5 million in Borno alone","More than 3 million"],a:2,t:"SCARS II – Ch.6",d:"medium",e:"The 2021 UNDP report cited in the book indicated that more than 1.8 million Nigerians were displaced in Adamawa, Borno, and Yobe States, with the vast majority — nearly 1.5 million — located in Borno State."},
  {q:"What estimated amount is cited in the book to rebuild schools, houses, and social infrastructure to pre-Boko Haram levels?",o:["Over 1 billion USD","Over 5 billion USD","Over 9 billion USD","Over 15 billion USD"],a:2,t:"SCARS II – Ch.6",d:"medium",e:"Destruction of epic proportions has taken place, requiring an estimated amount of over 9 billion USD to rebuild schools, houses, and other social infrastructures to the level of the pre-Boko Haram era."},
  {q:"What short-term humanitarian relief amount did the Presidential Committee on the North-East Initiative (PCNI) estimate?",o:["Over 1 billion USD","Over 3 billion USD","Over 5.5 billion USD","Over 10 billion USD"],a:2,t:"SCARS II – Ch.6",d:"hard",e:"The Presidential Committee on the North-East Initiative (PCNI) estimated that over 5.5 billion USD would be required in the short term for humanitarian relief in the North-East."},
  {q:"In five local government areas of Borno State, what road conditions prevailed at the height of the insurgency?",o:["Roads were in good condition but unusable due to IEDs","Only interconnecting tracks were available — no paved roads","Roads existed but bridges were destroyed","Federal roads were intact but state roads were destroyed"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"At some point during the insurgency, in over five local government areas of Borno State, only interconnecting tracks were available and no paved roads existed — exemplifying ungoverned spaces."},
  {q:"What seven dimensions of human security does the UNDP framework cited in the book identify?",o:["Military, police, intelligence, justice, health, education, economic","Personal, economic, community, food, health, political, environmental","Physical, social, cultural, religious, economic, political, digital","Military, economic, diplomatic, informational, educational, medical, environmental"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The UNDP's seven dimensions of human security are: personal security, economic security, community security, food security, health security, political security, and environmental security."},
  {q:"On what date was the first Boko Haram attack on Western interests — the UN Headquarters in Abuja?",o:["16 June 2011","26 August 2011","25 December 2011","14 April 2014"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The first Boko Haram attack against Western interests — the United Nations Headquarters in Abuja — occurred on 26 August 2011, killing at least 23 people and injuring more than 80."},
  {q:"What does the book say was Boko Haram's intent behind the Christmas Day 2011 multiple bomb attacks?",o:["To destroy government buildings","To provoke the Christian community into retaliatory attacks against Muslim interests and instigate a religious war","To demonstrate military capability","To kidnap Christian leaders"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The Christmas Day 2011 attacks in Jos, Potiskum, and St Theresa's Church in Madalla were intended to provoke the Christian component of the citizenry, generate retaliatory attacks by Christian groups, and instigate a religious war — a plan that failed due to the responsiveness of government and faith leaders."},
  {q:"What does the NBS score of the NE indicate about poverty levels according to Chapter 6?",o:["Less than 30% poverty rate","Less than 50% poverty rate","An average of 76% of its people live on less than one dollar per day","Only Borno State exceeds 50% poverty"],a:2,t:"SCARS II – Ch.6",d:"medium",e:"The NBS score of the NE indicates widespread endemic poverty, with an average of 76% of its people on an income of less than one dollar per day, amid multidimensional deprivations."},
  {q:"What comparison does the book make about Borno State's agricultural potential?",o:["Borno State can only produce enough for its own population","Borno State, based on studies and actual field indicators, can feed the entire country owing to its largely agrarian economy","Borno State's agricultural potential is limited by desert encroachment","Borno State's soil is infertile due to Boko Haram's activities"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The book makes the striking observation that 'Borno State alone, based on studies and actual field indicators, can feed the entire country, owing to its largely agrarian economy' — contrasting sharply with the reality of poverty and destruction."},
  {q:"What local government areas in Borno State does the book say could produce all of Nigeria's rice needs but lack roads and bridges?",o:["Konduga and Monguno","Abadam and Kukawa","Kala Balge and Gamboru Ngala","Bama and Dikwa"],a:2,t:"SCARS II – Ch.6",d:"hard",e:"The book states that Kala Balge and Gamboru Ngala LGAs, which could produce all the rice needs of Nigeria, do not have roads or bridges linking them — a paradox reflecting decades of neglect and insurgency."},

  /* ── CHAPTER 7: THE BEASTLY BOKO HARAM ── */
  {q:"In September 2010, Boko Haram attacked a prison in which state, freeing how many inmates?",o:["Borno State — 200 inmates","Yobe State — 300 inmates","Bauchi State — about 105 sect members plus over 600 other inmates","Kano State — over 1,000 inmates"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"In September 2010, Boko Haram attacked a prison in Bauchi State, where it freed about 105 of its sect members and over 600 other inmates, signalling a new phase of operational boldness."},
  {q:"On 16 June 2011, Boko Haram bombed which institution by trailing the convoy of the Inspector General of Police?",o:["The Nigerian Defence Headquarters","The State Security Service headquarters","The Police Force Headquarters — 6 people killed","The Army Barracks in Abuja"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"On 16 June 2011, a Boko Haram suicide bomber trailed the IGP's convoy and bombed the Police Force Headquarters, killing six people. The IGP narrowly escaped."},
  {q:"On 20 January 2012, which state suffered coordinated bomb explosions claiming over 100 casualties?",o:["Borno State","Yobe State","Kano State","Kaduna State"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"On 20 January 2012, a series of bomb explosions rocked the Kano State Police Command Headquarters, two local police stations, and the Department of State Security, resulting in over 100 casualties."},
  {q:"When was the 1 Division Nigerian Army Headquarters in Kaduna attacked by Boko Haram?",o:["7 January 2012","7 February 2012","7 March 2012","7 April 2012"],a:1,t:"SCARS II – Ch.7",d:"hard",e:"The 1 Division Nigerian Army Headquarters in Kaduna was attacked using vehicle-borne IEDs on Monday, 7 February 2012. A suicide bomber died in the blast."},
  {q:"On 14 April 2014, how many people were killed in the twin bomb explosions at the Nyanya bus station in Abuja?",o:["Over 30","Over 50","Over 88","Over 120"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"On 14 April 2014, Boko Haram exploded two bombs at the crowded Nyanya bus station in Abuja, killing more than 88 people and wounding over 200 others."},
  {q:"How many boys were killed in the Boko Haram attack on Federal Government College, Buni Yadi, on 25 February 2014?",o:["29","39","49","59"],a:3,t:"SCARS II – Ch.7",d:"medium",e:"On 25 February 2014, Boko Haram attacked Federal Government College, Buni Yadi, Yobe State, killing 59 boys who were burnt in their dormitories. The group also razed 24 buildings in the school."},
  {q:"How many buildings did Boko Haram raze during the Buni Yadi school attack?",o:["12","18","24","30"],a:2,t:"SCARS II – Ch.7",d:"hard",e:"During the attack on Federal Government College, Buni Yadi, Boko Haram razed a total of 24 buildings in the school, in addition to killing 59 students."},
  {q:"How many Chibok school girls were abducted on 14 April 2014, and what were they in school for?",o:["200 girls — for end-of-year exams","276 girls — to undertake the West African School Certificate Examination","300 girls — for a school festival","150 girls — for NECO examinations"],a:1,t:"SCARS II – Ch.7",d:"easy",e:"276 students aged 16–18 were abducted from Government Girls Secondary School, Chibok, Borno State, on 14 April 2014. They were in school to sit the West African School Certificate Examination."},
  {q:"How many of the Chibok girls escaped during their transportation to Boko Haram hideouts?",o:["27","37","47","57"],a:3,t:"SCARS II – Ch.7",d:"medium",e:"57 of the abducted Chibok girls escaped in the course of being transported to Boko Haram hideouts, through what the book describes as a bold and courageous effort."},
  {q:"Why did the Chibok abduction give Boko Haram an advantage of freedom of action?",o:["Security forces were on leave","The abduction occurred on a public holiday","It was synchronised with the Nyanya Bus Station bomb blast, diverting government agencies' attention","It happened during a military exercise"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"The Chibok abduction was synchronised with the Nyanya Bus Station bomb blast on the same day, so the attention of government agencies was focused primarily on the Nyanya aftermath, giving Boko Haram freedom of action for the abduction."},
  {q:"The author was at which division when the Chibok abduction occurred, and whom did he accompany to visit the school?",o:["7 Division — he went alone","Theatre Command — he went with the president","3rd Division — he accompanied GOC Major General JS Zaruwa","1 Division — he accompanied the Chief of Army Staff"],a:2,t:"SCARS II – Ch.7",d:"hard",e:"The author was serving with the 3rd Division. He accompanied GOC Major General JS Zaruwa (of blessed memory) to Chibok two days after the abduction, to prepare the location for a visit by the Commander-in-Chief."},
  {q:"What practical problem did the author and GOC have to solve before the president's planned visit to Chibok?",o:["Removing IEDs from the road","Building a temporary landing pad","Arranging water from the village to wet the dry dusty school field so the presidential helicopter could land safely","Setting up a perimeter fence around the school"],a:2,t:"SCARS II – Ch.7",d:"hard",e:"The school field was bare and dry, so they had to arrange for water from the village to wet the dusty ground so the presidential helicopter could land safely. The president later did not visit."},
  {q:"In which role did the author later rescue some of the Chibok girls?",o:["As GOC 3 Division","As Chief of Army Staff","As Theatre Commander of Operation LAFIYA DOLE","As Chief of Defence Staff"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"The author rescued some Chibok girls from operational engagements and through DSS facilitations after he became Theatre Commander of Operation LAFIYA DOLE. He also arranged the aircraft that conveyed them out of the operations theatre."},
  {q:"Who received the rescued Chibok girls on the ground in Borno State?",o:["The Nigerian Army GOC","The Minister of Defence","Then-Governor of Borno State Kashim Shettima","The then-Inspector General of Police"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"The then-Governor of Borno State, Kashim Shettima (now Vice President of Nigeria), was on the ground to receive the rescued Chibok girls."},
