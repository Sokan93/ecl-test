<style>
*{box-sizing:border-box;margin:0;padding:0}

.nb{width:26px;height:26px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans)}

.easy{background:#EAF3DE;color:#3B6D11}

.custom-row{display:flex;align-items:center;gap:8px;margin-bottom:1.4rem;font-size:13px;color:var(--color-text-secondary)}

.pick-grid{display:flex;flex-direction:column;gap:12px;margin-top:.5rem}

.pick-emoji{font-size:28px;flex-shrink:0}
.pick-text h4{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}

</style>

  {q:"Which club did Nwankwo Kanu play for when he won the 1999 UEFA Cup?",o:["Arsenal","Ajax","Inter Milan","Lazio"],a:0,t:"Sports",d:"medium",e:"Kanu won the 1999 UEFA Cup with Arsenal, though he had earlier won the Champions League with Ajax (1995)."},
  {q:"Nigeria's D'Tigress (women's basketball team) won back-to-back AfroBasket titles in 2017 and 2019. Which team did they defeat in the 2019 final?",o:["South Africa","Senegal","Cameroon","Mali"],a:3,t:"Sports",d:"hard",e:"Nigeria's D'Tigress defeated Mali in the 2019 FIBA AfroBasket Women's Championship final to retain their title."},
  {q:"What is the name of Nigeria's national women's football team?",o:["Lady Eagles","Super Falcons","Falcon Warriors","Golden Falcons"],a:1,t:"Sports",d:"easy",e:"Nigeria's women's football team is called the Super Falcons. They have won the Women's Africa Cup of Nations a record 11 times."},

  /* ── AMVCA, MUSIC & CULTURE ── */
  {q:"What does AMVCA stand for?",o:["African Music and Video Content Awards","Africa Magic Viewers' Choice Awards","All-Media Video Content Acclaim","African Movie and Viewers' Choice Accolades"],a:1,t:"Music & Culture (AMVCA)",d:"easy",e:"AMVCA stands for Africa Magic Viewers' Choice Awards, held annually by MultiChoice's Africa Magic channels to celebrate African film and TV."},
  {q:"Which Nigerian actress became the first to win the AMVCA Best Actress in a Drama award twice in a row?",o:["Genevieve Nnaji","Omotola Jalade-Ekeinde","Ini Edo","Meg Otanwa"],a:3,t:"Music & Culture (AMVCA)",d:"hard",e:"Meg Otanwa made history at AMVCA winning the Best Actress in a Drama category in consecutive years for her outstanding performances."},
  {q:"Burna Boy won the Grammy Award for Best Global Music Album in 2021 for which album?",o:["African Giant","Twice as Tall","Love Damini","Outside"],a:1,t:"Music & Culture (AMVCA)",d:"medium",e:"Burna Boy won his first Grammy for 'Twice as Tall' at the 63rd Grammy Awards in 2021."},
  {q:"Wizkid's 'Essence' featuring Tems became a global hit and peaked at what position on the US Billboard Hot 100?",o:["No. 9","No. 12","No. 1","No. 25"],a:0,t:"Music & Culture (AMVCA)",d:"hard",e:"'Essence' peaked at No. 9 on the US Billboard Hot 100 in 2021, a remarkable achievement for an Afrobeats song."},
  {q:"Which Nigerian singer is known by the title 'Afrobeats to the World'?",o:["Davido","Wizkid","Burna Boy","Tiwa Savage"],a:2,t:"Music & Culture (AMVCA)",d:"easy",e:"Burna Boy is widely associated with the phrase 'Afrobeats to the World' — he has consistently championed African music on the global stage."},
  {q:"The AMVCA is organised by which Nigerian pay-TV company?",o:["DSTV South Africa","MultiChoice Nigeria","StarTimes","Iroko TV"],a:1,t:"Music & Culture (AMVCA)",d:"easy",e:"MultiChoice Nigeria organises the Africa Magic Viewers' Choice Awards (AMVCA) through its Africa Magic channels."},
  {q:"Tems became the first African woman to achieve which Grammy distinction in 2023?",o:["Win Best Pop Album","Be nominated for Best New Artist","Win Best Global Music Performance","Be nominated for Record of the Year"],a:2,t:"Music & Culture (AMVCA)",d:"medium",e:"Tems won the Grammy Award for Best Global Music Performance in 2023 for her collaboration with Burna Boy on 'Last Last'. She was also nominated for the Song of the Year Grammy."},
  {q:"Nollywood is the name for Nigeria's film industry. It is the _____ largest film industry in the world by number of productions.",o:["Largest","Second-largest","Third-largest","Fourth-largest"],a:1,t:"Music & Culture (AMVCA)",d:"medium",e:"Nollywood is the second-largest film industry in the world by volume of productions, behind India's Bollywood and ahead of Hollywood."},
  {q:"Which Nigerian musician won the inaugural BET Award for Best New Artist in 2001?",o:["2Face Idibia","D'banj","Asa","No Nigerian won that year"],a:3,t:"Music & Culture (AMVCA)",d:"hard",e:"No Nigerian artist won the inaugural BET Award for Best New Artist. BET's international recognition of Nigerian artists grew later. 2Face Idibia won the BET International Viewer's Choice in 2005."},
  {q:"Davido's real name is?",o:["David Adeleke","David Okonkwo","Adekunle David","David Abimbola"],a:0,t:"Music & Culture (AMVCA)",d:"easy",e:"Davido's full name is David Adedeji Adeleke. He is the son of billionaire businessman Adedeji Adeleke."},
  {q:"Which Nigerian singer's debut studio album 'Long Life and Prosperity' launched her international career?",o:["Tiwa Savage","Yemi Alade","Asa","Simi"],a:2,t:"Music & Culture (AMVCA)",d:"hard",e:"Asa (Bukola Elemide) released her debut album 'Asa' (not 'Long Life and Prosperity') in France in 2007. She rose to international acclaim especially in Europe."},
  {q:"The annual 'Felabration' music festival celebrates the life of which Nigerian musician?",o:["King Sunny Ade","Fela Kuti","Ebenezer Obey","Lagbaja"],a:1,t:"Music & Culture (AMVCA)",d:"easy",e:"Felabration is an annual week-long music festival held in October in Lagos to celebrate Fela Anikulapo-Kuti, the creator of Afrobeat."},

  /* ── HISTORICAL CURRENT AFFAIRS ── */
  {q:"The #EndSARS protests of 2020 were against which Nigerian institution?",o:["The Nigerian Army","The Department of State Services","The Special Anti-Robbery Squad (SARS)","The Economic and Financial Crimes Commission"],a:2,t:"Historical Current Affairs",d:"easy",e:"#EndSARS was a mass protest movement against the Special Anti-Robbery Squad (SARS) of the Nigeria Police Force, accused of brutality, extortion, and extrajudicial killings."},
  {q:"The Lekki Toll Gate shooting incident occurred on which date in 2020?",o:["October 5","October 14","October 20","November 1"],a:2,t:"Historical Current Affairs",d:"medium",e:"On October 20, 2020 — a day remembered as '20-10-20' — security forces opened fire on #EndSARS protesters at the Lekki Toll Gate in Lagos."},
  {q:"Nigeria's National Assembly is bicameral. What are its two chambers?",o:["The House of Lords and House of Commons","The Senate and House of Representatives","The Senate and National Council","The Congress and Parliament"],a:1,t:"Historical Current Affairs",d:"easy",e:"Nigeria's National Assembly comprises the Senate (109 senators) and the House of Representatives (360 members), mirroring the US model."},
  {q:"Which Nigerian agency is primarily responsible for fighting corruption?",o:["DSS","NAFDAC","EFCC","NIS"],a:2,t:"Historical Current Affairs",d:"easy",e:"The Economic and Financial Crimes Commission (EFCC) was established in 2002 to combat financial and economic crimes including corruption."},
  {q:"Boko Haram abducted 276 schoolgirls from which town in 2014?",o:["Maiduguri","Yola","Chibok","Damaturu"],a:2,t:"Historical Current Affairs",d:"medium",e:"Boko Haram kidnapped 276 Chibok schoolgirls on April 14–15, 2014, triggering the global #BringBackOurGirls campaign."},
  {q:"The Petroleum Industry Act (PIA) was signed into law in which year?",o:["2019","2020","2021","2022"],a:2,t:"Historical Current Affairs",d:"hard",e:"The Petroleum Industry Act was signed by President Buhari in August 2021, restructuring Nigeria's oil and gas sector after decades of legislative delays."},
  {q:"Which year was the Niger Delta Avengers most active, causing significant oil production drops?",o:["2013","2014","2016","2018"],a:2,t:"Historical Current Affairs",d:"hard",e:"The Niger Delta Avengers emerged in 2016 and bombed oil infrastructure, causing Nigeria's crude production to fall to a 30-year low."},
  {q:"Ngozi Okonjo-Iweala became the Director-General of which international body in 2021?",o:["IMF","World Bank","WTO","UN"],a:2,t:"Historical Current Affairs",d:"medium",e:"Dr. Ngozi Okonjo-Iweala became the first African and first woman to lead the World Trade Organization (WTO) in March 2021."},
  {q:"Which former Nigerian president launched the 'Transformation Agenda'?",o:["Olusegun Obasanjo","Umaru Yar'Adua","Goodluck Jonathan","Muhammadu Buhari"],a:2,t:"Historical Current Affairs",d:"medium",e:"President Goodluck Jonathan's administration (2010–2015) launched the Transformation Agenda as its main economic and development programme."},
  {q:"Umaru Yar'Adua died in office in which year, making Goodluck Jonathan president?",o:["2008","2009","2010","2011"],a:2,t:"Historical Current Affairs",d:"medium",e:"President Umaru Musa Yar'Adua died on May 5, 2010, after a prolonged illness. His vice-president, Goodluck Jonathan, was sworn in as president."},
  {q:"The Lagos-Ibadan expressway rehabilitation project has been ongoing for decades. Which agency oversees federal road construction?",o:["FRSC","FERMA","Julius Berger only","FAAN"],a:1,t:"Historical Current Affairs",d:"hard",e:"FERMA (Federal Roads Maintenance Agency) oversees federal road maintenance in Nigeria, though construction contracts often go to private firms like Julius Berger."},
  {q:"Which Nigerian state was created last, making it the newest state in Nigeria?",o:["Ebonyi","Ekiti","Zamfara","All three were created in 1996"],a:3,t:"Historical Current Affairs",d:"hard",e:"Ebonyi, Ekiti, Zamfara, Nassarawa, Gombe, and Bayelsa states were all created on October 1, 1996 under Sani Abacha — making them the last states created in Nigeria."},
  {q:"The Nigeria-Biafra Civil War ended with the famous declaration: 'No victor, no vanquished.' Who made this statement?",o:["Odumegwu Ojukwu","Philip Effiong","Yakubu Gowon","Olusegun Obasanjo"],a:2,t:"Historical Current Affairs",d:"medium",e:"General Yakubu Gowon made the 'No victor, no vanquished' declaration at the end of the Civil War on January 15, 1970, emphasising reconciliation over punishment."},
  {q:"Nigeria hosted the African Nations Cup (AFCON) in 1980. What was the venue of the final?",o:["National Stadium Surulere Lagos","Abuja National Stadium","Liberty Stadium Ibadan","Ahmadu Bello Stadium Kaduna"],a:0,t:"Historical Current Affairs",d:"hard",e:"The 1980 AFCON final was played at the National Stadium in Surulere, Lagos, where Nigeria defeated Algeria 3-0 to win their first continental title."},
  {q:"Operation Feed the Nation was a food security programme launched by which military government?",o:["Gowon","Murtala Muhammed","Obasanjo (military)","Babangida"],a:2,t:"Historical Current Affairs",d:"hard",e:"General Olusegun Obasanjo launched 'Operation Feed the Nation' in 1976 to encourage Nigerians to grow their own food and reduce dependence on food imports."},
  {q:"Nigeria was suspended from the Commonwealth of Nations between which years due to Abacha's human rights abuses?",o:["1993–1995","1995–1999","1996–2000","1993–1998"],a:1,t:"Historical Current Affairs",d:"hard",e:"Nigeria was suspended from the Commonwealth in November 1995 following the execution of Ken Saro-Wiwa. The suspension was lifted in 1999 after the return to democracy."},
  {q:"Which Nigerian institution is responsible for regulating food and drugs?",o:["NDLEA","NAFDAC","SON","PCN"],a:1,t:"Historical Current Affairs",d:"easy",e:"NAFDAC (National Agency for Food and Drug Administration and Control) regulates food, drugs, cosmetics, medical devices, and chemicals in Nigeria."},
  {q:"The 'Aba Women's Riot' of 1929 was a protest against what?",o:["Forced military conscription","Proposed taxation of women","British indirect rule policy","Amalgamation of Nigeria"],a:1,t:"History (Pre-Independence)",d:"medium",e:"The Aba Women's Riots (also called Ogu Umunwanyi — Women's War) were sparked by fears that British colonial authorities planned to tax women. It spread across Owerri and Calabar provinces."},
  {q:"The University of Ibadan, Nigeria's first university, was founded in which year?",o:["1945","1948","1952","1960"],a:1,t:"History (Pre-Independence)",d:"medium",e:"The University of Ibadan was founded in 1948 as University College Ibadan, affiliated with the University of London. It became a full university in 1962."},
  {q:"FESTAC '77 — the Second World Black and African Festival of Arts and Culture — was hosted by Nigeria in which city?",o:["Abuja","Lagos","Ibadan","Port Harcourt"],a:1,t:"Historical Current Affairs",d:"medium",e:"FESTAC '77 was held in Lagos in January–February 1977 and is considered one of the largest cultural events in African history, drawing over 16,000 participants."},

  /* ── BONUS MIXED ── */
  {q:"Which Nigerian state has the highest number of local government areas (LGAs)?",o:["Lagos","Kano","Kaduna","Niger State"],a:1,t:"States & Geography",d:"hard",e:"Kano State has the highest number of LGAs in Nigeria — 44 local government areas."},
  {q:"The Nigerian naira was introduced in which year?",o:["1960","1966","1973","1979"],a:2,t:"Historical Current Affairs",d:"medium",e:"The Nigerian naira replaced the pound on January 1, 1973, as part of decimalisation of the currency."},
  {q:"Which Nigerian governor was impeached in 2006, the first such removal in Nigeria's democratic history?",o:["Orji Uzor Kalu","Rashidi Ladoja","Chris Ngige","Joshua Dariye"],a:1,t:"Historical Current Affairs",d:"hard",e:"Rashidi Ladoja of Oyo State was the first Nigerian governor impeached in the current democratic era (2006), though a court later reinstated him."},
  {q:"The term 'Aso Rock' refers to what in Nigerian politics?",o:["Nigeria's parliament","The Supreme Court","The presidential villa in Abuja","The Ministry of Finance"],a:2,t:"Historical Current Affairs",d:"easy",e:"Aso Rock is a large monolith in Abuja, and 'Aso Rock' popularly refers to the Presidential Villa — the official residence and workplace of Nigeria's president."},
  {q:"Victor Moses represented Nigeria's Super Eagles before switching international allegiance. Which other national team has he represented?",o:["England","Ghana","Australia","He only played for Nigeria"],a:0,t:"Sports",d:"medium",e:"Victor Moses was born in Nigeria but moved to England. He initially represented England at youth level before choosing to play for Nigeria's senior team."},
  {q:"Who is the all-time top scorer for Nigeria's Super Eagles?",o:["Rashidi Yekini","Jay-Jay Okocha","Nwankwo Kanu","Victor Osimhen"],a:0,t:"Sports",d:"medium",e:"Rashidi Yekini is Nigeria's all-time top scorer with 37 international goals. He scored Nigeria's first-ever World Cup goal against Bulgaria in 1994."},
  {q:"Jay-Jay Okocha is widely considered Nigeria's greatest ever footballer. Which French club made him famous in the late 1990s?",o:["Paris Saint-Germain","Marseille","Lyon","Monaco"],a:0,t:"Sports",d:"medium",e:"Augustine 'Jay-Jay' Okocha played for Paris Saint-Germain (PSG) from 1998–2002, dazzling fans with his dribbling and becoming a PSG legend."},
  {q:"The Afrobeats genre is strongly associated with Nigerian music. Who is known as the originator of 'Afrobeat' (the older genre)?",o:["King Sunny Ade","Fela Anikulapo-Kuti","Ebenezer Obey","Orlando Julius"],a:1,t:"Music & Culture (AMVCA)",d:"medium",e:"Fela Anikulapo-Kuti created Afrobeat — a blend of Yoruba music, jazz, funk, and political commentary — in the 1970s. Note: modern 'Afrobeats' (with an 's') is a different, broader genre."},
  {q:"Nigeria hosted the first FIFA U-17 World Cup in which year?",o:["1985","1987","1993","2009"],a:0,t:"Sports",d:"hard",e:"Nigeria hosted the inaugural FIFA U-16 World Championship (now U-17 World Cup) in 1985 in Lagos. Nigeria's Golden Eaglets reached the final, losing to Germany."},
  {q:"Nigeria's Golden Eaglets have won the FIFA U-17 World Cup how many times?",o:["3 times","4 times","5 times","6 times"],a:2,t:"Sports",d:"medium",e:"Nigeria's Golden Eaglets have won the FIFA U-17 World Cup a record 5 times (1985, 1993, 2007, 2013, 2015), more than any other country."},

  /* ── SANYA by Oyin Olugbile ── */
  {q:"'Sanya' (Sànyà) by Oyin Olugbile won which prestigious literary prize in 2025?",o:["The Booker Prize","The Caine Prize","The Nigeria Prize for Literature","The Commonwealth Writers' Prize"],a:2,t:"Sanya – Oyin Olugbile",d:"easy",e:"Sànyà won the 2025 NLNG Nigeria Prize for Literature, Africa's most valuable literary prize worth $100,000, beating finalists Chigozie Obioma and Nikki May."},
  {q:"What genre best describes the novel 'Sanya'?",o:["Political thriller","Romantic comedy","Mythological fantasy","Crime fiction"],a:2,t:"Sanya – Oyin Olugbile",d:"easy",e:"Sanya is a mythological fantasy rooted in Yoruba cosmology. It reimagines the deity Ṣàngó through a female protagonist."},
  {q:"Which Yoruba deity's story is reimagined through the female protagonist in 'Sanya'?",o:["Ogun","Ṣàngó (Sango)","Obatala","Yemoja"],a:1,t:"Sanya – Oyin Olugbile",d:"medium",e:"Sanya retells the legend of Ṣàngó — the Yoruba god of thunder and lightning — through a powerful woman warrior named Sànyà."},
  {q:"Who published the novel 'Sanya'?",o:["Farafina","Cassava Republic","Masobe Books","Narrative Landscape Press"],a:2,t:"Sanya – Oyin Olugbile",d:"medium",e:"Sanya was published by Masobe Books, a Nigerian publishing house, in December 2022."},
  {q:"In which year was 'Sanya' first published?",o:["2019","2021","2022","2023"],a:2,t:"Sanya – Oyin Olugbile",d:"easy",e:"Sanya was published on December 2, 2022, and is Oyin Olugbile's debut novel."},
  {q:"Who is Sanya's older brother in the novel?",o:["Aganju","Dada","Osoosi","Esu"],a:1,t:"Sanya – Oyin Olugbile",d:"medium",e:"Dada is Sanya's sickly older brother. He is born with locs (dreadlocks) and possesses the gift of clairvoyance — he can see visions of the future."},
  {q:"What are the names of Sanya's parents in the novel?",o:["Sango and Oya","Aganju and Ajoke","Ogun and Yemoja","Esu and Osun"],a:1,t:"Sanya – Oyin Olugbile",d:"medium",e:"Sanya's father is Aganju, a warrior from a royal lineage, and her mother is Ajoke. Ajoke dies shortly after giving birth to Sanya."},
  {q:"How many pages is 'Sanya'?",o:["250","320","400","480"],a:2,t:"Sanya – Oyin Olugbile",d:"hard",e:"Sanya is approximately 400 pages long, making it a substantial epic debut novel."},
  {q:"What is the dark prophecy attached to Sanya at birth?",o:["She will never rule a kingdom","She will either save or destroy the world","She will die before reaching womanhood","She will betray her family"],a:1,t:"Sanya – Oyin Olugbile",d:"medium",e:"Sanya is born into a royal lineage with a prophecy that the great warrior she is destined to become will either save or destroy the world."},
  {q:"Which character in 'Sanya' serves as a corrupting force who whispers to Dada, leading to his turn to darkness?",o:["Aganju","Osoosi","Èṣù","Oya"],a:2,t:"Sanya – Oyin Olugbile",d:"hard",e:"Èṣù (the Yoruba trickster deity) whispers corruption to Dada, who accepts it and transforms into a formidable Sorcerer King opposed to his sister Sanya."},
  {q:"Where is Oyin Olugbile from?",o:["Lagos","Enugu","Ibadan","Abuja"],a:2,t:"Sanya – Oyin Olugbile",d:"medium",e:"Oyin Olugbile was born in Ibadan, Oyo State, Nigeria."},
  {q:"'Sanya' is described as a retelling that explores 'twin destinies.' What are the two contrasting paths taken by the siblings?",o:["Both become queens","Sanya becomes a warrior-king; Dada becomes a Sorcerer King","Sanya dies early; Dada rules wisely","Both die in battle"],a:1,t:"Sanya – Oyin Olugbile",d:"medium",e:"The novel traces how Sanya rises as a warrior-king (through divine fire and deception) while her brother Dada claims his throne through darkness and resentment — twin destinies in contrast."},
  {q:"Which of the following characters warns Sanya about the dangers of her relationship with Osoosi?",o:["Ajoke","Dada","Oya","Aganju"],a:2,t:"Sanya – Oyin Olugbile",d:"hard",e:"Oya, the Yoruba goddess of storms, warns Sanya about the dangerous nature of her relationship with Osoosi. Sanya's refusal to heed the warning contributes to her tragic end."},
  {q:"The advisory board that awarded 'Sanya' the Nigeria Prize for Literature 2025 was led by which professor?",o:["Prof. Wole Soyinka","Prof. Chinua Achebe","Prof. Akachi Adimora-Ezeigbo","Prof. Niyi Osundare"],a:2,t:"Sanya – Oyin Olugbile",d:"hard",e:"The advisory board was led by Professor Akachi Adimora-Ezeigbo, who commended Olugbile's 'distinct and daring' approach to mythology retelling."},
  {q:"The novel 'Sanya' has been compared to which other Nigerian/African fantasy novel for its Yoruba mythological approach?",o:["Purple Hibiscus","Half of a Yellow Sun","Children of Blood and Bone by Tomi Adeyemi","Season of Migration to the North"],a:2,t:"Sanya – Oyin Olugbile",d:"medium",e:"Reviewers compared Sanya to Tomi Adeyemi's 'Children of Blood and Bone' for its blend of African mythology and epic fantasy storytelling."},
  {q:"Besides fiction, Oyin Olugbile co-authored a non-fiction book in 2022. What is its title?",o:["Women of Power in Nigeria","The Road to Good Governance in Nigeria and Africa","Nigeria and the Development Question","Leadership and the African Crisis"],a:1,t:"Sanya – Oyin Olugbile",d:"hard",e:"Olugbile co-authored 'The Road to Good Governance in Nigeria and Africa' (2022) with the SPPG Pioneer Cohort, alongside her debut novel."},
  {q:"What academic degree did Oyin Olugbile earn from King's College London?",o:["MBA","LLM","MSc in Leadership and Development","PhD in African Literature"],a:2,t:"Sanya – Oyin Olugbile",d:"hard",e:"Oyin Olugbile holds an MSc in Leadership and Development from King's College London."},
  {q:"What is the central theme of 'Sanya' beyond its mythological plot?",o:["The importance of religion","Women should not be limited by gender; strength transcends it","Military power and conquest","The superiority of Yoruba culture over others"],a:1,t:"Sanya – Oyin Olugbile",d:"medium",e:"At its core, Sanya argues that women should not be looked down on — that strength and greatness have little to do with gender and women should not be prevented from reaching their full potential."},
  {q:"'Sanya' beat which internationally known Nigerian novelist on the 2025 Nigeria Prize for Literature shortlist?",o:["Chimamanda Ngozi Adichie","Sefi Atta","Chigozie Obioma","Teju Cole"],a:2,t:"Sanya – Oyin Olugbile",d:"medium",e:"Chigozie Obioma (author of 'An Orchestra of Minorities') was on the 2025 Nigeria Prize shortlist with his novel 'The Road to the Country' but lost to Sanya."},
  {q:"The Nigeria Prize for Literature won by 'Sanya' is sponsored by which company?",o:["MTN Nigeria","Dangote Group","NLNG (Nigeria LNG Limited)","Access Bank"],a:2,t:"Sanya – Oyin Olugbile",d:"medium",e:"The Nigeria Prize for Literature is sponsored by NLNG (Nigeria Liquefied Natural Gas Limited) and is worth $100,000 — Africa's richest literary prize."},

  /* ── SCARS by General Lucky Irabor ── */
  {q:"What is the full title of General Lucky Irabor's book?",o:["Scars: My Military Life","Scars: Nigeria's Journey and the Boko Haram Conundrum","Scars of War: The North-East Crisis","Scars and Stripes: A General's Memoir"],a:1,t:"Scars – General Irabor",d:"easy",e:"The full title is 'SCARS: Nigeria's Journey and the Boko Haram Conundrum,' published in 2025."},
  {q:"General Lucky Irabor held which position in the Nigerian military before retirement?",o:["Chief of Army Staff","Chief of Naval Staff","Chief of Defence Staff","Chief of Air Staff"],a:2,t:"Scars – General Irabor",d:"medium",e:"General Lucky Irabor served as Nigeria's 17th Chief of Defence Staff (CDS), the highest military office in Nigeria's armed forces."},
  {q:"How many pages is General Irabor's book 'Scars'?",o:["200","250","330","450"],a:2,t:"Scars – General Irabor",d:"medium",e:"'Scars' is a 330-page memoir divided into 14 chapters across three distinct parts covering Nigeria's security history and the Boko Haram insurgency."},
  {q:"Into how many parts is 'Scars' divided?",o:["Two","Three","Four","Five"],a:1,t:"Scars – General Irabor",d:"medium",e:"The book is structured in three distinct parts: Nigeria's historical context and roots of security challenges; the devastating impact of Boko Haram; and paradigm shifts needed to restore peace."},
  {q:"Where was the public launch of 'Scars' held?",o:["Eko Hotel, Lagos","Nicon Luxury Hotel, Abuja","Transcorp Hilton, Abuja","International Conference Centre, Abuja"],a:2,t:"Scars – General Irabor",d:"hard",e:"'Scars' was publicly presented at the Transcorp Hilton, Abuja, an event that transformed into a national security summit attended by former presidents and top dignitaries."},
  {q:"Which two former Nigerian presidents spoke at the launch of 'Scars'?",o:["Buhari and Jonathan","Obasanjo and Jonathan","Jonathan and Shagari","Obasanjo and Buhari"],a:1,t:"Scars – General Irabor",d:"medium",e:"Former Presidents Olusegun Obasanjo and Goodluck Jonathan both spoke at the book launch, which became described as a national security summit."},
  {q:"According to General Irabor in 'Scars', Boko Haram is portrayed primarily as what?",o:["A purely religious movement","A foreign-funded terrorist network","A symptom of governance failure, economic deprivation, and elite negligence","A tribal conflict disguised as religion"],a:2,t:"Scars – General Irabor",d:"medium",e:"Irabor portrays Boko Haram not as a purely religious movement but as a symptom of governance failure, economic deprivation, and elite negligence — driven by unaddressed political grievances and weakened institutions."},
  {q:"What did General Irabor announce the proceeds from 'Scars' would be used for?",o:["Building a military academy","Funding his political ambitions","Supporting wounded veterans, schools, hospitals, and families of fallen soldiers","Establishing a media company"],a:2,t:"Scars – General Irabor",d:"medium",e:"Irabor announced that proceeds from 'Scars' would be channelled toward supporting wounded veterans, schools, hospitals, and families of fallen soldiers."},
  {q:"In 'Scars', General Irabor identifies which four drivers of extremism in Nigeria?",o:["Poverty, illiteracy, tribalism, foreign funding","Unaddressed political grievances, weaponisation of religion and tribe, biased legal framework, and weakened institutions","Unemployment, poor education, corruption, foreign interference","Military failure, police brutality, ethnic politics, poor judiciary"],a:1,t:"Scars – General Irabor",d:"hard",e:"Irabor identifies the drivers of extremism as: unaddressed political grievances, weaponisation of religion and tribe, a biased legal framework, and weakened institutions."},
  {q:"Which former president chaired the 'Scars' book launch event?",o:["Goodluck Jonathan","Umaru Yar'Adua","Olusegun Obasanjo","Ernest Shonekan"],a:2,t:"Scars – General Irabor",d:"medium",e:"Former President Olusegun Obasanjo chaired the book launch and delivered a sobering assessment about Boko Haram becoming 'accepted as part of our daily life.'"},
  {q:"What revelation did former President Goodluck Jonathan make at the 'Scars' launch about Boko Haram?",o:["He admitted funding Boko Haram secretly","That Boko Haram had nominated then-General Buhari as their preferred negotiator","That the US funded Boko Haram's early operations","That Boko Haram was created by the DSS"],a:1,t:"Scars – General Irabor",d:"hard",e:"Jonathan disclosed that Boko Haram insurgents had once nominated then-General Muhammadu Buhari as their preferred negotiator during his administration, showing how complicated the insurgency was."},
  {q:"The book launch of 'Scars' also celebrated which personal milestone for General Irabor?",o:["His 50th birthday","His 55th birthday","His 60th birthday","His retirement anniversary"],a:2,t:"Scars – General Irabor",d:"medium",e:"The 'Scars' book launch doubled as a celebration of General Lucky Irabor's 60th birthday."},
  {q:"What closing solutions does General Irabor propose in 'Scars' for Nigeria's security challenges?",o:["Military force only","Mass deportation of Northerners","Diplomatic negotiation, socioeconomic and political realignment, and governance reforms rewarding merit","Declaring a state of emergency in all Northern states"],a:2,t:"Scars – General Irabor",d:"medium",e:"Irabor's closing reflections propose: diplomatic negotiation, socioeconomic and political realignment, and governance reforms that reward merit and restore trust."},
  {q:"Besides Boko Haram, which other security challenges does 'Scars' address, according to reviewers?",o:["Cybercrime and internet fraud","Niger Delta militancy, IPOB separatism, and Yoruba nationalism","Piracy on the high seas","Cross-border drug trafficking"],a:1,t:"Scars – General Irabor",d:"medium",e:"Reviewers noted that Scars also addresses Niger Delta militancy, IPOB separatism, Yoruba nationalism, and the broader societal decay haunting Nigeria since independence."},
  {q:"How is the writing style of 'Scars' best described by reviewers?",o:["Emotional and sensational","Academic precision blended with personal field experience and policy critique","Highly fictionalised account of battles","A self-indulgent personal diary"],a:1,t:"Scars – General Irabor",d:"medium",e:"Reviewers consistently describe Irabor's style as writing with 'academic precision, referencing scholars, field experiences, and verifiable data' — scholarly yet deeply human, not self-indulgent."},
  {q:"General Irabor stated that 'Scars' was written to achieve what primary purpose?",o:["To indict corrupt politicians","To stimulate meaningful national dialogue, reflection, and inspire credible solutions","To seek redress for military pension matters","To campaign for a political office"],a:1,t:"Scars – General Irabor",d:"medium",e:"Irabor clarified the book was written not to indict individuals but to 'elicit a national conversation aimed at focusing attention on credible solutions' and stimulate national soul-searching."},
  {q:"Boko Haram, discussed extensively in 'Scars', was founded in approximately which year?",o:["1999","2002","2005","2009"],a:1,t:"Scars – General Irabor",d:"medium",e:"Boko Haram emerged in Maiduguri around 2002, founded by Mohammed Yusuf, though it escalated into a full armed insurgency around 2009 after Yusuf's extrajudicial killing."},
  {q:"In 'Scars', Irabor describes Boko Haram fighters' treatment of women in what terms?",o:["As reluctant combatants","As misguided youths","As 'sex maniacs' who deliberately used rape as a weapon of war","As prisoners of war with some rights"],a:2,t:"Scars – General Irabor",d:"hard",e:"Irabor describes Boko Haram terrorists as 'sex maniacs' who derive pleasure from sexually exploiting women and children, abducting women and girls specifically as sex slaves."},
  {q:"What did VP Kashim Shettima advise a reviewer about how to enjoy 'Scars'?",o:["Read it in a library","Read it with a pen and notepad","Read it on a long journey","Read it aloud in a group"],a:2,t:"Scars – General Irabor",d:"hard",e:"VP Kashim Shettima advised a reviewer that 'to truly enjoy a book, read it on a long journey' — advice the reviewer followed, reading all 300+ pages on a flight."},
  {q:"What is the concluding message of General Irabor in 'Scars'?",o:["Nigeria is a failed state beyond repair","The military must take over governance again","The time for change is now and must begin with truth, inclusion, and genuine progress","Northern Nigeria should be granted autonomy"],a:2,t:"Scars – General Irabor",d:"medium",e:"Irabor's closing message is: 'The time for change is now, and it must begin with truth, inclusion, and a commitment to genuine progress' — turning Nigeria's scars into victories of nationhood."},

  /* ── NIGERIA GOVERNMENT AGENCIES ── */
  {q:"What does NAFDAC stand for?",o:["National Agency for Food, Drug Administration and Control","National Authority for Food, Drugs and Chemical Control","Nigerian Agency for Food and Drug Accreditation","National Agency for Food Distribution and Consumer Care"],a:0,t:"Govt Agencies",d:"easy",e:"NAFDAC stands for National Agency for Food, Drug Administration and Control. It regulates and controls the manufacture, importation, exportation, advertisement, distribution, sale, and use of food, drugs, cosmetics, medical devices, and packaged water."},
  {q:"What does EFCC stand for?",o:["Economic and Financial Crimes Council","Economic and Financial Crimes Commission","Effective Financial Crime Control","Economic Fraud and Corruption Committee"],a:1,t:"Govt Agencies",d:"easy",e:"EFCC stands for Economic and Financial Crimes Commission. Established in 2002, it investigates and prosecutes financial crimes including advance fee fraud (419), money laundering, and corruption."},
  {q:"What does SON stand for in Nigerian regulatory bodies?",o:["Standards Organisation of Nigeria","State Office of Nigeria","Standardisation of National products","Systems Operation Network"],a:0,t:"Govt Agencies",d:"easy",e:"SON stands for Standards Organisation of Nigeria. It is responsible for standardisation and conformity assessment of products and services in Nigeria."},
  {q:"What does ICPC stand for?",o:["Independent Corrupt Practices Commission","Independent Corrupt Practices and other related offences Commission","International Crime Prevention Commission","Integrated Corruption Prevention Council"],a:1,t:"Govt Agencies",d:"medium",e:"ICPC stands for the Independent Corrupt Practices and other related offences Commission. Established in 2000, it focuses on domestic corruption, while EFCC handles financial crimes."},
  {q:"What does NDLEA stand for?",o:["National Drug Law Enforcement Agency","National Drug Licensing and Export Authority","Nigerian Drug and Liquor Enforcement Agency","National Drugs, Laws and Enforcement Administration"],a:0,t:"Govt Agencies",d:"easy",e:"NDLEA stands for National Drug Law Enforcement Agency. It is responsible for eliminating the growing, processing, manufacturing, selling, and trafficking of hard drugs in Nigeria."},
  {q:"What does CBN stand for, and what is its primary role?",o:["Commercial Bank of Nigeria — retail banking","Central Bank of Nigeria — apex monetary authority","Corporate Banking Network — investment coordination","Central Bureau of Nigeria — economic planning"],a:1,t:"Govt Agencies",d:"easy",e:"CBN stands for Central Bank of Nigeria. As the apex bank, it issues currency, manages monetary policy, maintains external reserves, and regulates the banking sector."},
  {q:"What does INEC stand for?",o:["Independent National Electoral Commission","International Nigerian Electoral Commission","Integrated National Election Council","Independent National Election Committee"],a:0,t:"Govt Agencies",d:"easy",e:"INEC stands for Independent National Electoral Commission. It conducts and supervises elections to federal and state offices in Nigeria."},
  {q:"What does FRSC stand for, and what is its mandate?",o:["Federal Road Safety Commission — manages road safety and vehicle licensing","Federal Revenue Service Corporation — collects taxes","Federal Republic Security Council — coordinates intelligence","Federal Road Surveillance Corps — monitors highways"],a:0,t:"Govt Agencies",d:"easy",e:"FRSC stands for Federal Road Safety Commission (Corps). Established in 1988, it enforces road safety regulations, issues driving licences, and reduces accidents on Nigerian roads."},
  {q:"What does NCC stand for in Nigerian telecommunications regulation?",o:["National Communications Council","Nigerian Communications Commission","National Cable Corporation","Nigerian Connectivity Commission"],a:1,t:"Govt Agencies",d:"medium",e:"NCC stands for Nigerian Communications Commission. It is the independent regulatory authority for the telecommunications industry in Nigeria, established in 1992."},
  {q:"What does FIRS stand for?",o:["Federal Inland Revenue Service","Federal Income and Revenue System","Federal Integrated Revenue Service","Federal Internal Revenue Secretariat"],a:0,t:"Govt Agencies",d:"medium",e:"FIRS stands for Federal Inland Revenue Service. It assesses, collects, and accounts for taxes accruing to the federal government of Nigeria."},
  {q:"What does NIMASA stand for?",o:["Nigerian Maritime Administration and Safety Agency","National Inland Maritime and Shipping Agency","Nigeria Marine and Seaports Authority","National Institute for Maritime Safety and Assurance"],a:0,t:"Govt Agencies",d:"medium",e:"NIMASA stands for Nigerian Maritime Administration and Safety Agency. It promotes maritime safety, security, and marine environment protection."},
  {q:"What does NESREA stand for?",o:["National Environmental Standards and Regulations Enforcement Agency","Nigerian Energy Safety Regulations and Environment Authority","National Ecological Survey and Resources Enforcement Agency","Nigerian Environmental Sustainability Research and Enforcement Agency"],a:0,t:"Govt Agencies",d:"hard",e:"NESREA stands for National Environmental Standards and Regulations Enforcement Agency. It enforces environmental laws and international environmental agreements to which Nigeria is a signatory."},
  {q:"What does NNPCL (formerly NNPC) stand for?",o:["National Nigerian Petroleum Corporation Limited","Nigerian National Petroleum Company Limited","National Niger Petroleum and Chemical Limited","Nigerian Natural Petroleum Corporation Ltd"],a:1,t:"Govt Agencies",d:"easy",e:"NNPCL stands for Nigerian National Petroleum Company Limited. Formerly NNPC (Corporation), it was converted to a limited liability company under the Petroleum Industry Act (PIA) 2021."},
  {q:"What does NSCDC stand for?",o:["National Security and Civil Defence Corps","National Secret and Counter Defence Commission","Nigeria State Civil Defence Command","Nigerian Security Corps and Defence Commission"],a:0,t:"Govt Agencies",d:"medium",e:"NSCDC stands for Nigeria Security and Civil Defence Corps. It protects government infrastructure, critical national assets, and supports the police in maintaining public order."},
  {q:"What does DSS stand for in Nigerian security?",o:["Department of State Security (formerly SSS)","Directorate of Special Surveillance","Defence Security Service","Department of Secret Surveillance"],a:0,t:"Govt Agencies",d:"easy",e:"DSS stands for Department of State Security (formerly State Security Service — SSS). It is Nigeria's domestic intelligence and security agency tasked with internal security."},
  {q:"What does PENCOM stand for?",o:["Pension Commission","Pensions and Employee Contributions Management","Pensions and National Commission for Management","Petroleum and Energy Commission"],a:0,t:"Govt Agencies",d:"medium",e:"PENCOM stands for National Pension Commission. It regulates and supervises the Contributory Pension Scheme in Nigeria, ensuring workers' retirement savings are protected."},
  {q:"What does SERAP stand for?",o:["Socio-Economic Rights and Accountability Project","State Enforcement and Regulatory Accountability Programme","Social Equality Rights and Accountability Panel","Senate Economic Rights and Appropriations Programme"],a:0,t:"Govt Agencies",d:"hard",e:"SERAP stands for Socio-Economic Rights and Accountability Project. It is a non-governmental organisation that uses litigation and advocacy to promote transparency and economic rights in Nigeria."},
  {q:"What does CAC stand for in Nigerian business registration?",o:["Company Accreditation Council","Corporate Affairs Commission","Commercial Affairs Commission","Companies and Associations Council"],a:1,t:"Govt Agencies",d:"easy",e:"CAC stands for Corporate Affairs Commission. It registers and regulates companies and business names in Nigeria, operating under the Companies and Allied Matters Act (CAMA)."},
  {q:"Which agency is responsible for managing Nigeria's external debt?",o:["CBN","DMO (Debt Management Office)","FIRS","Ministry of Finance"],a:1,t:"Govt Agencies",d:"medium",e:"The DMO (Debt Management Office) was established in 2000 to centrally coordinate the management of Nigeria's public debt, including external and domestic borrowings."},
  {q:"What does NAOC stand for in the Nigerian oil sector?",o:["Nigerian Agip Oil Company","National Authority for Oil and Chemicals","Nigeria's Approved Oil Corporation","National Asset and Oil Consortium"],a:0,t:"Govt Agencies",d:"hard",e:"NAOC stands for Nigerian Agip Oil Company, a subsidiary of ENI (formerly Agip) of Italy. It operates oil and gas assets in the Niger Delta joint venture with the NNPCL."},

  {q:"Who is Tinubu's Minister of Communications, Innovation and Digital Economy?",o:["Isa Pantami","Bosun Tijani","Adebayo Shittu","Inuwa Abdullahi"],a:1,t:"Current Ministers",d:"medium",e:"Bosun Tijani, a tech entrepreneur and co-founder of CcHUB (Co-creation Hub), was appointed Minister of Communications, Innovation and Digital Economy."},

  {q:"Which minister oversees Nigeria's Marine and Blue Economy ministry?",o:["Gboyega Oyetola","Rotimi Amaechi","Dakuku Peterside","Godswill Apkabio"],a:0,t:"Current Ministers",d:"hard",e:"Gboyega Oyetola, former Governor of Osun State, was appointed Minister of Marine and Blue Economy — a newly created ministry under Tinubu's administration."},

  {q:"What is the slogan of Imo State, and what is its capital?",o:["Eastern Heartland — Owerri","Eastern Promise — Owerri","Heartland State — Owerri","Eastern Light — Owerri"],a:2,t:"States & Geography",d:"medium",e:"Imo State is called the 'Heartland State.' Its capital is Owerri."},

  {q:"What is the slogan of Osun State?",o:["State of the Living Spring","Land of Virtue","Centre of Yoruba Culture","The Gem of the South-West"],a:0,t:"States & Geography",d:"medium",e:"Osun State's slogan is 'State of the Living Spring,' reflecting the Osun River and the state's many springs and water bodies. Capital: Osogbo."},

  /* ── FLAGS ── */

  /* ── WORLD FIRSTS / GENERAL HISTORY ── */
  {q:"Which African country was the first to gain independence from colonial rule in the 20th century?",o:["Egypt","Ghana","Nigeria","Ethiopia"],a:1,t:"World Firsts",d:"medium",e:"Ghana (then the Gold Coast) became the first sub-Saharan African country to gain independence from colonial rule, on March 6, 1957, under Kwame Nkrumah. Note: Liberia and Ethiopia were never formally colonised in the same way."},

  {q:"Who was the first man to walk on the moon?",o:["Buzz Aldrin","Yuri Gagarin","Neil Armstrong","John Glenn"],a:2,t:"World Firsts",d:"easy",e:"Neil Armstrong became the first human to walk on the moon on July 20, 1969, during NASA's Apollo 11 mission, famously saying 'That's one small step for man...'"},
  {q:"Which country was the first to grant women the right to vote nationally?",o:["United States","United Kingdom","New Zealand","Finland"],a:2,t:"World Firsts",d:"medium",e:"New Zealand became the first self-governing country to grant women the right to vote in national elections, in 1893."},
  {q:"What was the first country to abolish slavery?",o:["United States","Haiti","France","United Kingdom"],a:1,t:"World Firsts",d:"medium",e:"Haiti, following its successful slave revolt and revolution, abolished slavery and declared independence in 1804 — the first nation founded by formerly enslaved people."},
  {q:"Which was the first country to use paper currency?",o:["United Kingdom","China","Italy","United States"],a:1,t:"World Firsts",d:"medium",e:"China was the first country to use paper currency, during the Tang and Song dynasties (around the 7th–11th centuries AD), long before it spread to Europe."},
  {q:"The first modern Olympic Games were held in which city?",o:["Paris","London","Athens","Rome"],a:2,t:"World Firsts",d:"easy",e:"The first modern Olympic Games were held in Athens, Greece, in 1896, organised by Pierre de Coubertin."},
  {q:"Which was the first country to land a spacecraft on the far side of the Moon?",o:["United States","Russia","China","India"],a:2,t:"World Firsts",d:"medium",e:"China's Chang'e 4 mission made the first-ever soft landing on the far side of the Moon in January 2019."},

  {q:"Who invented the telephone?",o:["Thomas Edison","Alexander Graham Bell","Nikola Tesla","Guglielmo Marconi"],a:1,t:"Founders & Inventors",d:"easy",e:"Alexander Graham Bell is credited with patenting the first practical telephone in 1876."},
  {q:"Who is credited with inventing the light bulb (practical incandescent version)?",o:["Nikola Tesla","Thomas Edison","Benjamin Franklin","James Watt"],a:1,t:"Founders & Inventors",d:"easy",e:"Thomas Edison developed and patented a commercially practical incandescent light bulb in 1879, though earlier inventors had experimented with similar concepts."},

  {q:"What is the smallest country in the world by area?",o:["Monaco","San Marino","Vatican City","Liechtenstein"],a:2,t:"World Geography",d:"easy",e:"Vatican City is the smallest country in the world, at just about 0.49 square kilometres, entirely enclosed within Rome, Italy."},
  {q:"Which is the longest river in the world?",o:["Amazon River","Nile River","Yangtze River","Mississippi River"],a:1,t:"World Geography",d:"easy",e:"The Nile River, flowing through north-eastern Africa, is generally considered the longest river in the world at about 6,650 km, though some studies argue the Amazon may be longer."},
  {q:"What is the tallest mountain in the world (above sea level)?",o:["K2","Mount Kilimanjaro","Mount Everest","Denali"],a:2,t:"World Geography",d:"easy",e:"Mount Everest, on the border of Nepal and China (Tibet), is the tallest mountain above sea level at 8,849 metres."},
  {q:"Which is the largest continent by both area and population?",o:["Africa","Asia","Europe","North America"],a:1,t:"World Geography",d:"easy",e:"Asia is the largest continent by both land area and population, home to over half the world's people."},
  {q:"What is the largest desert in the world?",o:["Sahara Desert","Gobi Desert","Antarctic Desert","Arabian Desert"],a:2,t:"World Geography",d:"medium",e:"The Antarctic Desert is technically the largest desert in the world by area (a desert is defined by low precipitation, not just heat). The Sahara is the largest hot desert."},
  {q:"Which country has the most natural lakes in the world?",o:["United States","Russia","Canada","Finland"],a:2,t:"World Geography",d:"medium",e:"Canada has more lakes than the rest of the world combined, with over 2 million lakes within its borders."},
  {q:"Mount Kilimanjaro, Africa's highest peak, is located in which country?",o:["Kenya","Tanzania","Uganda","Rwanda"],a:1,t:"World Geography",d:"medium",e:"Mount Kilimanjaro is located in Tanzania, near the border with Kenya. It is the highest free-standing mountain in the world."},
  {q:"Which strait separates Europe and Africa at their closest point?",o:["Strait of Hormuz","Strait of Gibraltar","Bosphorus Strait","Bering Strait"],a:1,t:"World Geography",d:"medium",e:"The Strait of Gibraltar separates Spain (Europe) from Morocco (Africa), at its narrowest point only about 14 km wide."},
  {q:"Which is the largest ocean in the world?",o:["Atlantic Ocean","Indian Ocean","Arctic Ocean","Pacific Ocean"],a:3,t:"World Geography",d:"easy",e:"The Pacific Ocean is the largest and deepest ocean, covering about a third of the Earth's surface."},
  {q:"What is the capital city of Australia?",o:["Sydney","Melbourne","Canberra","Brisbane"],a:2,t:"World Geography",d:"medium",e:"Canberra, not Sydney or Melbourne, is the capital city of Australia. It was purpose-built as the capital in the early 20th century."},
  {q:"Which African country is completely surrounded by South Africa (an enclave)?",o:["Swaziland (Eswatini)","Lesotho","Botswana","Malawi"],a:1,t:"World Geography",d:"hard",e:"Lesotho is an enclave entirely surrounded by South Africa, making it one of only three such countries in the world."},

  {q:"Who has won the most Olympic gold medals in history?",o:["Usain Bolt","Michael Phelps","Carl Lewis","Mark Spitz"],a:1,t:"Records & Achievements",d:"easy",e:"American swimmer Michael Phelps holds the record for the most Olympic gold medals, with 23 across his career."},
  {q:"What is the tallest building in the world as of the mid-2020s?",o:["Shanghai Tower","Burj Khalifa","One World Trade Center","Petronas Towers"],a:1,t:"Records & Achievements",d:"easy",e:"The Burj Khalifa in Dubai, UAE, standing at 828 metres, remains the tallest building in the world as of the mid-2020s."},
  {q:"Who is the youngest person to win a Nobel Peace Prize?",o:["Greta Thunberg","Malala Yousafzai","Wangari Maathai","Tawakkol Karman"],a:1,t:"Records & Achievements",d:"medium",e:"Malala Yousafzai of Pakistan won the Nobel Peace Prize in 2014 at age 17, making her the youngest Nobel laureate ever in any category."},
  {q:"Which country has the largest population in the world (as of the mid-2020s)?",o:["China","India","United States","Indonesia"],a:1,t:"Records & Achievements",d:"medium",e:"India overtook China to become the world's most populous country around 2023, according to UN estimates."},
  {q:"What is the longest-running animated TV series in US history?",o:["Family Guy","SpongeBob SquarePants","The Simpsons","South Park"],a:2,t:"Records & Achievements",d:"medium",e:"The Simpsons, which premiered in 1989, is the longest-running American animated series and longest-running American sitcom in history."},

  /* ── WORLD CULTURE & MISC ── */
  {q:"Which language has the most native speakers in the world?",o:["English","Spanish","Hindi","Mandarin Chinese"],a:3,t:"World Culture",d:"medium",e:"Mandarin Chinese has the most native speakers of any language in the world, with over 900 million native speakers."},

  {q:"Which country is known as the 'Land of the Rising Sun'?",o:["China","Japan","South Korea","Thailand"],a:1,t:"World Culture",d:"easy",e:"Japan is known as the 'Land of the Rising Sun,' a name derived from its position to the east of mainland Asia."},
  {q:"The Great Wall of China was built primarily to defend against which group?",o:["Mongol and other nomadic invasions","Japanese invasions","Russian invasions","Korean invasions"],a:0,t:"World Culture",d:"medium",e:"The Great Wall of China was built over centuries primarily to protect Chinese states from invasions by Mongol and other nomadic groups from the north."},
  {q:"Which European city is famously built on a series of canals and islands?",o:["Amsterdam","Venice","Stockholm","Copenhagen"],a:1,t:"World Culture",d:"easy",e:"Venice, Italy, is built across more than 100 small islands connected by canals and bridges, making it one of the world's most distinctive cities."},
  {q:"What is the name of India's traditional national sport?",o:["Cricket","Kabaddi","Hockey","Kho Kho"],a:2,t:"World Culture",d:"hard",e:"Hockey (field hockey) is officially India's national sport, though cricket is by far more popular and widely followed today."},
  {q:"The Eiffel Tower, located in Paris, was originally built for which event?",o:["The 1889 World's Fair","The 1900 Summer Olympics","Bastille Day Centennial","The French Revolution Bicentennial"],a:0,t:"World Culture",d:"medium",e:"The Eiffel Tower was built as the entrance arch for the 1889 World's Fair (Exposition Universelle), marking the centennial of the French Revolution."},
  {q:"Which country is home to the ancient pyramids of Giza?",o:["Sudan","Egypt","Mexico","Peru"],a:1,t:"World Culture",d:"easy",e:"The Pyramids of Giza, including the Great Pyramid, are located in Egypt, just outside modern-day Cairo."},
  {q:"What is the traditional Japanese art of paper folding called?",o:["Ikebana","Origami","Bonsai","Kintsugi"],a:1,t:"World Culture",d:"easy",e:"Origami is the traditional Japanese art of paper folding, used to create decorative and symbolic shapes."},
  {q:"Which country is the origin of the martial art 'Taekwondo'?",o:["China","Japan","South Korea","Thailand"],a:2,t:"World Culture",d:"medium",e:"Taekwondo originated in South Korea and is now one of the most widely practised martial arts in the world, and an Olympic sport."},

  /* ── WORLD ORGANISATIONS & LEADERS ── */
  {q:"What does the UN stand for?",o:["United Nations","United Nationalities","Universal Network","United Nordics"],a:0,t:"World Organisations",d:"easy",e:"UN stands for United Nations, an international organisation founded in 1945 to maintain international peace and security."},
  {q:"In which city is the headquarters of the United Nations located?",o:["Geneva","Brussels","New York City","The Hague"],a:2,t:"World Organisations",d:"easy",e:"The United Nations headquarters is located in New York City, USA, though it also has major offices in Geneva, Vienna, and Nairobi."},
  {q:"What does NATO stand for?",o:["North American Trade Organisation","North Atlantic Treaty Organisation","National Alliance for Trade and Order","Northern Allied Treaty Organisation"],a:1,t:"World Organisations",d:"medium",e:"NATO stands for North Atlantic Treaty Organisation, a military alliance of North American and European countries founded in 1949."},
  {q:"What does the WHO stand for, and what is its role?",o:["World Health Organisation — coordinates global public health","World Humanitarian Office — disaster relief","World Heritage Organisation — preserves cultural sites","World Hunger Organisation — food security"],a:0,t:"World Organisations",d:"easy",e:"WHO stands for World Health Organisation, a UN agency responsible for international public health, founded in 1948."},
  {q:"Which organisation is the African Union (AU) the successor of?",o:["Organisation of African Unity (OAU)","British Commonwealth","ECOWAS","Pan-African Congress"],a:0,t:"World Organisations",d:"medium",e:"The African Union (AU) was established in 2002 as the successor to the Organisation of African Unity (OAU), which had been founded in 1963."},
  {q:"What does ECOWAS stand for?",o:["Economic Community of West African States","European Community of West African States","East and Central West African Sector","Economic Council of West African Schemes"],a:0,t:"World Organisations",d:"medium",e:"ECOWAS stands for Economic Community of West African States, a regional political and economic union of 15 (now fewer after recent withdrawals) West African countries, including Nigeria."},
  {q:"Who is generally regarded as the first Secretary-General of the United Nations?",o:["Kofi Annan","Trygve Lie","Dag Hammarskjöld","U Thant"],a:1,t:"World Organisations",d:"hard",e:"Trygve Lie of Norway was the first Secretary-General of the United Nations, serving from 1946 to 1952."},
  {q:"Which African was the first to serve as UN Secretary-General?",o:["Nelson Mandela","Kofi Annan","Boutros Boutros-Ghali","Both Annan and Boutros-Ghali"],a:3,t:"World Organisations",d:"medium",e:"Both Boutros Boutros-Ghali (Egypt, 1992–1996) and Kofi Annan (Ghana, 1997–2006) were African UN Secretaries-General, with Boutros-Ghali being the first."},

  /* ── SCIENCE & DISCOVERY ── */
  {q:"Who developed the theory of relativity?",o:["Isaac Newton","Albert Einstein","Stephen Hawking","Niels Bohr"],a:1,t:"Science & Discovery",d:"easy",e:"Albert Einstein developed the theory of relativity, including special relativity (1905) and general relativity (1915)."},
  {q:"Who is credited with discovering penicillin?",o:["Louis Pasteur","Alexander Fleming","Marie Curie","Edward Jenner"],a:1,t:"Science & Discovery",d:"medium",e:"Alexander Fleming discovered penicillin in 1928, the first true antibiotic, revolutionising the treatment of bacterial infections."},
  {q:"Who proposed the theory of evolution by natural selection?",o:["Gregor Mendel","Charles Darwin","Louis Pasteur","Carl Linnaeus"],a:1,t:"Science & Discovery",d:"easy",e:"Charles Darwin proposed the theory of evolution by natural selection in his 1859 book 'On the Origin of Species.'"},
  {q:"Which scientist is known for developing the polio vaccine?",o:["Jonas Salk","Edward Jenner","Robert Koch","Louis Pasteur"],a:0,t:"Science & Discovery",d:"medium",e:"Jonas Salk developed the first successful polio vaccine, introduced in 1955."},
  {q:"What is the chemical symbol for gold?",o:["Go","Gd","Au","Ag"],a:2,t:"Science & Discovery",d:"easy",e:"The chemical symbol for gold is Au, from the Latin word 'aurum.'"},
  {q:"Marie Curie won Nobel Prizes in which two scientific fields?",o:["Chemistry and Medicine","Physics and Chemistry","Physics and Medicine","Medicine and Biology"],a:1,t:"Science & Discovery",d:"medium",e:"Marie Curie won Nobel Prizes in both Physics (1903) and Chemistry (1911) — the first person ever to win Nobel Prizes in two different sciences."},
  {q:"What is the closest planet to the Sun?",o:["Venus","Earth","Mercury","Mars"],a:2,t:"Science & Discovery",d:"easy",e:"Mercury is the closest planet to the Sun in our solar system."},
  {q:"Which gas makes up the largest percentage of Earth's atmosphere?",o:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],a:2,t:"Science & Discovery",d:"medium",e:"Nitrogen makes up about 78% of Earth's atmosphere, with oxygen at about 21%."},

  /* ── WORLD LEADERS, POLITICS & MISC HISTORY ── */
  {q:"Who was the first President of the United States?",o:["Thomas Jefferson","Abraham Lincoln","George Washington","John Adams"],a:2,t:"World Leaders & History",d:"easy",e:"George Washington was the first President of the United States, serving from 1789 to 1797."},
  {q:"Who was the first female Prime Minister of the United Kingdom?",o:["Theresa May","Margaret Thatcher","Liz Truss","Angela Merkel"],a:1,t:"World Leaders & History",d:"easy",e:"Margaret Thatcher became the UK's first female Prime Minister in 1979, serving until 1990. (Angela Merkel was Germany's, not the UK's, leader.)"},
  {q:"Who was the first President of post-apartheid South Africa?",o:["Thabo Mbeki","Nelson Mandela","F.W. de Klerk","Jacob Zuma"],a:1,t:"World Leaders & History",d:"easy",e:"Nelson Mandela became South Africa's first democratically elected, post-apartheid president in 1994, after spending 27 years in prison."},
  {q:"The Berlin Wall, which divided East and West Berlin, fell in which year?",o:["1985","1987","1989","1991"],a:2,t:"World Leaders & History",d:"medium",e:"The Berlin Wall fell on November 9, 1989, marking a key moment in the end of the Cold War and German reunification."},
  {q:"Which empire was Julius Caesar a leader of?",o:["Greek Empire","Roman Empire/Republic","Ottoman Empire","Persian Empire"],a:1,t:"World Leaders & History",d:"easy",e:"Julius Caesar was a Roman general and statesman who played a critical role in the transition from the Roman Republic to the Roman Empire."},
  {q:"World War II ended in which year?",o:["1943","1944","1945","1946"],a:2,t:"World Leaders & History",d:"easy",e:"World War II ended in 1945, with Germany surrendering in May and Japan surrendering in September after the atomic bombings."},
  {q:"Who was the first Emperor of China to unify the country?",o:["Qin Shi Huang","Liu Bang","Kublai Khan","Sun Yat-sen"],a:0,t:"World Leaders & History",d:"hard",e:"Qin Shi Huang unified China in 221 BC, becoming its first emperor and beginning construction of the early Great Wall."},
  {q:"Mahatma Gandhi led India's independence movement primarily through what method?",o:["Armed rebellion","Nonviolent civil disobedience","Diplomatic negotiation only","Economic sanctions"],a:1,t:"World Leaders & History",d:"easy",e:"Mahatma Gandhi championed nonviolent civil disobedience (Satyagraha) as the primary method in India's struggle for independence from British rule, achieved in 1947."},

  /* ── MORE WORLD FIRSTS ── */
  {q:"Who was the first woman to win a Nobel Prize?",o:["Mother Teresa","Marie Curie","Malala Yousafzai","Wangari Maathai"],a:1,t:"World Firsts",d:"easy",e:"Marie Curie was the first woman to win a Nobel Prize, receiving the Nobel Prize in Physics in 1903."},
  {q:"Which country built the world's first railway?",o:["France","Germany","United States","United Kingdom"],a:3,t:"World Firsts",d:"medium",e:"The United Kingdom built the world's first public steam railway — the Stockton and Darlington Railway — opened in 1825, followed by the Liverpool and Manchester Railway in 1830."},

  {q:"Who was the first African American president of the United States?",o:["Bill Clinton","Barack Obama","Colin Powell","Jesse Jackson"],a:1,t:"World Firsts",d:"easy",e:"Barack Obama became the 44th President of the United States in 2009, the first African American to hold the office."},

  {q:"The first artificial satellite ever launched into space was called what?",o:["Explorer 1","Vostok 1","Sputnik 1","Luna 1"],a:2,t:"World Firsts",d:"medium",e:"Sputnik 1, launched by the Soviet Union on October 4, 1957, was the first artificial Earth satellite."},

  /* ── MORE WORLD GEOGRAPHY ── */
  {q:"What is the capital of Canada?",o:["Toronto","Vancouver","Ottawa","Montreal"],a:2,t:"World Geography",d:"medium",e:"Ottawa is the capital of Canada. Toronto is the largest city, but Ottawa was chosen as capital in 1857 as a compromise between English and French Canada."},

  {q:"The Amazon rainforest is primarily located in which country?",o:["Colombia","Venezuela","Peru","Brazil"],a:3,t:"World Geography",d:"easy",e:"About 60% of the Amazon rainforest lies within Brazil. The remaining portions are spread across eight other South American countries."},

  {q:"The Sahara Desert spans how many African countries approximately?",o:["3","5","10","11"],a:3,t:"World Geography",d:"hard",e:"The Sahara Desert spans 11 African countries: Morocco, Algeria, Tunisia, Libya, Egypt, Mauritania, Mali, Niger, Chad, Sudan, and Eritrea."},
  {q:"Which sea lies between Europe and Africa?",o:["Red Sea","Black Sea","Mediterranean Sea","Arabian Sea"],a:2,t:"World Geography",d:"easy",e:"The Mediterranean Sea separates Southern Europe from North Africa, and has been a major trade and cultural corridor for thousands of years."},

  {q:"The Dead Sea, the lowest point on Earth's surface, borders which countries?",o:["Egypt and Sudan","Israel/Palestine and Jordan","Lebanon and Syria","Saudi Arabia and Iraq"],a:1,t:"World Geography",d:"medium",e:"The Dead Sea borders Israel/Palestine to the west and Jordan to the east, sitting about 430 metres below sea level."},

  {q:"What is the capital of Kenya?",o:["Mombasa","Nairobi","Kampala","Dar es Salaam"],a:1,t:"World Geography",d:"easy",e:"Nairobi is the capital and largest city of Kenya. It is also the most populous city in East Africa."},
