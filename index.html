  {q:"What was the only Dapchi schoolgirl not released by Boko Haram, and why?",o:["Amina Ali — because she was accused of leading an escape attempt","Leah Sharibu — because she refused to deny her Christian faith in exchange for release","Hauwa Liman — because she was accused of sharing information with security forces","Khadija Grema — because she was an aid worker's daughter"],a:1,t:"SCARS II – Ch.7",d:"easy",e:"Leah Sharibu is the only Dapchi schoolgirl not released by Boko Haram because she refused to denounce her Christian faith in exchange for her freedom. As of the time of writing, she remains in captivity."},
  {q:"What was the significance of the Islamic cleric Sheikh Jafaar Mahmud Adam's assassination?",o:["He was the founder of ISWAP","He was assassinated by Boko Haram on 13 April 2007 because his preaching was seen as favouring democracy and government policies contrary to Boko Haram's puritanism","He was the first Nigerian killed by Boko Haram","He was a government minister killed to undermine the state"],a:1,t:"SCARS II – Ch.7",d:"hard",e:"Sheikh Jafaar Mahmud Adam was a highly respected Islamic cleric whose preaching favoured democracy and government policies contrary to Boko Haram's puritanist disposition. He was assassinated on 13 April 2007 and had openly criticised Mohammed Yusuf's brand of Islam."},
  {q:"What major bridge connecting Dikwa and Gamboru was destroyed by Boko Haram, and what was the impact?",o:["Bama Bridge — it isolated Bama LGA from Maiduguri","The Sambisa Bridge — it blocked military access to Sambisa Forest","The Gamboru Bridge — it isolated Gamboru/Ngala and Kala Balge LGAs and disrupted trade to Cameroon and Chad","The Maiduguri Bridge — it cut off the state capital"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"The Gamboru Bridge, located along a major communication route connecting Dikwa and Gamboru, was destroyed by Boko Haram. This isolated Gamboru/Ngala and Kala Balge LGAs and largely disrupted commerce from Nigeria through Maiduguri to Cameroon, Chad, and Central Africa."},
  {q:"What did troops recover in captured Boko Haram camps besides military items, revealing a disturbing aspect of their operations?",o:["Foreign passports and currency","Stolen humanitarian aid","Sexual enhancement drugs and substances — indicating sexual exploitation as part of their modus operandi","Military uniforms of neighbouring countries"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"During exploration of captured Boko Haram camps, troops recovered sexual enhancement drugs and substances besides military items, revealing that lechery and sexual exploitation of abducted women and girls formed part of Boko Haram's modus operandi."},

  /* ── CHAPTER 8: DEEPER SCARS ── */
  {q:"What does the book cite as the UNDP-reported death toll from the Boko Haram conflict as of 2020?",o:["Nearly 100,000 deaths","Nearly 200,000 deaths","Nearly 350,000 deaths — about 314,000 from indirect causes","Nearly 500,000 deaths"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The UNDP report cited in Chapter 8 stated that as of 2020, the conflict may have resulted in nearly 350,000 deaths, with about 314,000 of those from indirect causes such as disease, famine, and displacement."},
  {q:"How many military officers and soldiers does the book state paid the supreme price between 2009 and 2021?",o:["Not less than 1,000","Not less than 1,700","Not less than 2,700","Not less than 5,000"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The book states that not less than 2,700 officers and soldiers have paid the supreme price in the defence of Nigeria between 2009 and 2021."},
  {q:"What does the military cemetery in Maiduguri reveal about the composition of casualties in the Boko Haram war?",o:["Only Muslim soldiers from the North are buried there","Only Christian soldiers are buried there","Almost an equal number of Christians and Muslims from all parts of Nigeria are buried there — debunking ethnic/religious bias claims","Only officers are buried there; other ranks are buried elsewhere"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The book states that a visit to military cemeteries shows almost an equal number of casualties from the marked graves, with two divisions — one for Christians and one for Muslims — debunking the false narrative that only certain groups bear the war's casualties."},
  {q:"As CDS, what international sporting initiative did General Irabor facilitate Nigeria's admission to for combat amputees?",o:["Paralympic Games","Commonwealth Games","Invictus Games","Special Olympics"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"As CDS, General Irabor facilitated Nigeria's admission to the Invictus Games, providing combat amputees and disabled soldiers a global platform to demonstrate indomitable spirits as they navigate post-service life."},
  {q:"What is DEPOWA, and what initiative did it establish that the author commended?",o:["Defence and Police Officers' Welfare Association — established a Veteran Employment Programme","Defence and Police Officers' Wives' Association — established a Post-Traumatic Stress Disorder (PTSD) Centre in Abuja","Defence Procurement Office for Weapons and Arms — established a de-mining programme","Department of Police and Army Welfare — established rehabilitation clinics"],a:1,t:"SCARS II – Ch.8",d:"hard",e:"DEPOWA stands for Defence and Police Officers' Wives' Association. The author commended their initiative to establish a Post-Traumatic Stress Disorder (PTSD) Centre in Abuja, as a welcome development needed for soldiers and civilians affected by the conflict."},
  {q:"On what date did the mistaken bombing of the IDP camp at Rann occur?",o:["17 January 2015","17 January 2016","17 January 2017","17 January 2018"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The catastrophic mistaken bombing of the IDP camp at Rann, headquarters of Kala/Balge LGA, Borno State, occurred on 17 January 2017 — a tragic 'blue-on-blue' incident during an anti-Boko Haram operation."},
  {q:"What was the death toll from the Rann bombing incident, and how many were wounded?",o:["Over 30 killed, 50 wounded","Over 50 killed, 70 wounded","Over 100 killed, a little over 100 wounded","Over 200 killed, 300 wounded"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"Over 100 persons — including women, children, and aid workers — were killed in the Rann bombing, and a little over 100 others were wounded in what was described as a devastating 'blue-on-blue' incident."},
  {q:"What does 'blue-on-blue' mean in military terminology as used in the context of the Rann bombing?",o:["A successful coordinated air and ground attack","An accidental attack on friendly forces or civilians rather than the enemy","A coordinated attack by two different military units","A naval bombing operation"],a:1,t:"SCARS II – Ch.8",d:"medium",e:"'Blue-on-blue' is military terminology for an accidental attack on one's own forces or friendly civilians rather than the enemy — exactly what occurred at Rann when an IDP camp was mistakenly bombed instead of a perceived Boko Haram target."},
  {q:"What weapons were captured from Boko Haram in the follow-up operation conducted two days after the Rann bombing?",o:["Rocket launchers and tanks","Browning Machine Guns, Anti-Aircraft guns, AK-47 rifles, mortars, gun trucks, and ammunition","Heavy artillery and surface-to-air missiles","Suicide vests and IED-making materials only"],a:1,t:"SCARS II – Ch.8",d:"hard",e:"The follow-up operation two days after the Rann bombing resulted in several Boko Haram members being killed and the capture of Browning Machine Guns (BMG), Anti-Aircraft guns, AK-47 Rifles, mortars, gun trucks, and an assortment of ammunition."},
  {q:"What does the book note about the Global Terrorism Index's treatment of Nigeria?",o:["It consistently ranks Nigeria as the safest country in West Africa","It consistently ranks Nigeria poorly, tending to portray the country as incapable of self-defence","It ignores Nigeria in its annual rankings","It praises Nigeria's military response to Boko Haram"],a:1,t:"SCARS II – Ch.8",d:"medium",e:"The book notes that the Global Terrorism Index has consistently ranked Nigeria poorly, with arguments tending to portray the country as incapable of self-defence — adding to the reputational damage caused by Boko Haram's activities."},

  /* ── CHAPTER 9: COMPLEXITY OF RESPONSE ── */
  {q:"What is the difference between 'doctrine' and 'strategy' as explained in Chapter 9?",o:["Doctrine is about weapons; strategy is about men","Doctrine is the 'how' — the guiding principles on how a force operates; strategy is the 'what' and 'why' — the approach to achieve objectives","Doctrine is written by politicians; strategy is written by generals","Doctrine applies in peacetime; strategy applies in war"],a:1,t:"SCARS II – Ch.9",d:"medium",e:"The book explains that doctrine is the 'how' — the guiding principles on how a force operates or fights — while strategy is the 'what' and 'why,' the art and science of utilising all elements of state power to achieve a desired outcome."},
  {q:"What does NNDP stand for, and what is its significance in Nigeria's security framework?",o:["Nigerian National Defence Protocol","Nigerian National Defence Policy — it outlines guidelines for addressing national security challenges","National Naval Defence Programme","Nigeria's Non-Defence Programme"],a:1,t:"SCARS II – Ch.9",d:"medium",e:"NNDP stands for Nigerian National Defence Policy. It outlines guidelines for addressing national security challenges, working alongside the National Security Strategy (NSS) to guide MDAs in crisis management."},
  {q:"Which body, according to Chapter 9, is mandated to advise the president on matters relating to the protection of Nigeria's national interests?",o:["The Joint Chiefs of Staff","The National Security Council (NSC)","The Defence Headquarters","The Ministry of Interior"],a:1,t:"SCARS II – Ch.9",d:"medium",e:"The National Security Council (NSC), without prejudice to the 1999 Constitution, is mandated to advise the president on matters relating to the protection of Nigeria's national interests."},
  {q:"According to the NNDP, who is the lead agency for the conduct of internal security in Nigeria?",o:["The Nigerian Army","The Department of State Security","The Nigeria Police Force (NPF)","The Ministry of Interior"],a:2,t:"SCARS II – Ch.9",d:"medium",e:"According to the NNDP, the Nigeria Police Force (NPF) is the lead agency for the conduct of internal security, with the Ministry of Interior as the lead ministry. The AFN is employed to support as required by law."},
  {q:"Under what conditions does the Ministry of Defence become the lead ministry for internal security?",o:["Whenever there is any crime","Only when foreigners are involved","When internal security involves curbing insurrections and severe internal crises","Only when the Police Commissioner requests military support"],a:2,t:"SCARS II – Ch.9",d:"hard",e:"When internal security involves curbing insurrections and severe internal crises, the Ministry of Defence (MOD) becomes the lead ministry, while the Defence Headquarters becomes the lead agency for conducting operations."},
  {q:"What type of crises classification assigns NEMA as the coordinating agency according to Chapter 9?",o:["Internal Security crises","War and Low-Intensity Conflict","Disaster management — both man-made and natural disasters","External threats"],a:2,t:"SCARS II – Ch.9",d:"medium",e:"In disaster management situations — including man-made or natural disasters — NEMA (National Emergency Management Agency) is responsible for coordinating the activities of all government agencies, supported by emergency response centres at LGA, state, and national levels."},
  {q:"What bodies provide intelligence support before, during, and after internal security operations according to Chapter 9?",o:["Interpol and the CIA","The Intelligence Community Committee (ICC) and the Joint Intelligence Board (JIB)","The DSS and the Police Intelligence Unit","The Military Intelligence Directorate only"],a:1,t:"SCARS II – Ch.9",d:"hard",e:"The Intelligence Community Committee (ICC) and the Joint Intelligence Board (JIB) are tasked with providing timely and actionable intelligence support before, during, and after internal security operations."},
  {q:"What does the book say about the intelligence provided before the Rann bombing, and what went wrong?",o:["Intelligence was absent — the operation was conducted blindly","Intelligence from partners had been precise and consistent — but the Battle Damage Assessment revealed the target was an IDP camp not a Boko Haram gathering","Intelligence was deliberately falsified by traitors","The military ignored available intelligence warning against the strike"],a:1,t:"SCARS II – Ch.8",d:"hard",e:"The book states that intelligence from partners had been consistent and precise before the Rann bombing, giving confidence to act. However, the Battle Damage Assessment revealed the target was mistakenly identified — an IDP camp rather than a Boko Haram armed gang — a catastrophic intelligence failure."},
  {q:"What does Chapter 9 identify as the overall framework within which Nigeria's response to Boko Haram was situated?",o:["An exclusively military framework under the Chief of Army Staff","The National Defence Policy (NDP) and National Security Strategy (NSS) guiding MDAs and stakeholders across government","A framework imposed by the United Nations","An ad-hoc presidential committee framework"],a:1,t:"SCARS II – Ch.9",d:"medium",e:"Chapter 9 situates the response to Boko Haram within the essential policy frameworks of the National Defence Policy (NDP) and National Security Strategy (NSS), which guide and shape responses by ministries, departments, and agencies (MDAs) of the government and other stakeholders."},
  {q:"What does the book say about the emotional toll of the Boko Haram war on soldiers with families?",o:["Soldiers with families performed better in combat","Family life had no effect on military performance","Starting a family changed a soldier's risk calculus — risks to his life became a shared burden with family, affecting mental health, unit cohesion, and mission accomplishment","The military deliberately kept soldiers away from their families to improve combat performance"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The book describes how starting a family transforms a soldier — risks to his life are no longer solely his but become a shared burden with his immediate family. Prolonged separation, missed birthdays and graduations, and the emotional strain of combat stress led to marital cracks, mental health disorders, and in some cases, suicide or fratricide within operational areas."},

  /* ── ADDITIONAL CHAPTER 4 ── */
  {q:"What vegetation type characterises the North-East Region of Nigeria?",o:["Tropical Rainforest","Guinea Savannah","Sahel Savannah","Mangrove Swamp"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"The North-East Region falls within the Sahel Savannah — a semi-arid belt characterised by long dry seasons, limited rainfall (June–September in northern parts), and sparse vegetation."},
  {q:"The Borno plains, dominating Yobe and Borno States, have an elevation range of approximately?",o:["100–200 metres","300–600 metres","800–1,000 metres","1,200–1,500 metres"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"The Borno plains are mainly flat and expansive, generally low-lying with an elevation ranging between 300 and 600 metres above mean sea level."},
  {q:"Where does the River Benue flow within the North-East Region?",o:["Through Borno and Yobe States","Through the southern parts of Adamawa and Taraba States","Through Bauchi and Gombe States","Through Yobe State only"],a:1,t:"SCARS II – Ch.4",d:"medium",e:"The River Benue flows through the southern parts of Adamawa and Taraba States, serving as an essential water source for agriculture, fishing, and transportation."},
  {q:"What is the approximate geographical coordinate range within which the North-East Region is situated?",o:["Latitudes 5°N–9°N, Longitudes 5°E–10°E","Latitudes 9°N–14°N, Longitudes 10°E–15°E","Latitudes 12°N–18°N, Longitudes 8°E–13°E","Latitudes 7°N–11°N, Longitudes 12°E–17°E"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"The North-East Region is situated between latitudes 9°N and 14°N and longitudes 10°E and 15°E in north-east Nigeria."},
  {q:"What major economic products are exported from Maiduguri according to Chapter 4?",o:["Crude oil, rubber, and timber","Cattle hides, goat skins, dried fish, crocodile skins, groundnuts, and gum Arabic","Gold, tin, and columbite","Cotton, indigo, and salt only"],a:1,t:"SCARS II – Ch.4",d:"medium",e:"From Maiduguri, livestock, cattle hides, goat skins, sheep skins, finished leather products, dried fish, crocodile skins, groundnuts, and gum Arabic are exported. Local industries include cotton weaving, dyeing, and leather tanning."},
  {q:"What mineral resources does Borno State possess according to the book?",o:["Crude oil and natural gas only","Coal, iron ore, and gold","Clay, salt, potash, limestone, kaolin, sandstone, iron ore, uranium, quartz, magnesite, mica, and granite","Tin, columbite, and lead"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"Borno State has significant deposits of mineral resources including clay, salt, potash, limestone, kaolin, sandstone, iron ore, uranium, quartz, magnesite, mica, and granite, in addition to oil and gas deposits discovered in commercial quantities."},
  {q:"What is Borno State's unemployment rate as cited from the Q4 2020 NBS data?",o:["23.25%","33.25%","43.25%","53.25%"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The Q4 2020 NBS data puts Borno State's unemployment rate at 43.25%, making it the 10th state in Nigeria with the highest unemployment and the 3rd in the North-East."},
  {q:"What is Borno State's rank in the overall BudgIT 2023 Fiscal Performance Ranking?",o:["5th","8th","12th","20th"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"Borno State currently ranks 12th out of 36 states in the overall Fiscal Performance Ranking with an IGR value of 20.05 billion naira according to the 2023 BudgIT report."},
  {q:"What is Yobe State's Internally Generated Revenue (IGR) as cited in the BudgIT 2023 ranking?",o:["N4.5bn","N9.94bn","N15.2bn","N20bn"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"Yobe State's IGR is N9.94bn — among the lowest in the federation based on the BudgIT 2023 State of States ranking, reflecting the economic impact of insurgency and underdevelopment."},
  {q:"What is Adamawa State's IGR for 2022 as cited in the book?",o:["N8.5 billion","N10.2 billion","N13.2 billion","N18 billion"],a:2,t:"SCARS II – Ch.4",d:"hard",e:"The IGR of Adamawa State stood at N13.2 billion in 2022, reflecting its economic activities and revenue generation capacity despite challenges of insecurity and infrastructure deficits."},
  {q:"What cultural event in the North-East is described as characterised by vibrant traditional horse parades and usually marks the culmination of Muslim festivals?",o:["The Bade Fishing Festival","The Mau Festival","The Durbar Festival","The Kanuri Cultural Week"],a:2,t:"SCARS II – Ch.4",d:"easy",e:"The Durbar Festival is characterised by vibrant displays of traditional horse parades and cultural performances, often marking the culmination of significant Muslim festivals such as Eid al-Fitr and Eid al-Adha."},
  {q:"What are the two rivers that feed the Sambisa Forest according to Chapter 4?",o:["River Niger and River Benue","The Yedseram River and various rivers from the Mandara Mountains","The Komadugu-Yobe and Chari Rivers","The Hadejia and Logone Rivers"],a:1,t:"SCARS II – Ch.4",d:"hard",e:"The Sambisa Forest is a wetland and receptacle for various rivers and streams emanating from the Mandara Mountains, with the Yedseram River also feeding the wetland system."},
  {q:"How many ethnic groups does the book list as major groups in the North-East Region?",o:["5","8","Over 14 major groups including Kanuri, Fulani, Hausa, Babur, Bachama and others","Only 3 — Hausa, Fulani, and Kanuri"],a:2,t:"SCARS II – Ch.4",d:"medium",e:"The book lists major ethnic groups including Kanuri/Manga, Fulani, Ngizim, Bolewa, Bade, Kare-Kare, Hausa, Ngamo, Babur/Maga, Bachama, Gude, Bata, Waja, Chamba, and others — reflecting the region's diverse cultural tapestry."},

  /* ── ADDITIONAL CHAPTER 5 ── */
  {q:"What was the full name of the mosque where Boko Haram's founding youth group originally worshipped in Maiduguri?",o:["Ibn Taimiyyah Masjid","Alhaji Muhammadu Indimi Mosque","Al-Firdausi Central Mosque","Borno Central Mosque"],a:1,t:"SCARS II – Ch.5",d:"hard",e:"The origin of Boko Haram lies in a group of radical Islamist youths who worshipped at the Alhaji Muhammadu Indimi Mosque in Maiduguri, before later establishing the Ibn Taimiyyah Masjid."},
  {q:"To which Muslim brotherhood group had Mohammed Yusuf belonged before breaking away due to doctrinal disagreements?",o:["Izala Society","Jamatu Nasril Islam","Muslim Brotherhood in Nigeria led by Ibrahim El-Zakzaky","Ansaru"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"Mohammed Yusuf's first major venture as an Islamic teacher was with the Muslim Brotherhood in Nigeria, led by Ibrahim El-Zakzaky. He later left the group having disagreed with their doctrine."},
  {q:"What political group's members became easy recruits for Boko Haram according to the book?",o:["Former soldiers","University students","Political thugs who felt used and abandoned by politicians and were no longer economically sustained","Civil servants who lost their jobs"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"Many of Mohammed Yusuf's followers were among political thugs who were no longer being sustained economically by the politicians who had used them. Mohammed Yusuf's 'Yan Boko' rhetoric resonated strongly with this disillusioned group."},
  {q:"What group was Boko Haram originally tagged as in Yobe State in 2003 due to their Taliban-like dress code?",o:["Borno Jihadists","Lake Chad Militants","Yobe Taliban","Sambisa Fighters"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"Boko Haram members who resurfaced in Kanama, Yobe State in 2003 became infamous for trouble-making and their strict dress code modelled after the Afghan Taliban, leading to being tagged as the 'Yobe Taliban.'"},
  {q:"Who owned the land on which Mohammed Yusuf built the Ibn Taimiyyah Masjid?",o:["The Borno State Government","Mohammed Yusuf himself","Baba Fugu Mohammed — Yusuf's father-in-law","The local emirate council"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"The Ibn Taimiyyah Masjid was built at the centre of Maiduguri, near the railway station, on land owned by Baba Fugu Mohammed — Mohammed Yusuf's father-in-law."},
  {q:"What year did Boko Haram declare an independent Islamic caliphate in North-East Nigeria?",o:["2012","2013","2014","2015"],a:2,t:"SCARS II – Ch.5",d:"medium",e:"By 2014, Boko Haram insurgents succeeded in capturing territories and declared an independent Islamic caliphate in North-East Nigeria, representing the peak of their territorial control."},
  {q:"What triggered the July 2009 escalation that led to Mohammed Yusuf's arrest and death?",o:["A mosque bombing by security forces","A clash over motorcycle helmets during a funeral procession leading to attacks on police stations in Bauchi and Yobe","A prison break by Boko Haram members","A political assassination by Boko Haram"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"The July 2009 escalation began when Boko Haram clashed with police over motorcycle helmets during a funeral procession. The group then attacked police stations in Bauchi and Yobe States, leading to Mohammed Yusuf's arrest and controversial death in police custody."},
  {q:"What key difference existed between Mohammed Yusuf's and Abubakar Shekau's approaches to achieving Boko Haram's goals?",o:["Yusuf was more violent; Shekau was more patient","Yusuf was more of a cleric using extended faith-based arguments; Shekau was more militaristic and violent","Yusuf focused on the South; Shekau focused on the North","Yusuf targeted Christians; Shekau targeted Muslims"],a:1,t:"SCARS II – Ch.5",d:"medium",e:"Whereas Mohammed Yusuf adopted an extended period of faith-based arguments and was more of a cleric, Abubakar Shekau was more militaristic and violent in trying to attain the same goals — a fundamental difference in leadership style that shaped the group's evolution."},
  {q:"Abu Mus'ab Al-Barnawi defected to which Boko Haram offshoot in 2013?",o:["ISWAP","Al-Shabaab","Ansaru","Jamatu Ahlus Sunnah"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"In 2013, Al-Barnawi defected to Ansaru — a Boko Haram offshoot with ties to Al-Qaeda — after frequently clashing with Shekau and other senior leaders. The two groups continued to work closely on the goal of creating a caliphate."},
  {q:"In 2016, who named Al-Barnawi as Boko Haram's new Wali for Lake Chad, triggering a major internal feud?",o:["Al-Qaeda central leadership","The United Nations","ISIS (Islamic State)","The Nigerian government through negotiations"],a:2,t:"SCARS II – Ch.5",d:"hard",e:"In 2016, ISIS named Al-Barnawi as Boko Haram's new Wali (Arabic for governor) for Lake Chad. This announcement caused a major internal feud with Shekau, ultimately leading to the formal split and formation of ISWAP."},

  /* ── ADDITIONAL CHAPTER 6 ── */
  {q:"What rhetorical question does the book use to challenge Boko Haram's claim that western education is incompatible with Islam?",o:["Why do Arabs drive cars if they reject western technology?","How do the Chinese and greater eastern bloc interpret education differently yet in sync with 'Western' education while maintaining their identity?","Why does Saudi Arabia use the internet?","How do Boko Haram members use mobile phones?"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The book challenges Boko Haram's anti-western education stance by asking: how can the Chinese and eastern bloc interpret education differently yet in sync with 'Western' education while maintaining their identity? And how do Turks use 'western' education to promote peace and development while maintaining Islamic values?"},
  {q:"What does the book say about a 'system of education that confines children to be street beggars'?",o:["It is a valid form of Islamic education","It is what the Qur'an contemplated for proper Muslim upbringing","It is not what the Qur'an contemplated — the Qur'an advocates for religious ideals within the context of societal change, not such cruelty","It should be adopted across the North"],a:2,t:"SCARS II – Ch.6",d:"medium",e:"The book argues that a system that confines children to be street beggars 'is not what the Qur'an contemplated.' The author states the Qur'an advocates for religious ideals within the context of societal change and plurality — not violence and disorder."},
  {q:"Which three countries does the book cite as examples where the system of education propagated by Boko Haram does NOT exist?",o:["Egypt, Jordan, Morocco","Saudi Arabia, UAE, Turkey","Iran, Pakistan, Afghanistan","Malaysia, Indonesia, Bangladesh"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The book states that the system promoted by Boko Haram 'does not exist in Saudi Arabia, the UAE or Turkey and many other places' — only in countries where political establishments aim to divert attention from core governance issues."},
  {q:"What does Peter Tosh's philosophy cited in Chapter 6 say about peace and justice?",o:["Peace must come before justice","Justice must come before peace — equal rights and justice are preferred to peace, as peace is a mirage without them","Peace and justice are equally important","Neither peace nor justice matters in conflict"],a:1,t:"SCARS II – Ch.6",d:"medium",e:"The book cites Peter Tosh's philosophy that 'equal rights and justice are preferred to peace' — arguing that pursuing peace is a mirage in the absence of equal rights and justice, which are sacrosanct and immutable to peace."},
  {q:"What does the book identify as a critical driver of Boko Haram's strength — contrasting the 'wealth of notable indigenes' with ground realities?",o:["Borno's oil wealth funding Boko Haram","The contradiction between the intellectual and commercial wealth of Kanem-Bornu heritage and the deplorable infrastructure — roads, bridges, schools — that reflect decades of elite neglect","Foreign funding from ISIS and Al-Qaeda","Military corruption allowing Boko Haram to acquire weapons"],a:1,t:"SCARS II – Ch.6",d:"hard",e:"The book notes the paradox: Borno has notable wealthy indigenes and a rich historical civilisation (Kanem-Bornu), yet roads are deplorable, Kala Balge and Gamboru Ngala have no roads or bridges despite being able to produce all of Nigeria's rice — reflecting elite neglect that breeds resentment and radicalisation."},

  /* ── ADDITIONAL CHAPTER 7 ── */
  {q:"On what date did Boko Haram attack and bomb the This Day Newspapers building in Abuja?",o:["14 February 2012","26 April 2012","16 June 2011","7 February 2012"],a:1,t:"SCARS II – Ch.7",d:"hard",e:"On 26 April 2012, the This Day Newspapers building at Utako, Abuja, was attacked by Boko Haram using vehicle-borne explosive devices."},
  {q:"On 15 February 2012, Boko Haram attacked a prison in which state, freeing 119 inmates?",o:["Borno State","Niger State — Koton-Karfe","Kogi State — Koton-Karfe","Kaduna State"],a:2,t:"SCARS II – Ch.7",d:"hard",e:"On 15 February 2012, Boko Haram attacked Koton-Karfe prisons in Kogi State, using explosives to free 119 prison inmates including their detained members — demonstrating their capacity to operate southward."},
  {q:"What did the assassination of Abba Anas bin Umar (brother of the Shehu of Borno) in May 2011 demonstrate?",o:["Boko Haram was targeting foreigners","Boko Haram was willing to target even the highest traditional institutions and political figures opposing them","It was a random act of violence","The Shehu of Borno supported Boko Haram"],a:1,t:"SCARS II – Ch.7",d:"hard",e:"The assassination of Abba Anas bin Umar, brother of the Shehu of Borno, in May 2011 demonstrated that Boko Haram was willing to target even the most revered traditional institutions and prominent political figures who opposed their ideology."},
  {q:"What was Boko Haram's stated goal behind destroying bridges along the Mararaba Mubi–Michika–Madagali Road in Adamawa State?",o:["To stop military supply convoys","To carve out their avowed caliphate by isolating territories","To prevent civilians from fleeing","To disrupt oil pipeline access"],a:1,t:"SCARS II – Ch.7",d:"medium",e:"Boko Haram destroyed bridges in Adamawa and Borno States to ensure that they carved out their avowed caliphate — isolating regions, preventing government access, and consolidating territorial control."},
  {q:"What happened to the Federal College of Fisheries in Baga during the insurgency?",o:["It was converted into a Boko Haram camp","It was relocated to Maiduguri","It was ruined — destroyed by Boko Haram","It continued operating under military protection"],a:2,t:"SCARS II – Ch.7",d:"medium",e:"The Federal College of Fisheries in Baga was ruined by Boko Haram, along with many industrial concerns in Maiduguri, Bama, Monguno, and other localities."},

  /* ── ADDITIONAL CHAPTER 8 ── */
  {q:"What does the book say was 'normal' for the North-East population during the peak of Boko Haram's reign?",o:["Military curfews","Starvation, displacement, and constant movement from place to place","Electricity blackouts","Internet shutdowns"],a:1,t:"SCARS II – Ch.8",d:"easy",e:"The book describes how 'starvation also became normal while displacement was commonplace. No abode was particular for any defined period. What was more certain was movement from place to place amidst sufferings of incalculable magnitude.'"},
  {q:"The book mentions IDP camps in multiple locations. Which of the following is NOT listed as an IDP location in the book?",o:["Dikwa","Gamboru-Ngala","Rann","Kano"],a:3,t:"SCARS II – Ch.8",d:"medium",e:"The book mentions IDP locations including Maiduguri, Dikwa, Gamboru-Ngala, Rann, Bama, Banki, Gwoza, Damboa, Damasak, and Monguno. Kano is not listed as an IDP camp location in the chapter."},
  {q:"What does the book say about the shelter and sanitary conditions of IDP camps?",o:["They were well-equipped and professionally managed","They were adequate for short-term needs","They were deplorable and not fit for human habitation","They met international humanitarian standards"],a:2,t:"SCARS II – Ch.8",d:"easy",e:"The book states that 'the shelter and sanitary conditions of the IDP camps were deplorable and not fit for human habitation' — with conditions across Nigeria, Northern Cameroon, and Chad all failing displaced persons."},
  {q:"What does the book say about phantom limb pain in the context of amputee soldiers?",o:["It is a myth not experienced by Nigerian soldiers","The anxiety occasioned by amputation alternated with depression for the amputee and primary caregivers","It only affects civilian amputees","It can be fully cured within one year"],a:1,t:"SCARS II – Ch.8",d:"hard",e:"The book describes how, amid the prospect of phantom limb pain, the anxiety occasioned by amputation often alternated with depression — not just for the amputee, but for the primary caregivers, raising profound questions about family support and institutional rehabilitation services."},
  {q:"What does the book identify as an erroneous view about which soldiers were sent to fight in the North-East?",o:["That only Northerners were sent","That only officers were deployed — not other ranks","That only military personnel from certain ethnic groups or religious faiths were sent, resulting in more losses from those groups","That the military refused to deploy at all"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The book identifies as erroneous the view 'that only military personnel from certain ethnic groups or religious faiths were sent to the NE to confront terrorists, resulting in more losses from those groups.' A visit to military cemeteries debunks this — showing almost equal casualties from all groups."},
  {q:"What does the book say about Nigeria's diplomatic relationships during the Boko Haram crisis?",o:["All of Nigeria's allies responded positively without exception","The crisis led Nigeria to reassess diplomatic engagements — particularly in military hardware procurement — after some allies did not demonstrate expected depth of friendship","Nigeria received no international support whatsoever","The crisis strengthened all of Nigeria's alliances"],a:1,t:"SCARS II – Ch.8",d:"medium",e:"The book states that while many allies responded positively, some did not demonstrate the expected depth of 'friendship,' leading Nigeria to reassess its diplomatic engagements, particularly in the area of military hardware procurement."},
  {q:"What community psychological phenomenon does the book describe as emerging as Boko Haram violence continued?",o:["Communities became more united in resistance","Communities fragmented along ethnic lines","Violence gradually became the 'new normal' as initial outrage waned and communities adjusted psychologically","Communities completely evacuated affected areas"],a:2,t:"SCARS II – Ch.8",d:"medium",e:"The book observes that 'as times passed, it would appear that the initial outrage at the abductions and other violent crimes waned, indicating that people were gradually adjusting to violence as the new normal' — a deeply troubling community psychological adaptation to prolonged terror."},

  /* ── ADDITIONAL CHAPTER 9 ── */
  {q:"What does Chapter 9 say about 'policy' in the context of crisis management?",o:["Policy is specific and operational — it tells soldiers exactly how to fight","Policy is a set of guidelines or principles that show the overall approach to decision-making — broad in scope, providing direction and consistency","Policy and strategy mean the same thing","Policy is only relevant in peacetime"],a:1,t:"SCARS II – Ch.9",d:"medium",e:"The book defines policy as 'a set of guidelines or principles that show the overall approach to decision-making for a group.' It is broad in scope, covers a variety of themes, and provides direction and consistency in decision-making — ensuring all actions align with organisational objectives."},
  {q:"At the state level, what body is responsible for coordinating internal security measures according to Chapter 9?",o:["The State Emergency Management Agency","The State Security Council","The State Governor's Security Committee","The Regional Commander of the Army"],a:1,t:"SCARS II – Ch.9",d:"medium",e:"At the state level, the State Security Council is responsible for coordinating internal security measures, with a similar structure also existing at the local government level."},
  {q:"What does the book say is 'the purpose of the AFN when committed to combat'?",o:["To protect civilians and infrastructure","To demonstrate military capability to allies","To fight and win, concluding hostilities on terms favourable to Nigeria and her allies","To enforce ceasefires and peacekeeping"],a:2,t:"SCARS II – Ch.9",d:"medium",e:"The book states that 'when the AFN is committed to combat, its purpose will be to fight and win, concluding hostilities on terms favourable to Nigeria and her allies' — a clear statement of the military's primary warfighting purpose."}
];

const THEMES={
  nigeria:{accent:'#008751',accentDark:'#005c37',accentLight:'#d4f0e4',accentTextDark:'#004d2e',name:'Nigeria CBT',emoji:'🇳🇬'},
  global:{accent:'#1d4ed8',accentDark:'#1e40af',accentLight:'#dbeafe',accentTextDark:'#1e3a8a',name:'Global Knowledge CBT',emoji:'🌍'},
  firsts:{accent:'#7c3aed',accentDark:'#5b21b6',accentLight:'#ede9fe',accentTextDark:'#4c1d95',name:'Nigeria Firsts, SDGs & Agency Heads',emoji:'🏅'},
  science:{accent:'#0891b2',accentDark:'#0e7490',accentLight:'#cffafe',accentTextDark:'#164e63',name:'General Science CBT',emoji:'🔬'},
  scars:{accent:'#b45309',accentDark:'#92400e',accentLight:'#fef3c7',accentTextDark:'#78350f',name:'SCARS – Gen. Irabor',emoji:'📖'},
  scars2:{accent:'#be123c',accentDark:'#9f1239',accentLight:'#ffe4e6',accentTextDark:'#881337',name:'SCARS II – Chapters 4–9',emoji:'📕'}
};

let section=null,TOTAL=0,qs=[],cur=0,ans=[],score=0;
let timerOn=false,totalSecs=0,secsLeft=0,timerInterval=null,customMins=60;

function applyTheme(key){
  const t=THEMES[key];
  document.documentElement.style.setProperty('--accent',t.accent);
  const app=document.getElementById('app');
  app.style.borderTop=`3px solid ${t.accent}`;
}

function fmt(s){const m=Math.floor(s/60),sec=s%60;return`${m}:${sec<10?'0':''}${sec}`;}

function showPicker(){
  clearInterval(timerInterval);
  section=null;
  document.getElementById('hdr-title').textContent='Quiz Sections';
  document.getElementById('hdr-sub').textContent='Choose a section to begin your practice';
  document.getElementById('app').style.borderTop='none';
  const main=document.getElementById('main');
  const cards=[
    {key:'nigeria',bar:'#008751',icon:'#d4f0e4',emoji:'🇳🇬',label:'Nigeria CBT',desc:`${NIGERIA_BANK.length} questions · Politics, States, History, Sports, Music, Agencies & Ministers`,countBg:'#d4f0e4',countColor:'#004d2e'},
    {key:'global',bar:'#1d4ed8',icon:'#dbeafe',emoji:'🌍',label:'Global Knowledge CBT',desc:`${GLOBAL_BANK.length} questions · Flags, World Firsts, Founders, Geography, Records & Culture`,countBg:'#dbeafe',countColor:'#1e3a8a'},
    {key:'firsts',bar:'#7c3aed',icon:'#ede9fe',emoji:'🏅',label:'Nigeria Firsts, SDGs & Agencies',desc:`${FIRSTS_BANK.length} questions · Nigerian pioneers, all 17 SDGs, heads of parastatals`,countBg:'#ede9fe',countColor:'#4c1d95'},
    {key:'science',bar:'#0891b2',icon:'#cffafe',emoji:'🔬',label:'General Science CBT',desc:`${SCIENCE_BANK.length} questions · Biology, Chemistry, Physics, Space & Earth Science`,countBg:'#cffafe',countColor:'#164e63'},
    {key:'scars',bar:'#b45309',icon:'#fef3c7',emoji:'📖',label:'SCARS – Gen. Irabor',desc:`${SCARS_BANK.length} questions · Boko Haram, Nigeria's history, coups, civil war & security`,countBg:'#fef3c7',countColor:'#78350f'},
    {key:'scars2',bar:'#be123c',icon:'#ffe4e6',emoji:'📕',label:'SCARS II – Chapters 4–9',desc:`${SCARS2_BANK.length} questions · North-East geography, Boko Haram leadership, attacks & response`,countBg:'#ffe4e6',countColor:'#881337'},
  ];
  main.innerHTML=`<div class="pick-grid">${cards.map(c=>`
    <button class="pick-card" onclick="selectSection('${c.key}')">
      <div class="pick-card-bar" style="background:${c.bar}"></div>
      <div class="pick-card-inner">
        <div class="pick-icon" style="background:${c.icon}">${c.emoji}</div>
        <div class="pick-text">
          <h4>${c.label}</h4>
          <p>${c.desc}</p>
        </div>
        <span class="pick-count" style="background:${c.countBg};color:${c.countColor}">${c.key==='nigeria'?NIGERIA_BANK.length:c.key==='global'?GLOBAL_BANK.length:FIRSTS_BANK.length}Q</span>
        <span class="pick-arrow">›</span>
      </div>
    </button>`).join('')}
  </div>`;
}

function selectSection(key){
  section=key;
  const t=THEMES[key];
  TOTAL=key==='nigeria'?NIGERIA_BANK.length:key==='global'?GLOBAL_BANK.length:key==='firsts'?FIRSTS_BANK.length:key==='science'?SCIENCE_BANK.length:key==='scars'?SCARS_BANK.length:SCARS2_BANK.length;
  document.getElementById('hdr-title').textContent=t.name;
  document.getElementById('hdr-sub').textContent=`${TOTAL} questions · Set your timer to begin`;
  applyTheme(key);
  startSetup();
}

function startSetup(){
  clearInterval(timerInterval);
  const t=THEMES[section];
  const main=document.getElementById('main');
  const presets=[15,30,45,60,90];
  const btns=presets.map(m=>`<button class="dur-btn${customMins===m?' sel':''}" data-m="${m}" onclick="selDur(${m},this)">${m} min</button>`).join('');
  main.innerHTML=`
    <div class="setup">
      <div class="setup-title">⏱ Set your timer</div>
      <p>Choose a duration for all ${TOTAL} questions, or enter a custom time. You can also turn the timer off.</p>
      <div class="dur-grid">${btns}<button class="dur-btn${!timerOn&&customMins===0?' sel':''}" data-m="0" onclick="selDur(0,this)">No timer</button></div>
      <div class="custom-row">
        Custom: <input type="number" id="cmin" min="1" max="300" value="${customMins||60}" oninput="selDur(+this.value,null)"> minutes
      </div>
      <div class="setup-btns">
        <button class="btn" onclick="showPicker()">← Sections</button>
        <button class="btn btnp" style="background:${t.accent}" onclick="startExam()">Start Exam →</button>
      </div>
    </div>`;
  styleSelected();
}

function styleSelected(){
  const t=THEMES[section];
  document.querySelectorAll('.dur-btn').forEach(b=>{
    if(b.classList.contains('sel')){b.style.borderColor=t.accent;b.style.background=t.accentLight;b.style.color=t.accentTextDark;}
    else{b.style.borderColor='';b.style.background='';b.style.color='';}
  });
}

function selDur(m,el){
  customMins=m;
  document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('sel'));
  if(el)el.classList.add('sel');
  else{
    const match=[...document.querySelectorAll('.dur-btn')].find(b=>+b.dataset.m===m);
    if(match)match.classList.add('sel');
  }
  const ci=document.getElementById('cmin');
  if(ci)ci.value=m||60;
  styleSelected();
}

function startExam(){
  const t=THEMES[section];
  timerOn=customMins>0;
  totalSecs=customMins*60;
  secsLeft=totalSecs;
  const src=section==='nigeria'?NIGERIA_BANK:section==='global'?GLOBAL_BANK:section==='firsts'?FIRSTS_BANK:section==='science'?SCIENCE_BANK:section==='scars'?SCARS_BANK:SCARS2_BANK;
  qs=[...src].sort(()=>Math.random()-0.5);
  ans=new Array(TOTAL).fill(null);
  cur=0;score=0;
  clearInterval(timerInterval);
  if(timerOn){
    timerInterval=setInterval(()=>{
      secsLeft--;
      const fill=document.getElementById('tmr-fill');
      const val=document.getElementById('tmr-val');
      if(fill){fill.style.width=(secsLeft/totalSecs*100)+'%';if(secsLeft<=60){fill.classList.add('warn');}}
      if(val){val.textContent=fmt(secsLeft);if(secsLeft<=60)val.classList.add('warn');}
      if(secsLeft<=0){clearInterval(timerInterval);showRes(true);}
    },1000);
  }
  render();
}

function cls(i){
  const t=THEMES[section];
  if(i===cur)return'nb cur';
  if(ans[i]===null)return'nb';
  return ans[i]===qs[i].a?'nb ok':'nb bad';
}

function render(){
  const t=THEMES[section];
  const main=document.getElementById('main');
  const done=ans.filter(x=>x!==null).length;
  const pct=Math.round((done/TOTAL)*100);
  const q=qs[cur];
  const answered=ans[cur]!==null;
  const nav=qs.map((_,i)=>{
    const c=cls(i);
    const style=i===cur?`style="border-color:${t.accent};color:${t.accentTextDark};background:${t.accentLight}"`:'';
    return`<button class="${c}" ${style} onclick="goTo(${i})">${i+1}</button>`;
  }).join('');
  const letters=['A','B','C','D'];
  const opts=q.o.map((op,i)=>{
    let c='';
    if(answered){c=i===q.a?'correct':i===ans[cur]?'wrong':'';}
    return`<button class="opt ${c}" onclick="pick(${i})" ${answered?'disabled':''}><span class="opt-letter">${letters[i]}</span><span class="opt-text">${op}</span></button>`;
  }).join('');
  const timerHTML=timerOn?`<div class="tmr"><span class="tmr-icon">⏱</span><span id="tmr-val" class="tmr-val">${fmt(secsLeft)}</span><div class="tmr-bar"><div id="tmr-fill" class="tmr-fill" style="width:${secsLeft/totalSecs*100}%;background:${t.accent}"></div></div></div>`:'';

  main.innerHTML=`
    ${timerHTML}
    <div class="meta-bar">
      <div class="pill">Q <span>${cur+1}/${TOTAL}</span></div>
      <div class="pill">✓ <span>${score}</span></div>
      <div class="pill">Done <span>${done}/${TOTAL}</span></div>
      <button class="btn" style="font-size:11px;padding:4px 10px;margin-left:auto;border-radius:20px" onclick="showPicker()">⟲ Sections</button>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>Progress</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${t.accent}"></div></div>
    </div>
    <div class="nav-grid">${nav}</div>
    <div class="qcard" style="border-top-color:${t.accent}">
      <span class="badge ${q.d}">${q.d.charAt(0).toUpperCase()+q.d.slice(1)}</span>
      <span class="badge topic">${q.t}</span>
      <p class="qt">${q.q}</p>
      <div class="opts">${opts}</div>
      ${answered?`<div class="exp" style="border-left-color:${t.accent}">💡 ${q.e}</div>`:''}
    </div>
    <div class="nav-row">
      <button class="btn" onclick="goTo(${cur-1})" ${cur===0?'disabled style="opacity:.35;cursor:default"':''}>← Prev</button>
      <div style="display:flex;gap:8px">
        ${cur<TOTAL-1
          ? `<button class="btn btnp" style="background:${t.accent};${!answered?'opacity:.4;cursor:not-allowed':''}" onclick="${answered?`goTo(${cur+1})`:'void(0)'}" ${!answered?'title="Answer this question first"':''}>Next →</button>`
          : answered
            ? `<button class="btn btnp" style="background:${t.accent}" onclick="showRes(false)">See Results</button>`
            : `<button class="btn btnp" style="background:${t.accent};opacity:.4;cursor:not-allowed" title="Answer this question first">See Results</button>`
        }
      </div>
    </div>
  `;
}

function pick(i){
  if(ans[cur]!==null)return;
  ans[cur]=i;
  if(i===qs[cur].a)score++;
  render();
}

function goTo(i){cur=i;render();}

function showRes(timeout){
  clearInterval(timerInterval);
  const t=THEMES[section];
  const pct=Math.round((score/TOTAL)*100);
  const tm={};
  qs.forEach((q,i)=>{
    if(!tm[q.t])tm[q.t]={c:0,n:0};
    tm[q.t].n++;
    if(ans[i]===q.a)tm[q.t].c++;
  });
  let grade,gc;
  if(pct>=80){grade=`Excellent! ${t.emoji}`;gc=t.accent;}
  else if(pct>=60){grade='Good job!';gc='#d97706';}
  else if(pct>=40){grade='Keep practicing';gc='#d97706';}
  else{grade='Needs improvement';gc='#ef4444';}
  const toNote=timeout?`<div style="font-family:'Inter',sans-serif;font-size:12px;padding:8px 14px;background:#fee2e2;color:#b91c1c;border-radius:10px;margin-bottom:1rem;font-weight:500">⏰ Time's up — unanswered questions counted as wrong.</div>`:'';

  // SVG donut ring
  const r=44,circ=2*Math.PI*r,dash=circ*(pct/100),gap=circ-dash;
  const ring=`<svg width="110" height="110" viewBox="0 0 110 110">
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--color-background-secondary)" stroke-width="10"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${gc}" stroke-width="10"
      stroke-dasharray="${dash} ${gap}" stroke-linecap="round" style="transition:stroke-dasharray .8s ease"/>
  </svg>`;

  document.getElementById('main').innerHTML=`
    <div class="res">
      ${toNote}
      <div class="res-ring-wrap">
        <div class="res-ring">
          ${ring}
          <div class="res-ring-label">
            <div class="res-pct" style="color:${gc}">${pct}%</div>
            <div class="res-of">${score}/${TOTAL}</div>
          </div>
        </div>
      </div>
      <div class="ssub">${grade}</div>
      <div class="sgrid">
        <div class="sc"><div class="sl">Correct</div><div class="sv" style="color:#16a34a">${score}</div></div>
        <div class="sc"><div class="sl">Wrong</div><div class="sv" style="color:#ef4444">${TOTAL-score}</div></div>
        <div class="sc"><div class="sl">Score</div><div class="sv" style="color:${gc}">${pct}%</div></div>
      </div>
      <div class="tbd">
        <div class="tbd-title">Performance by topic</div>
        ${Object.entries(tm).map(([tp,v])=>{
          const p=Math.round((v.c/v.n)*100);
          const tc=p>=70?'#16a34a':p>=40?'#d97706':'#ef4444';
          return`<div class="tr">
            <div class="tr-left">
              <div style="color:var(--color-text-primary);font-weight:500;font-size:12.5px">${tp}</div>
              <div class="tr-bar" style="width:${p}%;background:${tc}"></div>
            </div>
            <div class="tr-right" style="color:${tc}">${v.c}/${v.n} · ${p}%</div>
          </div>`;
        }).join('')}
      </div>
      <div class="res-btns">
        <button class="btn btnp" style="background:${t.accent}" onclick="startSetup()">Try Again ↺</button>
        <button class="btn" onclick="showPicker()">⟲ Sections</button>
        <button class="btn" onclick="sendPrompt('I just finished the ${t.name} (${TOTAL} questions). Give me targeted study tips on my weakest topics.')">Study tips ↗</button>
      </div>
    </div>
  `;
}

showPicker();
</script>
