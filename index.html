  {q:"Which country's flag features a red circle on a white background?",o:["China","South Korea","Japan","Singapore"],a:2,t:"Flags",d:"easy",e:"Japan's flag (Nisshōki) features a red circle (representing the sun) on a plain white background."},
  {q:"The flag of South Africa has how many colours?",o:["Three","Four","Five","Six"],a:3,t:"Flags",d:"medium",e:"South Africa's flag has six colours: black, green, yellow, red, white, and blue — making it one of the most colourful national flags in the world."},
  {q:"Which country's flag shows a cedar tree at its centre?",o:["Syria","Jordan","Lebanon","Saudi Arabia"],a:2,t:"Flags",d:"medium",e:"Lebanon's flag features a green cedar tree at its centre, flanked by two horizontal red stripes with a white stripe in the middle."},
  {q:"What is the only country whose flag features a building?",o:["Cambodia","Spain","Portugal","Afghanistan"],a:0,t:"Flags",d:"hard",e:"Cambodia's flag depicts Angkor Wat temple in the centre — the only national flag to feature a building."},
  {q:"Which continent has the most countries whose flags feature the colour red?",o:["Africa","Asia","Europe","South America"],a:2,t:"Flags",d:"hard",e:"Europe has the most national flags featuring red, with over 20 of its countries' flags including the colour."},
  {q:"The flag of the United States has how many stripes?",o:["13","15","50","20"],a:0,t:"Flags",d:"medium",e:"The US flag has 13 stripes (7 red and 6 white), representing the original 13 colonies. The 50 stars represent the current 50 states."},
  {q:"Which country's flag is entirely green — the only single-colour national flag?",o:["Saudi Arabia","Libya (historically)","Pakistan","Iran"],a:1,t:"Flags",d:"hard",e:"Libya under Muammar Gaddafi (1977–2011) had an all-green flag — the only solid-colour national flag in the world. The current flag returned to the earlier red-black-green tricolour."},

  /* ── MORE WORLD FIRSTS ── */
  {q:"Who was the first woman to win a Nobel Prize?",o:["Mother Teresa","Marie Curie","Malala Yousafzai","Wangari Maathai"],a:1,t:"World Firsts",d:"easy",e:"Marie Curie was the first woman to win a Nobel Prize, receiving the Nobel Prize in Physics in 1903."},
  {q:"Which country built the world's first railway?",o:["France","Germany","United States","United Kingdom"],a:3,t:"World Firsts",d:"medium",e:"The United Kingdom built the world's first public steam railway — the Stockton and Darlington Railway — opened in 1825, followed by the Liverpool and Manchester Railway in 1830."},
  {q:"Which was the first country to legalise same-sex marriage?",o:["Canada","Denmark","Netherlands","Sweden"],a:2,t:"World Firsts",d:"medium",e:"The Netherlands became the first country in the world to legalise same-sex marriage in 2001."},
  {q:"The first successful powered aeroplane flight was achieved by whom?",o:["Charles Lindbergh","The Wright Brothers","Louis Blériot","Alberto Santos-Dumont"],a:1,t:"World Firsts",d:"easy",e:"The Wright Brothers (Orville and Wilbur) made the first successful powered aeroplane flight at Kitty Hawk, North Carolina, USA, on December 17, 1903."},
  {q:"Who was the first African American president of the United States?",o:["Bill Clinton","Barack Obama","Colin Powell","Jesse Jackson"],a:1,t:"World Firsts",d:"easy",e:"Barack Obama became the 44th President of the United States in 2009, the first African American to hold the office."},
  {q:"Which country was the first to develop nuclear weapons?",o:["Soviet Union","United Kingdom","Germany","United States"],a:3,t:"World Firsts",d:"easy",e:"The United States developed and used the first nuclear weapons in 1945, during the Manhattan Project, dropping bombs on Hiroshima and Nagasaki, Japan."},
  {q:"The first artificial satellite ever launched into space was called what?",o:["Explorer 1","Vostok 1","Sputnik 1","Luna 1"],a:2,t:"World Firsts",d:"medium",e:"Sputnik 1, launched by the Soviet Union on October 4, 1957, was the first artificial Earth satellite."},

  /* ── MORE WORLD GEOGRAPHY ── */
  {q:"What is the capital of Canada?",o:["Toronto","Vancouver","Ottawa","Montreal"],a:2,t:"World Geography",d:"medium",e:"Ottawa is the capital of Canada. Toronto is the largest city, but Ottawa was chosen as capital in 1857 as a compromise between English and French Canada."},
  {q:"Which river flows through Egypt?",o:["Congo River","Niger River","Nile River","Zambezi River"],a:2,t:"World Geography",d:"easy",e:"The Nile River flows through Egypt, providing the fertile land that sustained ancient Egyptian civilisation."},
  {q:"What is the capital of Brazil?",o:["São Paulo","Rio de Janeiro","Brasília","Salvador"],a:2,t:"World Geography",d:"medium",e:"Brasília is the capital of Brazil. It replaced Rio de Janeiro as capital in 1960, purpose-built in the interior of the country."},
  {q:"Which country has the longest coastline in the world?",o:["Russia","Australia","Norway","Canada"],a:3,t:"World Geography",d:"hard",e:"Canada has the longest coastline of any country in the world, stretching over 202,000 km including mainland and islands."},
  {q:"The Amazon rainforest is primarily located in which country?",o:["Colombia","Venezuela","Peru","Brazil"],a:3,t:"World Geography",d:"easy",e:"About 60% of the Amazon rainforest lies within Brazil. The remaining portions are spread across eight other South American countries."},
  {q:"What is the deepest lake in the world?",o:["Lake Victoria","Lake Baikal","Caspian Sea","Lake Tanganyika"],a:1,t:"World Geography",d:"medium",e:"Lake Baikal in Russia is the world's deepest lake at 1,642 metres deep, and also the largest freshwater lake by volume."},
  {q:"The Sahara Desert spans how many African countries approximately?",o:["3","5","10","11"],a:3,t:"World Geography",d:"hard",e:"The Sahara Desert spans 11 African countries: Morocco, Algeria, Tunisia, Libya, Egypt, Mauritania, Mali, Niger, Chad, Sudan, and Eritrea."},
  {q:"Which sea lies between Europe and Africa?",o:["Red Sea","Black Sea","Mediterranean Sea","Arabian Sea"],a:2,t:"World Geography",d:"easy",e:"The Mediterranean Sea separates Southern Europe from North Africa, and has been a major trade and cultural corridor for thousands of years."},
  {q:"What is the capital city of South Africa? (It has three capitals)",o:["Cape Town only","Pretoria only","Cape Town, Pretoria, and Bloemfontein","Johannesburg, Pretoria, and Cape Town"],a:2,t:"World Geography",d:"hard",e:"South Africa has three capitals: Pretoria (executive/administrative), Cape Town (legislative), and Bloemfontein (judicial)."},
  {q:"The Dead Sea, the lowest point on Earth's surface, borders which countries?",o:["Egypt and Sudan","Israel/Palestine and Jordan","Lebanon and Syria","Saudi Arabia and Iraq"],a:1,t:"World Geography",d:"medium",e:"The Dead Sea borders Israel/Palestine to the west and Jordan to the east, sitting about 430 metres below sea level."},
  {q:"Which country is known as the 'Land of a Thousand Hills'?",o:["Kenya","Ethiopia","Rwanda","Burundi"],a:2,t:"World Geography",d:"medium",e:"Rwanda is known as the 'Land of a Thousand Hills' (Pays des mille collines) due to its hilly landscape."},
  {q:"What is the capital of Kenya?",o:["Mombasa","Nairobi","Kampala","Dar es Salaam"],a:1,t:"World Geography",d:"easy",e:"Nairobi is the capital and largest city of Kenya. It is also the most populous city in East Africa."},
  {q:"Which is the only country that is both an island and a continent?",o:["New Zealand","Indonesia","Australia","Greenland"],a:2,t:"World Geography",d:"easy",e:"Australia is both the world's largest island and its own continent — the only country to occupy an entire continent."},
  {q:"Mount Everest is on the border of which two countries?",o:["India and China","Nepal and China","Nepal and India","Tibet and Pakistan"],a:1,t:"World Geography",d:"medium",e:"Mount Everest sits on the border of Nepal (south side) and China/Tibet (north side)."},
  {q:"Which African country has the largest population?",o:["Ethiopia","South Africa","Egypt","Nigeria"],a:3,t:"World Geography",d:"easy",e:"Nigeria is the most populous country in Africa with over 220 million people, and is projected to become the third most populous country in the world by 2050."},
  {q:"What is the capital of Argentina?",o:["Santiago","Lima","Montevideo","Buenos Aires"],a:3,t:"World Geography",d:"easy",e:"Buenos Aires is the capital and largest city of Argentina."},

  /* ── MORE SCIENCE & DISCOVERY ── */
  {q:"What is the speed of light in a vacuum approximately?",o:["300,000 km/s","150,000 km/s","30,000 km/s","3,000,000 km/s"],a:0,t:"Science & Discovery",d:"medium",e:"Light travels at approximately 299,792 km/s (usually rounded to 300,000 km/s) in a vacuum — the fastest speed possible in the universe."},
  {q:"What is the hardest natural substance on Earth?",o:["Platinum","Iron","Diamond","Quartz"],a:2,t:"Science & Discovery",d:"easy",e:"Diamond is the hardest natural substance on Earth, rating 10 on the Mohs hardness scale."},
  {q:"The human body has how many bones in an adult?",o:["196","206","216","226"],a:1,t:"Science & Discovery",d:"medium",e:"An adult human has 206 bones. Babies are born with around 270-300 bones, which fuse together as they grow."},
  {q:"What does DNA stand for?",o:["Deoxyribonucleic Acid","Dioxynucleic Acid","Dinitrogen Amino Acid","Deoxyribonitric Acid"],a:0,t:"Science & Discovery",d:"medium",e:"DNA stands for Deoxyribonucleic Acid, the molecule that carries the genetic instructions for the development, functioning, and reproduction of all known organisms."},
  {q:"Which planet is known as the Red Planet?",o:["Venus","Saturn","Jupiter","Mars"],a:3,t:"Science & Discovery",d:"easy",e:"Mars is called the Red Planet because of its reddish appearance, caused by iron oxide (rust) on its surface."},
  {q:"How many planets are in our solar system?",o:["7","8","9","10"],a:1,t:"Science & Discovery",d:"easy",e:"There are 8 planets in our solar system: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. Pluto was reclassified as a 'dwarf planet' in 2006."},
  {q:"What is the chemical formula for water?",o:["HO","H2O","H3O","H2O2"],a:1,t:"Science & Discovery",d:"easy",e:"Water's chemical formula is H2O — two hydrogen atoms bonded to one oxygen atom."},
  {q:"Who invented the printing press with movable type in Europe?",o:["Leonardo da Vinci","Johannes Gutenberg","Galileo Galilei","Isaac Newton"],a:1,t:"Science & Discovery",d:"medium",e:"Johannes Gutenberg invented the movable-type printing press around 1440, revolutionising the spread of information in Europe."},
  {q:"What is the powerhouse of the cell?",o:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],a:2,t:"Science & Discovery",d:"easy",e:"The mitochondria is known as the powerhouse of the cell, generating most of the cell's supply of ATP (adenosine triphosphate) used as energy."},
  {q:"Isaac Newton formulated which three fundamental laws of motion?",o:["Laws of gravity, light, and energy","Laws of inertia, acceleration, and action-reaction","Laws of heat, pressure, and velocity","Laws of mass, force, and time"],a:1,t:"Science & Discovery",d:"medium",e:"Newton's three laws of motion cover: (1) inertia — objects remain at rest or in motion unless acted upon; (2) force equals mass times acceleration (F=ma); (3) every action has an equal and opposite reaction."},
  {q:"Which scientist first proposed that the Earth orbits the Sun (heliocentric model)?",o:["Galileo Galilei","Isaac Newton","Nicolaus Copernicus","Johannes Kepler"],a:2,t:"Science & Discovery",d:"medium",e:"Nicolaus Copernicus proposed the heliocentric model in his 1543 work 'De revolutionibus orbium coelestium,' challenging the long-held geocentric view."},
  {q:"What is the most abundant element in the universe?",o:["Oxygen","Carbon","Hydrogen","Helium"],a:2,t:"Science & Discovery",d:"medium",e:"Hydrogen is the most abundant element in the universe, making up about 75% of all normal matter by mass."},
  {q:"Albert Einstein was born in which country?",o:["Austria","Switzerland","United States","Germany"],a:3,t:"Science & Discovery",d:"medium",e:"Albert Einstein was born in Ulm, Kingdom of Württemberg, German Empire, in 1879."},

  /* ── MORE WORLD LEADERS & HISTORY ── */
  {q:"Who was the first Emperor of Rome?",o:["Julius Caesar","Augustus Caesar","Nero","Constantine"],a:1,t:"World Leaders & History",d:"medium",e:"Augustus (born Octavian) became the first Roman Emperor in 27 BC, after defeating Mark Antony and Cleopatra. Julius Caesar was a dictator but never emperor."},
  {q:"The French Revolution began in which year?",o:["1776","1789","1799","1804"],a:1,t:"World Leaders & History",d:"medium",e:"The French Revolution began in 1789 with the storming of the Bastille on July 14, 1789 — still celebrated as Bastille Day in France."},
  {q:"Which country did Adolf Hitler lead during World War II?",o:["Austria","Italy","Germany","Hungary"],a:2,t:"World Leaders & History",d:"easy",e:"Adolf Hitler was the leader of Nazi Germany from 1933 to 1945, leading the country into World War II in 1939."},
  {q:"The Cold War was primarily a conflict between which two superpowers?",o:["USA and China","USA and USSR (Soviet Union)","UK and USSR","USA and Germany"],a:1,t:"World Leaders & History",d:"easy",e:"The Cold War (roughly 1947–1991) was a geopolitical rivalry between the United States and the Soviet Union, characterised by proxy wars, arms races, and ideological competition."},
  {q:"In which year did the Soviet Union officially dissolve?",o:["1989","1990","1991","1992"],a:2,t:"World Leaders & History",d:"medium",e:"The Soviet Union officially dissolved on December 25, 1991, when Mikhail Gorbachev resigned and the USSR formally ceased to exist, splitting into 15 independent republics."},
  {q:"Who was the British Prime Minister during most of World War II?",o:["Neville Chamberlain","Anthony Eden","Clement Attlee","Winston Churchill"],a:3,t:"World Leaders & History",d:"easy",e:"Winston Churchill served as UK Prime Minister from 1940 to 1945 (and again 1951–1955), leading Britain through most of World War II."},
  {q:"The American Declaration of Independence was signed in which year?",o:["1773","1775","1776","1783"],a:2,t:"World Leaders & History",d:"easy",e:"The United States Declaration of Independence was adopted on July 4, 1776 — still celebrated as Independence Day (the 4th of July)."},
  {q:"Cleopatra was the queen of which ancient civilisation?",o:["Rome","Greece","Persia","Egypt"],a:3,t:"World Leaders & History",d:"easy",e:"Cleopatra VII was the last active ruler of the Ptolemaic Kingdom of Egypt, ruling from 51 BC until her death in 30 BC."},
  {q:"Who was the longest-reigning British monarch?",o:["King George V","Queen Victoria","King George III","Queen Elizabeth II"],a:3,t:"World Leaders & History",d:"medium",e:"Queen Elizabeth II reigned for 70 years (1952–2022), making her the longest-reigning British monarch and the longest-reigning female monarch in history."},
  {q:"The apartheid system was a policy of racial segregation in which country?",o:["Zimbabwe","Kenya","South Africa","Namibia"],a:2,t:"World Leaders & History",d:"easy",e:"Apartheid was a system of institutionalised racial segregation enforced in South Africa from 1948 to 1994, dismantled largely through the efforts of Nelson Mandela and the ANC."},
  {q:"Which ancient wonder of the world still exists today?",o:["The Colossus of Rhodes","The Hanging Gardens of Babylon","The Great Pyramid of Giza","The Lighthouse of Alexandria"],a:2,t:"World Leaders & History",d:"medium",e:"Of the Seven Wonders of the Ancient World, only the Great Pyramid of Giza in Egypt remains largely intact today."},
  {q:"The Renaissance, a cultural and intellectual movement, began in which country?",o:["France","Spain","England","Italy"],a:3,t:"World Leaders & History",d:"medium",e:"The Renaissance began in Italy in the 14th century, spreading across Europe. Florence was its epicentre, with figures like Leonardo da Vinci, Michelangelo, and Raphael."},
  {q:"Who was India's first Prime Minister after independence in 1947?",o:["Mahatma Gandhi","Sardar Patel","Jawaharlal Nehru","Subhas Chandra Bose"],a:2,t:"World Leaders & History",d:"medium",e:"Jawaharlal Nehru became India's first Prime Minister on August 15, 1947, serving until his death in 1964."},

  /* ── MORE WORLD ORGANISATIONS ── */
  {q:"What does IMF stand for?",o:["International Monetary Federation","International Monetary Fund","Integrated Market Fund","International Money Forum"],a:1,t:"World Organisations",d:"easy",e:"The IMF (International Monetary Fund) is an international organisation that promotes global monetary cooperation and financial stability, providing loans to countries in economic difficulty."},
  {q:"The headquarters of the World Bank is in which city?",o:["Geneva","New York","Washington D.C.","London"],a:2,t:"World Organisations",d:"medium",e:"The World Bank's headquarters is in Washington D.C., USA. It provides loans and grants to developing countries for development projects."},
  {q:"What does OPEC stand for?",o:["Organisation of Petroleum Exporting Countries","Organisation of Producing and Exporting Corporations","Oil Producers and Exporters Consortium","Organisation for Petroleum and Energy Commerce"],a:0,t:"World Organisations",d:"medium",e:"OPEC stands for Organisation of Petroleum Exporting Countries, founded in 1960 to coordinate oil production and pricing among major oil-producing nations."},
  {q:"UNESCO is a UN agency focused on what?",o:["Food and agriculture","Education, science, and culture","Health and medicine","Trade and commerce"],a:1,t:"World Organisations",d:"medium",e:"UNESCO (United Nations Educational, Scientific and Cultural Organisation) promotes international collaboration in education, science, culture, and communication."},
  {q:"The International Court of Justice is located in which city?",o:["Brussels","Geneva","The Hague","Strasbourg"],a:2,t:"World Organisations",d:"medium",e:"The International Court of Justice (ICJ), the principal judicial organ of the UN, is located in The Hague, Netherlands."},
  {q:"What does INTERPOL stand for?",o:["International Political Organisation","International Criminal Police Organisation","International Protocol Organisation","Integrated Police Liaison"],a:1,t:"World Organisations",d:"medium",e:"INTERPOL stands for the International Criminal Police Organisation. It facilitates cooperation between the police forces of 195 member countries."},
  {q:"The G7 is a group of the world's seven largest what?",o:["Military powers","Oil-producing nations","Advanced economies","Nuclear powers"],a:2,t:"World Organisations",d:"medium",e:"The G7 (Group of Seven) comprises the world's seven largest advanced economies: USA, UK, Canada, France, Germany, Italy, and Japan."},
  {q:"Which country is not a permanent member of the UN Security Council?",o:["France","Germany","Russia","China"],a:1,t:"World Organisations",d:"medium",e:"Germany is not a permanent member of the UN Security Council. The five permanent members (P5) are: USA, UK, France, Russia, and China."},

  /* ── MORE RECORDS & ACHIEVEMENTS ── */
  {q:"Who has won the most Grand Slam tennis titles (men's) in history?",o:["Roger Federer","Rafael Nadal","Novak Djokovic","Pete Sampras"],a:2,t:"Records & Achievements",d:"medium",e:"Novak Djokovic holds the record for most Grand Slam men's singles titles with 24, surpassing Nadal (22) and Federer (20)."},
  {q:"Which country has hosted the Olympic Games the most times?",o:["France","United States","United Kingdom","Japan"],a:1,t:"Records & Achievements",d:"hard",e:"The United States has hosted the Olympic Games the most times — a total of 8 times (including Summer and Winter games)."},
  {q:"What is the best-selling book of all time (excluding religious texts)?",o:["Harry Potter","Don Quixote","The Lord of the Rings","A Tale of Two Cities"],a:1,t:"Records & Achievements",d:"hard",e:"Don Quixote by Miguel de Cervantes (1605) is widely cited as the best-selling novel of all time, with an estimated 500 million copies sold."},
  {q:"Which athlete has won the most Tour de France cycling titles?",o:["Lance Armstrong (stripped)","Chris Froome","Bernard Hinault","Eddy Merckx"],a:3,t:"Records & Achievements",d:"hard",e:"Eddy Merckx of Belgium won the Tour de France a record 5 times (tied with Hinault, Anquetil, and Indurain). Lance Armstrong's 7 titles were stripped due to doping."},
  {q:"The tallest waterfall in the world is Angel Falls, located in which country?",o:["Brazil","Venezuela","Zambia","Zimbabwe"],a:1,t:"Records & Achievements",d:"medium",e:"Angel Falls in Venezuela is the world's highest uninterrupted waterfall, at 979 metres. Victoria Falls (Zambia/Zimbabwe) is the world's largest by volume."},
  {q:"Which is the world's largest religion by number of followers?",o:["Islam","Hinduism","Christianity","Buddhism"],a:2,t:"Records & Achievements",d:"easy",e:"Christianity is the world's largest religion with approximately 2.4 billion followers, representing about 31% of the world's population."},
  {q:"What is the world's most visited country by international tourists (pre-2020)?",o:["United States","Spain","France","China"],a:2,t:"Records & Achievements",d:"medium",e:"France is consistently the world's most visited country by international tourists, receiving around 90 million visitors annually before the pandemic."},

  /* ── MORE WORLD CULTURE ── */
  {q:"Which country is the birthplace of the Olympic Games in ancient times?",o:["Italy","Turkey","Greece","Egypt"],a:2,t:"World Culture",d:"easy",e:"The ancient Olympic Games originated in Olympia, Greece, around 776 BC, held in honour of Zeus."},
  {q:"The Colosseum, an ancient amphitheatre, is located in which city?",o:["Athens","Cairo","Rome","Istanbul"],a:2,t:"World Culture",d:"easy",e:"The Colosseum is located in Rome, Italy. Built between 70–80 AD, it could hold up to 80,000 spectators for gladiatorial contests."},
  {q:"Sushi is a traditional food from which country?",o:["China","South Korea","Thailand","Japan"],a:3,t:"World Culture",d:"easy",e:"Sushi originated in Japan and consists of seasoned rice combined with various ingredients including raw fish, seafood, and vegetables."},
  {q:"Which country is famous for inventing the game of chess?",o:["China","Persia","India","Greece"],a:2,t:"World Culture",d:"medium",e:"Chess originated in India around the 6th century AD, known as 'chaturanga.' It spread to Persia and then to the Arab world before reaching Europe."},
  {q:"The Louvre, one of the world's largest art museums, is in which city?",o:["London","Paris","Madrid","Florence"],a:1,t:"World Culture",d:"easy",e:"The Louvre is located in Paris, France, and is home to the Mona Lisa and thousands of other works of art."},
  {q:"William Shakespeare, widely regarded as the greatest writer in the English language, was born in which town?",o:["London","Oxford","Stratford-upon-Avon","Canterbury"],a:2,t:"World Culture",d:"medium",e:"William Shakespeare was born in Stratford-upon-Avon, England, in 1564."},
  {q:"Carnival, one of the world's biggest annual festivals, is most famously celebrated in which city?",o:["Venice","New Orleans","Port of Spain","Rio de Janeiro"],a:3,t:"World Culture",d:"easy",e:"Rio de Janeiro's Carnival is the world's largest, attracting over 2 million people per day during the annual celebration before Lent."},
  {q:"The Taj Mahal, a UNESCO World Heritage Site, is located in which Indian city?",o:["Delhi","Mumbai","Agra","Jaipur"],a:2,t:"World Culture",d:"medium",e:"The Taj Mahal is in Agra, India. It was built by Mughal Emperor Shah Jahan as a mausoleum for his wife Mumtaz Mahal, completed in 1643."},
  {q:"Which country is the largest producer of crude oil in the world (as of 2020s)?",o:["Saudi Arabia","Russia","Iran","United States"],a:3,t:"World Culture",d:"hard",e:"The United States became the world's largest crude oil producer in the 2010s following the shale oil revolution, surpassing Saudi Arabia and Russia."},
  {q:"What is the name of the currency used across most of Europe?",o:["Pound","Dollar","Euro","Franc"],a:2,t:"World Culture",d:"easy",e:"The Euro is the common currency used by 20 of the 27 European Union member states, introduced in 1999 and physical coins/notes in 2002."},
  {q:"In which country did the religion of Islam originate?",o:["Iran","Saudi Arabia","Egypt","Turkey"],a:1,t:"World Culture",d:"easy",e:"Islam originated in the Arabian Peninsula, in modern-day Saudi Arabia, in the 7th century AD through the Prophet Muhammad."},
  {q:"Which country is the largest democracy in the world?",o:["United States","Brazil","Indonesia","India"],a:3,t:"World Culture",d:"medium",e:"India is the world's largest democracy by population, with over 900 million eligible voters participating in its general elections."},
  {q:"The ancient city of Rome is located on how many hills?",o:["Five","Six","Seven","Nine"],a:2,t:"World Culture",d:"hard",e:"Rome was traditionally built on seven hills: Aventine, Caelian, Capitoline, Esquiline, Palatine, Quirinal, and Viminal."},

  /* ── MORE WORLD SPORTS ── */
  {q:"How many players are on a football (soccer) team on the field?",o:["9","10","11","12"],a:2,t:"World Sports",d:"easy",e:"Each football team has 11 players on the field, including one goalkeeper."},
  {q:"The term 'hat trick' in football refers to what?",o:["Three assists in one game","Three goals scored by one player in one match","Three consecutive wins","Three clean sheets"],a:1,t:"World Sports",d:"easy",e:"A hat trick in football means one player scoring three goals in a single match."},
  {q:"In which sport would you perform a 'slam dunk'?",o:["Volleyball","Tennis","Basketball","American Football"],a:2,t:"World Sports",d:"easy",e:"A slam dunk is a basketball move where a player jumps and forcefully pushes the ball through the basket from above."},
  {q:"Which country won the FIFA World Cup in 2018?",o:["Brazil","Germany","Argentina","France"],a:3,t:"World Sports",d:"medium",e:"France won the 2018 FIFA World Cup in Russia, defeating Croatia 4-2 in the final."},
  {q:"Which country won the FIFA World Cup in 2022?",o:["Brazil","France","Argentina","Morocco"],a:2,t:"World Sports",d:"easy",e:"Argentina won the 2022 FIFA World Cup in Qatar, defeating France on penalties after a 3-3 draw — with Lionel Messi finally lifting the trophy."},
  {q:"The Wimbledon tennis championship is held in which city?",o:["Paris","London","New York","Melbourne"],a:1,t:"World Sports",d:"easy",e:"Wimbledon is held in London, England. It is the oldest tennis Grand Slam, first held in 1877."},
  {q:"How many gold medals did Usain Bolt win across his Olympic career?",o:["6","7","8","9"],a:2,t:"World Sports",d:"medium",e:"Usain Bolt won 8 Olympic gold medals across the 2008, 2012, and 2016 Games. One was later stripped due to a teammate's doping violation."},
  {q:"Which country has won the most Rugby World Cup titles?",o:["England","Australia","South Africa","New Zealand"],a:3,t:"World Sports",d:"medium",e:"New Zealand (All Blacks) has won the Rugby World Cup the most times, with three titles: 1987, 2011, and 2015."},
  {q:"What sport is played at the Masters Tournament held annually in Augusta, Georgia?",o:["Tennis","Golf","Cricket","Baseball"],a:1,t:"World Sports",d:"medium",e:"The Masters Tournament is one of golf's four major championships, held annually at Augusta National Golf Club in Georgia, USA."},
  {q:"How many rings are on the Olympic flag?",o:["4","5","6","7"],a:1,t:"World Sports",d:"easy",e:"The Olympic flag has five interlocking rings of blue, yellow, black, green, and red on a white background, representing the five continents of the world."},
  {q:"Which boxer was known as 'The Greatest' and won the Olympic gold medal in 1960?",o:["Joe Frazier","George Foreman","Sugar Ray Leonard","Muhammad Ali"],a:3,t:"World Sports",d:"medium",e:"Muhammad Ali (then Cassius Clay) won an Olympic gold medal in light heavyweight boxing at the 1960 Rome Olympics, before becoming world heavyweight champion."},
  {q:"What is the maximum score possible in a single game of ten-pin bowling?",o:["200","250","300","350"],a:2,t:"World Sports",d:"medium",e:"A perfect game in ten-pin bowling scores 300 points — 12 consecutive strikes across 10 frames."},
  {q:"Michael Jordan is associated with which NBA team?",o:["LA Lakers","Boston Celtics","Chicago Bulls","Miami Heat"],a:2,t:"World Sports",d:"easy",e:"Michael Jordan is most famously associated with the Chicago Bulls, with whom he won six NBA championships."},

  /* ── MORE FOUNDERS & INVENTORS ── */
  {q:"Who invented the radio?",o:["Thomas Edison","Nikola Tesla","Guglielmo Marconi","Alexander Graham Bell"],a:2,t:"Founders & Inventors",d:"medium",e:"Guglielmo Marconi is credited with inventing and developing radio communication in the 1890s, transmitting the first transatlantic radio signal in 1901."},
  {q:"Who invented the steam engine, a key driver of the Industrial Revolution?",o:["Thomas Edison","James Watt","George Stephenson","Richard Arkwright"],a:1,t:"Founders & Inventors",d:"medium",e:"James Watt significantly improved the steam engine in 1769, making it practical for industrial use and transforming manufacturing and transport."},
  {q:"Who is credited with creating the first successful vaccine (for smallpox)?",o:["Louis Pasteur","Alexander Fleming","Edward Jenner","Robert Koch"],a:2,t:"Founders & Inventors",d:"medium",e:"Edward Jenner developed the first successful smallpox vaccine in 1796, using cowpox material to immunise patients — the foundation of modern vaccination."},
  {q:"Which company makes the Android operating system used by most smartphones?",o:["Apple","Microsoft","Samsung","Google"],a:3,t:"Founders & Inventors",d:"easy",e:"Android is developed by Google. It is the world's most widely used mobile operating system, running on billions of devices made by various manufacturers."},
  {q:"Who co-founded YouTube?",o:["Mark Zuckerberg","Chad Hurley, Steve Chen, and Jawed Karim","Kevin Systrom","Jack Dorsey"],a:1,t:"Founders & Inventors",d:"medium",e:"YouTube was founded in 2005 by Chad Hurley, Steve Chen, and Jawed Karim, all former PayPal employees. Google acquired it in 2006."},
  {q:"The first iPhone was introduced by Steve Jobs in which year?",o:["2005","2006","2007","2008"],a:2,t:"Founders & Inventors",d:"medium",e:"Steve Jobs unveiled the first iPhone at the Macworld Conference in January 2007. It went on sale later that year, revolutionising mobile technology."},
  {q:"Who founded Netflix?",o:["Jeff Bezos","Reed Hastings and Marc Randolph","Elon Musk","Larry Page"],a:1,t:"Founders & Inventors",d:"medium",e:"Netflix was founded in 1997 by Reed Hastings and Marc Randolph, initially as a DVD-by-mail service before pivoting to streaming."},
  {q:"Nikola Tesla, one of history's greatest inventors, was born in which country?",o:["United States","Germany","Austria","Serbia (then part of Austria)"],a:3,t:"Founders & Inventors",d:"hard",e:"Nikola Tesla was born in 1856 in Smiljan, in what is now Croatia (then part of the Austrian Empire), of Serbian descent."},
  {q:"Who invented the aeroplane alongside his brother Wilbur?",o:["Charles Lindbergh","Orville Wright","Louis Blériot","Alberto Santos-Dumont"],a:1,t:"Founders & Inventors",d:"easy",e:"Orville and Wilbur Wright (the Wright Brothers) built and flew the first successful powered aircraft at Kitty Hawk, North Carolina, in 1903."},
  {q:"The founder of the theory of gravity after observing a falling apple was who?",o:["Albert Einstein","Galileo Galilei","Isaac Newton","René Descartes"],a:2,t:"Founders & Inventors",d:"easy",e:"Isaac Newton formulated the law of universal gravitation after — according to popular legend — observing a falling apple, publishing his work in 'Principia Mathematica' in 1687."},

  {q:"What is the capital of Germany?",o:["Frankfurt","Munich","Hamburg","Berlin"],a:3,t:"World Geography",d:"easy",e:"Berlin is the capital and largest city of Germany. It was divided by the Berlin Wall from 1961 to 1989 during the Cold War."},

  {q:"What is the capital of India?",o:["Mumbai","Kolkata","Chennai","New Delhi"],a:3,t:"World Geography",d:"easy",e:"New Delhi is the capital of India. Mumbai (Bombay) is the financial capital and most populous city."},
  {q:"What is the capital of Saudi Arabia?",o:["Mecca","Medina","Jeddah","Riyadh"],a:3,t:"World Geography",d:"medium",e:"Riyadh is the capital and largest city of Saudi Arabia. Mecca and Medina are the holiest cities in Islam."},
  {q:"What is the capital of Spain?",o:["Barcelona","Seville","Valencia","Madrid"],a:3,t:"World Geography",d:"easy",e:"Madrid is the capital and most populous city of Spain."},

  /* ── MISCELLANEOUS GENERAL KNOWLEDGE ── */

  {q:"What is the name of the world's largest technology company by market capitalisation (as of 2024)?",o:["Google (Alphabet)","Amazon","Microsoft","Apple"],a:3,t:"Founders & Inventors",d:"medium",e:"Apple Inc. has consistently ranked as the world's most valuable company by market capitalisation, first exceeding $3 trillion in 2023."},
  {q:"The United Nations was founded in which year?",o:["1941","1943","1945","1948"],a:2,t:"World Organisations",d:"medium",e:"The United Nations was founded on October 24, 1945, after World War II, replacing the League of Nations."},
  {q:"Which African country is home to the Serengeti National Park?",o:["Kenya","Uganda","Tanzania","Botswana"],a:2,t:"World Geography",d:"medium",e:"The Serengeti National Park is located in Tanzania, famous for the annual wildebeest migration — one of the greatest wildlife spectacles on Earth."},
  {q:"What type of gas do plants absorb from the atmosphere during photosynthesis?",o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2,t:"Science & Discovery",d:"easy",e:"Plants absorb carbon dioxide (CO2) from the atmosphere during photosynthesis, converting it into glucose and oxygen."},
  {q:"The Great Barrier Reef, the world's largest coral reef system, is located off the coast of which country?",o:["Indonesia","Philippines","Australia","Papua New Guinea"],a:2,t:"World Geography",d:"medium",e:"The Great Barrier Reef stretches over 2,300 km along the north-eastern coast of Australia, in the Coral Sea."},
  {q:"What does 'www' stand for in a web address?",o:["World Wide Web","World Web Window","Wide World Web","Wireless Web World"],a:0,t:"General Knowledge",d:"easy",e:"'www' stands for World Wide Web, the information system on the internet where documents and resources are accessible through URLs."},
  {q:"How many bones are in a human finger (excluding the thumb)?",o:["2","3","4","5"],a:1,t:"Science & Discovery",d:"hard",e:"Each finger (excluding the thumb) has 3 bones called phalanges: the proximal, middle, and distal phalanx. The thumb only has 2."},

  {q:"What is the world's most widely eaten grain?",o:["Wheat","Maize (corn)","Rice","Barley"],a:2,t:"General Knowledge",d:"medium",e:"Rice is the most widely eaten grain globally, serving as the staple food for more than half the world's population, particularly in Asia."},
  {q:"Which planet has the most moons in our solar system?",o:["Jupiter","Uranus","Neptune","Saturn"],a:3,t:"Science & Discovery",d:"hard",e:"Saturn has the most confirmed moons of any planet, with 146 moons confirmed as of 2023, surpassing Jupiter."},
  {q:"What does the abbreviation 'AI' stand for in technology?",o:["Automated Internet","Artificial Intelligence","Advanced Innovation","Automated Integration"],a:1,t:"General Knowledge",d:"easy",e:"AI stands for Artificial Intelligence — the simulation of human intelligence processes by machines, especially computer systems."},
  {q:"What is the name of the social media platform owned by ByteDance, famous for short videos?",o:["Snapchat","Instagram Reels","TikTok","Vine"],a:2,t:"Founders & Inventors",d:"easy",e:"TikTok is owned by the Chinese company ByteDance, founded by Zhang Yiming. It became one of the world's most downloaded apps."},
  {q:"The Panama Canal connects which two bodies of water?",o:["Atlantic Ocean and Indian Ocean","Pacific Ocean and Caribbean Sea/Atlantic Ocean","Gulf of Mexico and Pacific Ocean","Mediterranean Sea and Red Sea"],a:1,t:"World Geography",d:"medium",e:"The Panama Canal connects the Pacific Ocean to the Caribbean Sea (Atlantic Ocean), allowing ships to avoid sailing around South America."},
  {q:"How many players are on a basketball team on the court at one time?",o:["4","5","6","7"],a:1,t:"World Sports",d:"easy",e:"Each basketball team has 5 players on the court at a time, for a total of 10 players on the court."},
  {q:"Which country is the world's largest exporter of rice?",o:["China","India","Thailand","Vietnam"],a:1,t:"World Geography",d:"hard",e:"India is the world's largest exporter of rice, accounting for over 40% of global rice exports."},
  {q:"What is the name of the process by which water turns into vapour?",o:["Condensation","Precipitation","Evaporation","Sublimation"],a:2,t:"Science & Discovery",d:"easy",e:"Evaporation is the process by which liquid water turns into water vapour (gas) due to heat energy."},
  {q:"How many keys does a standard piano have?",o:["72","76","88","92"],a:2,t:"General Knowledge",d:"medium",e:"A standard piano has 88 keys — 52 white keys and 36 black keys."},
  {q:"Which country is the largest in Africa by land area?",o:["Sudan","Congo","Libya","Algeria"],a:3,t:"World Geography",d:"medium",e:"Algeria is the largest country in Africa by land area, spanning approximately 2.38 million square kilometres."},
  {q:"What is the currency of the United Kingdom?",o:["Euro","Dollar","Pound Sterling","Franc"],a:2,t:"General Knowledge",d:"easy",e:"The United Kingdom uses the Pound Sterling (£), one of the world's oldest currencies still in use and a major global reserve currency."},
  {q:"The Amazon River flows through which continent?",o:["Africa","Asia","North America","South America"],a:3,t:"World Geography",d:"easy",e:"The Amazon River flows through South America, primarily through Brazil. It carries more water than any other river in the world."},
  {q:"Who painted the ceiling of the Sistine Chapel?",o:["Leonardo da Vinci","Raphael","Caravaggio","Michelangelo"],a:3,t:"World Culture",d:"medium",e:"Michelangelo painted the ceiling of the Sistine Chapel in Vatican City between 1508 and 1512, including the famous 'Creation of Adam.'"},
  {q:"What is the name of the international agreement aimed at reducing greenhouse gas emissions signed in 2015?",o:["Kyoto Protocol","Montreal Protocol","Paris Agreement","Copenhagen Accord"],a:2,t:"World Organisations",d:"medium",e:"The Paris Agreement was adopted in December 2015 at COP21. It aims to limit global warming to well below 2°C above pre-industrial levels."},
  {q:"What is the name of the layer of the Earth's atmosphere that protects us from harmful UV radiation?",o:["Troposphere","Stratosphere — ozone layer","Mesosphere","Thermosphere"],a:1,t:"Science & Discovery",d:"medium",e:"The ozone layer sits in the stratosphere, about 15–35 km above Earth's surface. It absorbs most of the Sun's ultraviolet radiation, protecting life on Earth."}

  /* ── CHEMISTRY ── */
  {q:"What is the chemical symbol for iron?",o:["Ir","In","Fe","Fr"],a:2,t:"Chemistry",d:"medium",e:"Iron's chemical symbol is Fe, from the Latin word 'ferrum'. Iron is the most abundant element on Earth by mass."},
  {q:"What is the chemical symbol for sodium?",o:["So","Sd","Sn","Na"],a:3,t:"Chemistry",d:"medium",e:"Sodium's symbol is Na, from the Latin 'natrium'. Sodium is a highly reactive alkali metal and essential for nerve function."},
  {q:"What is the chemical symbol for potassium?",o:["Po","Pt","K","Pm"],a:2,t:"Chemistry",d:"medium",e:"Potassium's symbol is K, from the Latin 'kalium'. It is vital for heart and muscle function."},
  {q:"What is the most abundant gas in Earth's atmosphere?",o:["Oxygen","Carbon dioxide","Nitrogen","Argon"],a:2,t:"Chemistry",d:"easy",e:"Nitrogen makes up about 78% of Earth's atmosphere, followed by oxygen at 21%."},
  {q:"What happens when an acid and a base react together?",o:["They form an explosive compound","Neutralisation — producing salt and water","They both evaporate","The acid becomes stronger"],a:1,t:"Chemistry",d:"medium",e:"When an acid and a base react, neutralisation occurs, producing a salt and water. For example, hydrochloric acid + sodium hydroxide → sodium chloride (table salt) + water."},
  {q:"What is the pH value of pure water?",o:["5","6","7","8"],a:2,t:"Chemistry",d:"easy",e:"Pure water has a pH of exactly 7, making it neutral — neither acidic (below 7) nor basic/alkaline (above 7)."},
  {q:"What is the chemical formula for common table salt?",o:["NaCl","KCl","CaCl2","MgCl2"],a:0,t:"Chemistry",d:"easy",e:"Table salt is sodium chloride with the formula NaCl — one sodium atom bonded to one chlorine atom."},
  {q:"What is the atomic number of carbon?",o:["4","6","8","12"],a:1,t:"Chemistry",d:"medium",e:"Carbon has atomic number 6, meaning it has 6 protons. It is the basis of all organic chemistry and life on Earth."},
  {q:"Which gas is produced during photosynthesis as a by-product?",o:["Carbon dioxide","Hydrogen","Nitrogen","Oxygen"],a:3,t:"Chemistry",d:"easy",e:"Oxygen is the by-product of photosynthesis. Plants split water molecules and release oxygen into the atmosphere — the source of almost all Earth's atmospheric oxygen."},
  {q:"What is dry ice made of?",o:["Frozen water with chemicals","Solid carbon dioxide","Frozen nitrogen","Solid oxygen"],a:1,t:"Chemistry",d:"medium",e:"Dry ice is solid carbon dioxide (CO2). It sublimates (turns directly from solid to gas) at -78.5°C without passing through a liquid phase."},
  {q:"What element has the chemical symbol Hg?",o:["Hydrogen","Magnesium","Mercury","Manganese"],a:2,t:"Chemistry",d:"hard",e:"Hg is the symbol for mercury, from the Latin 'hydrargyrum' meaning 'liquid silver'. Mercury is the only metal that is liquid at room temperature."},
  {q:"Which particle in an atom has no electric charge?",o:["Proton","Electron","Neutron","Positron"],a:2,t:"Chemistry",d:"easy",e:"Neutrons are subatomic particles found in the nucleus alongside protons but carry no electric charge. Protons are positive; electrons are negative."},

  /* ── PHYSICS ── */
  {q:"What is the unit of electric current?",o:["Volt","Watt","Ohm","Ampere"],a:3,t:"Physics",d:"easy",e:"The ampere (A) is the SI unit of electric current. Volt measures electrical potential, Watt measures power, and Ohm measures resistance."},
  {q:"What does Ohm's Law state?",o:["Power = Current × Voltage","Voltage = Current × Resistance","Current = Voltage × Resistance","Resistance = Power × Current"],a:1,t:"Physics",d:"medium",e:"Ohm's Law states that Voltage (V) = Current (I) × Resistance (R), meaning the voltage across a conductor is directly proportional to the current through it."},
  {q:"What is the SI unit of force?",o:["Pascal","Joule","Newton","Watt"],a:2,t:"Physics",d:"easy",e:"The Newton (N) is the SI unit of force, named after Isaac Newton. One Newton is the force required to accelerate 1 kg at 1 m/s²."},
  {q:"What is the SI unit of energy?",o:["Watt","Newton","Pascal","Joule"],a:3,t:"Physics",d:"easy",e:"The Joule (J) is the SI unit of energy, named after James Prescott Joule. One joule equals the work done by a force of one newton over one metre."},
  {q:"What type of energy does a moving object possess?",o:["Potential energy","Chemical energy","Kinetic energy","Nuclear energy"],a:2,t:"Physics",d:"easy",e:"A moving object possesses kinetic energy, which depends on its mass and velocity (KE = ½mv²)."},
  {q:"What is the freezing point of water in Celsius?",o:["-10°C","0°C","4°C","100°C"],a:1,t:"Physics",d:"easy",e:"Water freezes at 0°C (32°F) under standard atmospheric pressure."},
  {q:"What is the boiling point of water in Celsius?",o:["90°C","95°C","100°C","110°C"],a:2,t:"Physics",d:"easy",e:"Water boils at 100°C (212°F) at sea level under standard atmospheric pressure. At higher altitudes, lower pressure causes it to boil at lower temperatures."},
  {q:"Which colour has the longest wavelength in the visible light spectrum?",o:["Violet","Blue","Green","Red"],a:3,t:"Physics",d:"medium",e:"Red has the longest wavelength in the visible spectrum (around 620–750 nm). Violet has the shortest. The order is: ROY G BIV (Red, Orange, Yellow, Green, Blue, Indigo, Violet)."},
  {q:"What is the phenomenon where light bends as it passes from one medium to another?",o:["Reflection","Refraction","Diffraction","Dispersion"],a:1,t:"Physics",d:"medium",e:"Refraction is the bending of light (or any wave) as it passes from one medium to another of different density — for example, a straw appearing bent in a glass of water."},
  {q:"What does E=mc² represent?",o:["Energy equals mass times the speed of sound squared","Energy equals mass times the speed of light squared","Force equals mass times acceleration","Entropy equals mass times chemical change"],a:1,t:"Physics",d:"medium",e:"Einstein's famous equation E=mc² states that energy (E) equals mass (m) times the speed of light (c) squared, showing that mass and energy are interchangeable."},
  {q:"What is absolute zero in Celsius?",o:["-100°C","-200°C","-273.15°C","-300°C"],a:2,t:"Physics",d:"medium",e:"Absolute zero is -273.15°C (or 0 Kelvin), the theoretical lowest possible temperature at which all molecular motion stops."},

  /* ── SPACE & ASTRONOMY ── */

  {q:"Which planet is closest in size to Earth?",o:["Mars","Mercury","Venus","Neptune"],a:2,t:"Space & Astronomy",d:"medium",e:"Venus is the closest planet to Earth in size, with a diameter of about 12,104 km compared to Earth's 12,742 km."},
  {q:"What is a light-year a measure of?",o:["Time","Speed","Distance","Brightness"],a:2,t:"Space & Astronomy",d:"medium",e:"A light-year is a unit of distance — the distance light travels in one year, approximately 9.46 trillion kilometres. It is not a measure of time."},
  {q:"What is the name of the force that keeps planets in orbit around the Sun?",o:["Magnetism","Gravity","Centrifugal force","Electromagnetic force"],a:1,t:"Space & Astronomy",d:"easy",e:"Gravity is the force that keeps planets, moons, and other bodies in orbit. The Sun's massive gravity holds all the planets in the solar system in their orbits."},
  {q:"How many moons does Mars have?",o:["0","1","2","4"],a:2,t:"Space & Astronomy",d:"medium",e:"Mars has two small moons: Phobos and Deimos. They are named after the Greek gods of fear and dread."},
  {q:"What is the name of the largest volcano in the solar system?",o:["Krakatoa","Mount Olympus on Earth","Olympus Mons on Mars","Mauna Loa on Earth"],a:2,t:"Space & Astronomy",d:"medium",e:"Olympus Mons on Mars is the largest volcano in the solar system, standing about 21.9 km high and covering an area the size of France."},
  {q:"What is a black hole?",o:["A star with no light","A region of space with gravity so strong that nothing, not even light, can escape","An empty region of space","A collapsed moon"],a:1,t:"Space & Astronomy",d:"medium",e:"A black hole is a region of space where gravity is so intense that nothing — not even light — can escape it. They form from the collapse of massive stars."},
  {q:"What is the name of the first artificial satellite launched into space?",o:["Explorer 1","Vostok 1","Sputnik 1","Apollo 1"],a:2,t:"Space & Astronomy",d:"medium",e:"Sputnik 1, launched by the Soviet Union on October 4, 1957, was the first artificial satellite to orbit Earth, marking the beginning of the space age."},
  {q:"How long does it take Earth to complete one revolution around the Sun?",o:["24 hours","30 days","365.25 days","100 days"],a:2,t:"Space & Astronomy",d:"easy",e:"Earth takes approximately 365.25 days to complete one orbit around the Sun — which is why we have a leap year every 4 years to account for the extra quarter day."},
  {q:"What causes a solar eclipse?",o:["Earth passes between the Sun and Moon","The Moon passes between Earth and the Sun","The Sun moves behind the Moon's orbit","Earth's shadow falls on the Moon"],a:1,t:"Space & Astronomy",d:"medium",e:"A solar eclipse occurs when the Moon passes between Earth and the Sun, blocking sunlight and casting a shadow on Earth. A lunar eclipse is when Earth's shadow falls on the Moon."},

  {q:"What do we call animals that eat only plants?",o:["Carnivores","Herbivores","Omnivores","Scavengers"],a:1,t:"Biology & Nature",d:"easy",e:"Herbivores are animals that feed exclusively on plants. Examples include cows, elephants, rabbits, and giraffes."},
  {q:"What do we call animals that eat both plants and animals?",o:["Carnivores","Herbivores","Omnivores","Detritivores"],a:2,t:"Biology & Nature",d:"easy",e:"Omnivores eat both plants and animals. Humans, bears, pigs, and chimpanzees are examples of omnivores."},
  {q:"What is the name of the pigment that gives plants their green colour?",o:["Melanin","Chlorophyll","Carotene","Anthocyanin"],a:1,t:"Biology & Nature",d:"easy",e:"Chlorophyll is the green pigment in plant cells that captures light energy for photosynthesis. It absorbs red and blue light but reflects green light."},
  {q:"How many legs does an insect have?",o:["4","6","8","10"],a:1,t:"Biology & Nature",d:"easy",e:"All insects have 6 legs, which is one of the defining characteristics of the insect class. Spiders, which have 8 legs, are arachnids, not insects."},
  {q:"What is the name of the process by which water moves through a plant from roots to leaves?",o:["Osmosis","Photosynthesis","Transpiration","Diffusion"],a:2,t:"Biology & Nature",d:"medium",e:"Transpiration is the process by which water is absorbed by roots, travels up through the stem, and evaporates through tiny pores (stomata) in the leaves."},
  {q:"What is the term for an animal that is active at night?",o:["Diurnal","Nocturnal","Crepuscular","Hibernating"],a:1,t:"Biology & Nature",d:"medium",e:"Nocturnal animals are active at night and sleep during the day. Examples include owls, bats, and bush babies."},
  {q:"Which gas do humans exhale when breathing out?",o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2,t:"Biology & Nature",d:"easy",e:"Humans exhale carbon dioxide (CO2), a waste product of cellular respiration where glucose is broken down to produce energy."},
  {q:"What is the study of fossils called?",o:["Archaeology","Palaeontology","Geology","Anthropology"],a:1,t:"Biology & Nature",d:"medium",e:"Palaeontology is the scientific study of fossils — the preserved remains of ancient organisms — to understand the history of life on Earth."},
  {q:"What is the name of the thread-like structures inside a cell nucleus that carry genetic information?",o:["Ribosomes","Chromosomes","Mitochondria","Vacuoles"],a:1,t:"Biology & Nature",d:"medium",e:"Chromosomes are thread-like structures made of DNA and proteins, found in the cell nucleus. They carry the genetic information (genes) of an organism."},
  {q:"What causes earthquakes?",o:["Volcanic eruptions only","Movement of tectonic plates","Heavy rainfall","Magnetic pole shifts"],a:1,t:"Earth Science",d:"medium",e:"Earthquakes are caused primarily by the movement of tectonic plates — the giant sections of Earth's crust that float on the mantle. When plates collide, separate or slide, energy is released as seismic waves."},
  {q:"What is the Richter scale used to measure?",o:["Wind speed","Ocean depth","Earthquake magnitude","Volcanic temperature"],a:2,t:"Earth Science",d:"medium",e:"The Richter scale (and its successor, the moment magnitude scale) measures the magnitude (energy released) of earthquakes. Each whole number increase represents about 31.6 times more energy."},
  {q:"What is the name of the process by which rocks are broken down by weather and natural forces?",o:["Erosion","Weathering","Sedimentation","Metamorphism"],a:1,t:"Earth Science",d:"medium",e:"Weathering is the breaking down of rocks, soil, and minerals through contact with water, air, and biological organisms. Erosion then transports the broken-down material elsewhere."},
  {q:"What is the difference between a virus and a bacterium?",o:["Viruses are larger than bacteria","Bacteria are non-living; viruses are living","Viruses need a host cell to reproduce; bacteria can reproduce on their own","There is no difference"],a:2,t:"Biology & Nature",d:"hard",e:"Bacteria are single-celled living organisms that can reproduce independently. Viruses are not considered truly living — they are genetic material (DNA or RNA) in a protein coat that must invade a host cell to replicate."}

  {q:"What is SDG 15?",o:["Life Below Water","Life on Land","Climate Action","Zero Hunger"],a:1,t:"SDGs",d:"medium",e:"SDG 15 is 'Life on Land' — to protect, restore and promote sustainable use of terrestrial ecosystems, forests, wetlands, and halt biodiversity loss."},
  {q:"What is SDG 16?",o:["Partnerships for the Goals","Peace, Justice and Strong Institutions","Reduced Inequalities","Sustainable Cities"],a:1,t:"SDGs",d:"medium",e:"SDG 16 is 'Peace, Justice and Strong Institutions' — to promote peaceful and inclusive societies, provide access to justice for all, and build effective institutions."},
  {q:"What is SDG 17?",o:["Reduced Inequalities","Life on Land","Partnerships for the Goals","Climate Action"],a:2,t:"SDGs",d:"medium",e:"SDG 17 is 'Partnerships for the Goals' — to strengthen the means of implementation and revitalise the global partnership for sustainable development."},
  {q:"The SDGs replaced which earlier international development framework?",o:["The Kyoto Protocol","The Millennium Development Goals (MDGs)","The Johannesburg Declaration","Agenda 21"],a:1,t:"SDGs",d:"medium",e:"The SDGs succeeded the Millennium Development Goals (MDGs), which ran from 2000 to 2015. The MDGs had 8 goals; the SDGs expanded this to 17 with 169 targets."},
  {q:"How many targets do the 17 SDGs collectively contain?",o:["100","130","169","200"],a:2,t:"SDGs",d:"hard",e:"The 17 SDGs have 169 targets in total, and 232 unique indicators to measure progress toward achieving them."},
  {q:"Which SDG specifically addresses gender equality?",o:["SDG 3","SDG 4","SDG 5","SDG 6"],a:2,t:"SDGs",d:"easy",e:"SDG 5 addresses Gender Equality, aiming to end all forms of discrimination against women and girls everywhere."},
  {q:"Which SDG deals with climate change?",o:["SDG 11","SDG 12","SDG 13","SDG 14"],a:2,t:"SDGs",d:"easy",e:"SDG 13 — Climate Action — calls for urgent measures to combat climate change and its impacts."},
  {q:"Which SDG is focused on education?",o:["SDG 2","SDG 3","SDG 4","SDG 5"],a:2,t:"SDGs",d:"easy",e:"SDG 4 — Quality Education — aims to ensure inclusive and equitable quality education for all by 2030."},
  {q:"Which SDG calls for 'No Poverty'?",o:["SDG 1","SDG 2","SDG 3","SDG 4"],a:0,t:"SDGs",d:"easy",e:"SDG 1 — No Poverty — is the goal to end poverty in all its forms everywhere."},
  {q:"The SDGs were created to apply to which countries?",o:["Only developing countries","Only African countries","All countries — developed and developing","Only UN Security Council members"],a:2,t:"SDGs",d:"medium",e:"Unlike the MDGs which targeted developing countries, the SDGs are universal — applying to all 193 UN member states, both rich and poor."},
  {q:"Which SDG focuses on access to affordable energy?",o:["SDG 6","SDG 7","SDG 8","SDG 9"],a:1,t:"SDGs",d:"medium",e:"SDG 7 — Affordable and Clean Energy — aims to ensure access to affordable, reliable, sustainable, and modern energy for all."},
  {q:"Which SDG is about 'Life Below Water'?",o:["SDG 12","SDG 13","SDG 14","SDG 15"],a:2,t:"SDGs",d:"medium",e:"SDG 14 — Life Below Water — focuses on the conservation and sustainable use of the world's oceans and marine resources."},
  {q:"Which SDG focuses on reducing inequality within and among nations?",o:["SDG 8","SDG 9","SDG 10","SDG 11"],a:2,t:"SDGs",d:"medium",e:"SDG 10 — Reduced Inequalities — aims to reduce inequality within and among countries, addressing income inequality and social exclusion."},

  /* ── MORE NIGERIA FIRSTS — MISC ── */
  {q:"Who designed the Nigerian flag?",o:["Herbert Macaulay","Taiwo Akinkunmi","Olu Agunloye","Ben Enwonwu"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"medium",e:"Michael Taiwo Akinkunmi designed Nigeria's flag in 1959. He was a 23-year-old engineering student in London when he submitted the winning design for a flag design competition."},
  {q:"What is Nigeria's national animal?",o:["Lion","Eagle","Buffalo","Elephant"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"easy",e:"The eagle is Nigeria's national animal, symbolising strength and power. It is prominently featured on the Nigerian coat of arms."},
  {q:"What is Nigeria's national flower?",o:["Rose","Hibiscus","Costus spectabilis","Water lily"],a:2,t:"Nigeria Firsts – Education & Medicine",d:"hard",e:"Costus spectabilis (yellow trumpet) is Nigeria's national flower, adopted as the country's botanical symbol."},
  {q:"What are the colours on Nigeria's coat of arms?",o:["Green and white","Black, silver and green","White and silver","Red, white, and green"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"hard",e:"Nigeria's coat of arms features a black shield (representing the Niger River), two white wavy bands, two horses (supporters), an eagle on top, and green/white flowers at the base."},
  {q:"Who was the first Nigerian to circumnavigate the globe (sail around the world)?",o:["No Nigerian has done this","Kunle Adeyanju","Gboyega Odubiyi","Siji Awoyemi"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"hard",e:"Kunle Adeyanju completed a solo motorcycle journey around the world in 2022, completing the circuit and becoming the first Nigerian to complete such a global journey on a motorcycle."},
  {q:"Nigeria's first television station, WNTV, was established in which year?",o:["1956","1958","1959","1960"],a:2,t:"Nigeria Firsts – Education & Medicine",d:"medium",e:"The Western Nigeria Television (WNTV) was established in 1959 in Ibadan, making it the first television station in Africa — before stations in the UK, France, or other African countries had such reach."},
      {q:"Who was the first African to be ordained a Christian bishop?",o:["Herbert Macaulay","Samuel Ajayi Crowther","James Africanus Horton","Olaudah Equiano"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"medium",e:"Samuel Ajayi Crowther (c. 1809–1891) was the first African to be ordained as an Anglican bishop, ordained Bishop of the Niger territories in 1864. He was also a Yoruba linguist who translated the Bible."},
    {q:"Nigeria's first indigenous commercial bank was established in which year?",o:["1929","1933","1945","1952"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"hard",e:"The National Bank of Nigeria (later renamed) was established in 1933, making it one of Nigeria's first indigenous commercial banking institutions."},
  {q:"The first Indigenous language newspaper in Nigeria was in which language?",o:["Igbo","Hausa","Yoruba","Efik"],a:2,t:"Nigeria Firsts – Education & Medicine",d:"hard",e:"The Iwe Irohin, founded by Reverend Henry Townsend in 1859 in Abeokuta, was the first Nigerian newspaper and was printed in Yoruba and English — making Yoruba the first indigenous language used in Nigerian print media."},
  {q:"Who was the first Nigerian to receive a PhD?",o:["Nnamdi Azikiwe","Akinola Maja","Obafemi Awolowo","Grace Alele-Williams"],a:0,t:"Nigeria Firsts – Education & Medicine",d:"hard",e:"Nnamdi Azikiwe (Zik) received a PhD from Lincoln University in the USA in 1958 (or earlier — he held multiple degrees), becoming one of the most highly educated Nigerians of his generation. Grace Alele-Williams was the first Nigerian woman to earn a doctorate."},
    {q:"Who won Nigeria's first ever Olympic medal?",o:["Nojim Maiyegun","Rotimi Peters","Sunday Oliseh","Emmanuel Ifeajuna"],a:0,t:"Nigeria Firsts – Sports",d:"hard",e:"Nojim Maiyegun won a bronze medal in boxing (light middleweight) at the 1964 Tokyo Olympics — Nigeria's first Olympic medal ever."},
  {q:"What was the name of the first grammar school in Nigeria?",o:["King's College Lagos","CMS Grammar School Lagos","Baptist Boys' High School","Government College Umuahia"],a:1,t:"Nigeria Firsts – Education & Medicine",d:"medium",e:"The CMS Grammar School, Lagos, founded in 1859, was the first grammar school in Nigeria — and Funmilayo Ransome-Kuti was the first female student admitted to Abeokuta Grammar School (the second oldest)."},
  {q:"What is GCFR as used after Tinubu's name — what does it stand for?",o:["Grand Chancellor of the Federal Republic","Grand Commander of the Order of the Federal Republic","Grand Council of the Federal Republic","General Commander of Federal Resources"],a:1,t:"Heads of Agencies",d:"medium",e:"GCFR stands for Grand Commander of the Order of the Federal Republic — the highest national honour in Nigeria, reserved exclusively for sitting and former Presidents."},
  {q:"GCON — seen after names like the Vice President — stands for what?",o:["Grand Commander of the Order of Nigeria","Grand Council of Nigeria","Grand Companion of the Order of Nigeria","General Commander of Nigeria"],a:0,t:"Heads of Agencies",d:"medium",e:"GCON stands for Grand Commander of the Order of Nigeria — the second highest national honour, typically held by the Vice President and some former heads of state."},
  {q:"Nigeria's Chief of Defence Staff was changed in October 2025. Who is the current CDS?",o:["Lucky Irabor","Christopher Musa","Olufemi Oluyede","Taoreed Lagbaja"],a:2,t:"Heads of Agencies",d:"hard",e:"General Olufemi Oluyede was appointed Chief of Defence Staff by President Tinubu in October 2025, replacing General Christopher Musa. General Waidi Shaibu simultaneously became the new Chief of Army Staff."},
  {q:"Who is the current Chief of Army Staff (as of late 2025)?",o:["Taoreed Lagbaja","Faruk Yahaya","Lucky Irabor","Waidi Shaibu"],a:3,t:"Heads of Agencies",d:"hard",e:"Lt. Gen. Waidi Shaibu was appointed Chief of Army Staff in October 2025 after the death of Gen. Taoreed Lagbaja, who died in September 2025."},
  {q:"The National Security Adviser (NSA) under President Tinubu is who?",o:["Babagana Monguno","Christopher Musa","Nuhu Ribadu","Mohammed Abubakar"],a:2,t:"Heads of Agencies",d:"medium",e:"Nuhu Ribadu — first EFCC Chairman — was appointed National Security Adviser (NSA) by President Tinubu in June 2023. He was previously APC's presidential candidate in 2011."},
        {q:"Who was the first female EFCC Chairman?",o:["Dora Akunyili","Farida Waziri","Ngozi Okonjo-Iweala","Amina Mohammed"],a:1,t:"Heads of Agencies",d:"medium",e:"Farida Mzamber Waziri was the second and first female EFCC Chairman, serving from 2008 to 2011. She succeeded Nuhu Ribadu."},
  {q:"What does JAMB stand for and who is the Registrar?",o:["Joint Admissions and Matriculation Board — Is'haq Oloyede","Junior Academic and Matriculation Bureau — Adamu Umar","Joint Academic Matriculation Bureau — Emeka Eze","Joint Admissions and Merit Board — Chukwuemeka Nweke"],a:0,t:"Heads of Agencies",d:"medium",e:"JAMB stands for Joint Admissions and Matriculation Board. Prof. Is'haq Oloyede has served as JAMB Registrar since 2016 and is widely credited with revolutionising Nigeria's university entrance examination through technology and anti-corruption measures."},
  {q:"What does WAEC stand for?",o:["West African Educational Committee","West African Examinations Council","West African Excellence Council","Western Africa Exam Commission"],a:1,t:"Heads of Agencies",d:"easy",e:"WAEC stands for West African Examinations Council, the body that conducts the WASSCE (West African Senior School Certificate Examination) across Ghana, Nigeria, Sierra Leone, The Gambia, and Liberia."},
  {q:"What does NECO stand for, and what examination does it conduct?",o:["National Examination and Certification Organisation — NECO exam","National Examinations Council — Senior School Certificate Examination","National Educational Council Organisation — National exam","Nigeria External Certificate Organisation — NECO exam"],a:1,t:"Heads of Agencies",d:"easy",e:"NECO stands for National Examinations Council. It conducts the Senior School Certificate Examination (SSCE) in June/July and the National Common Entrance Examination, among others."},
